id: rust-from-first-program
title: "Rust: From First Program to Systems Programming"
subtitle: One course built from five Rust books, from your first println! to threads, async and a web server
description: |
  You will learn Rust step by step: read a short explanation, run the example in the page, change it, then prove it with a quiz or an exercise checked by real tests. Nothing is assumed: every term is explained the first time it appears.

  The course merges *The Rust Programming Language* (2024 edition), *Programming Rust*, *Rust in Action* and *Comprehensive Rust* into one path, with each topic taught once.
ui_lang: en
language: en
level: beginner
source:
  title: "The Rust Programming Language (2024 ed.); Programming Rust, 2nd ed.; Rust in Action; Comprehensive Rust"
  author: "Klabnik, Nichols, Krycho; Blandy, Orendorff, Tindall; McNamara; Geisler et al."
  file: merged
