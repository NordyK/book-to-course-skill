  - type: playground
    id: ch12-play-config
    title: "Config::build with three arguments"
    lang: rust
    md: |
      Extend `Config::build` with an optional third argument `--ignore-case` (in position 3). Any other extra argument is an error: `"unknown option: <arg>"`. More than four arguments is `"too many arguments"`.
    task: "Print `frog/poem.txt/false`, `frog/poem.txt/true`, `error: unknown option: -x` and `error: too many arguments`."
    code: |
      struct Config {
          query: String,
          file_path: String,
          ignore_case: bool,
      }

      impl Config {
          fn build(args: &[String]) -> Result<Config, String> {
              if args.len() < 3 {
                  return Err(String::from("not enough arguments"));
              }
              let query = args[1].clone();
              let file_path = args[2].clone();
              let ignore_case = false;
              Ok(Config { query, file_path, ignore_case })
          }
      }

      fn main() {
          let runs = [
              vec!["minigrep", "frog", "poem.txt"],
              vec!["minigrep", "frog", "poem.txt", "--ignore-case"],
              vec!["minigrep", "frog", "poem.txt", "-x"],
              vec!["minigrep", "frog", "poem.txt", "--ignore-case", "more"],
          ];
          for run in runs {
              let args: Vec<String> = run.iter().map(|s| s.to_string()).collect();
              match Config::build(&args) {
                  Ok(c) => println!("{}/{}/{}", c.query, c.file_path, c.ignore_case),
                  Err(e) => println!("error: {e}"),
              }
          }
      }
    expected_output: |
      frog/poem.txt/false
      frog/poem.txt/true
      error: unknown option: -x
      error: too many arguments
    solution_code: |
      struct Config {
          query: String,
          file_path: String,
          ignore_case: bool,
      }

      impl Config {
          fn build(args: &[String]) -> Result<Config, String> {
              if args.len() < 3 {
                  return Err(String::from("not enough arguments"));
              }
              if args.len() > 4 {
                  return Err(String::from("too many arguments"));
              }
              let query = args[1].clone();
              let file_path = args[2].clone();
              let ignore_case = match args.get(3).map(|s| s.as_str()) {
                  None => false,
                  Some("--ignore-case") => true,
                  Some(other) => return Err(format!("unknown option: {other}")),
              };
              Ok(Config { query, file_path, ignore_case })
          }
      }

      fn main() {
          let runs = [
              vec!["minigrep", "frog", "poem.txt"],
              vec!["minigrep", "frog", "poem.txt", "--ignore-case"],
              vec!["minigrep", "frog", "poem.txt", "-x"],
              vec!["minigrep", "frog", "poem.txt", "--ignore-case", "more"],
          ];
          for run in runs {
              let args: Vec<String> = run.iter().map(|s| s.to_string()).collect();
              match Config::build(&args) {
                  Ok(c) => println!("{}/{}/{}", c.query, c.file_path, c.ignore_case),
                  Err(e) => println!("error: {e}"),
              }
          }
      }
    hints:
      - "Check `args.len() > 4` first."
      - "`args.get(3)` is an `Option<&String>`; `.map(|s| s.as_str())` lets you match on string literals."
      - "`Some(other) => return Err(format!(\"unknown option: {other}\"))` inside the match."

  - type: quiz
    id: ch12-quiz-refactor
    title: Check yourself
    questions:
      - type: multi
        q: "What should stay in `main` after separating concerns?"
        options: ["Calling the argument parser", "Calling `run`", "Handling the error `run` returns", "The search algorithm"]
        answer: [0, 1, 2]
        explanation: "The logic goes in lib.rs, where it can be tested."
      - type: single
        q: "Why is the constructor called `build` and not `new`?"
        options: ["`new` is a keyword", "Programmers expect `new` never to fail; this one returns a Result", "Cargo requires it", "No reason"]
        answer: 1
        explanation: "A naming convention."
      - type: single
        q: "What does `process::exit(1)` do?"
        options: ["Panics", "Ends the program immediately with exit code 1", "Exits the current function", "Restarts main"]
        answer: 1
        explanation: "A non-zero code signals failure to the shell."
      - type: single
        q: "Why does `run` return `Result<(), Box<dyn Error>>`?"
        options: ["So `?` works for any error type, such as io::Error", "Box is faster", "To return the file contents", "It must, for every function in lib.rs"]
        answer: 0
        explanation: "Any error converts into Box<dyn Error>."
      - type: single
        q: "How does `main.rs` refer to `Config` in `lib.rs`?"
        options: ["`use crate::Config;`", "`use minigrep::Config;` (the package name)", "`mod lib;`", "`use super::Config;`"]
        answer: 1
        explanation: "The binary is a separate crate that depends on the library."

  - type: summary
    points:
      - "Keep `main.rs` thin; put logic in `lib.rs` where it can be tested."
      - "Group related values in a struct, like `Config`."
      - "A fallible constructor is called `build` and returns `Result`."
      - "Report errors with a message and `process::exit(1)` instead of panicking."
      - "`run` returns `Result<(), Box<dyn Error>>` so it can use `?` on any error."
terms:
  - term: separation of concerns
    def: "Splitting a program so each part has one job; for CLI tools, parsing and error reporting in main.rs, logic in lib.rs."
  - term: process::exit
    def: "Ends the program immediately with the given exit code."
  - term: exit code
    def: "A number a program returns to the operating system; 0 means success, non-zero failure."
