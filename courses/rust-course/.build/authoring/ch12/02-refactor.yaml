title: "Refactoring: modularity and error handling"
summary: "Separation of concerns for binary projects, extracting a Config struct with a build constructor that returns Result, exiting cleanly with process::exit, a run function returning Box<dyn Error>, and moving the logic into lib.rs."
minutes: 35
source:
  chapter: ch12
  sections: ["TRPL 12.3 Refactoring to Improve Modularity and Error Handling", "TRPL 12.3 Separation of Concerns for Binary Projects", "TRPL 12.3 Extracting the Argument Parser", "TRPL 12.3 Grouping Configuration Values", "TRPL 12.3 The Trade-Offs of Using clone", "TRPL 12.3 Creating a Constructor for Config", "TRPL 12.3 Fixing the Error Handling", "TRPL 12.3 Returning a Result Instead of Calling panic!", "TRPL 12.3 Calling Config::build and Handling Errors", "TRPL 12.3 Extracting Logic from main", "TRPL 12.3 Returning Errors from the run Function", "TRPL 12.3 Splitting Code into a Library Crate"]
blocks:
  - type: text
    md: |
      The Rust community has a standard shape for command-line programs, called **separation of concerns for binary projects**:

      - Split the program into `main.rs` and `lib.rs` and put the program's logic in `lib.rs`.
      - Keep argument parsing small enough to stay in `main.rs` while it is simple; move it to `lib.rs` when it grows.
      - `main` should be left with only: calling the parser, setting up configuration, calling a `run` function in `lib.rs`, and handling the error if `run` returns one.

      `main` cannot be tested directly; everything in `lib.rs` can. This lesson reshapes minigrep step by step.

  - type: stepper
    title: From a long main to Config::build
    steps:
      - title: "1. Extract the parser"
        md: "Move parsing into a function that returns both values. `main` now says *what* it wants, not *how* to get it."
        code: |
          fn parse_config(args: &[String]) -> (&str, &str) {
              let query = &args[1];
              let file_path = &args[2];
              (query, file_path)
          }
      - title: "2. Group the values in a struct"
        md: "The two values belong together: they are the program's configuration. A struct gives them names. Owning `String`s with `clone` keeps lifetimes simple; for two short strings the copy cost is negligible. Chapter 13 removes the clones."
        code: |
          struct Config {
              query: String,
              file_path: String,
          }

          fn parse_config(args: &[String]) -> Config {
              let query = args[1].clone();
              let file_path = args[2].clone();
              Config { query, file_path }
          }
      - title: "3. Make it a constructor"
        md: "A function that creates a `Config` belongs to `Config`. It is called `build` rather than `new`, because programmers expect `new` never to fail."
        code: |
          impl Config {
              fn build(args: &[String]) -> Result<Config, &'static str> {
                  if args.len() < 3 {
                      return Err("not enough arguments");
                  }
                  let query = args[1].clone();
                  let file_path = args[2].clone();
                  Ok(Config { query, file_path })
              }
          }
      - title: "4. Handle the error in main"
        md: "`unwrap_or_else` runs the closure on `Err`. `process::exit(1)` stops the program immediately with a non-zero exit code, which tells shells and scripts that it failed. No panic message, no backtrace hint: just the problem."
        code: |
          use std::process;

          let config = Config::build(&args).unwrap_or_else(|err| {
              println!("Problem parsing arguments: {err}");
              process::exit(1);
          });

  - type: code
    lang: bash
    code: |
      $ cargo run
      Problem parsing arguments: not enough arguments
    explain: "Compare that with `index out of bounds: the len is 1 but the index is 1` from before."

  - type: callout
    kind: note
    title: "Why &'static str?"
    md: "The error messages are string literals, which live for the whole program, so `&'static str` is the simplest error type here. A larger program would use an error enum, as in chapter 9."

  - type: text
    title: Extracting run
    md: |
      Next, move everything that is not configuration or error handling into a `run` function. It returns `Result<(), Box<dyn Error>>`: `Ok(())` when everything worked, otherwise **any** error (chapter 9). With that return type, `expect` becomes `?`:

  - type: code
    lang: rust
    file: src/lib.rs
    code: |
      use std::error::Error;
      use std::fs;

      pub struct Config {
          pub query: String,
          pub file_path: String,
      }

      impl Config {
          pub fn build(args: &[String]) -> Result<Config, &'static str> {
              if args.len() < 3 {
                  return Err("not enough arguments");
              }
              let query = args[1].clone();
              let file_path = args[2].clone();
              Ok(Config { query, file_path })
          }
      }

      pub fn run(config: Config) -> Result<(), Box<dyn Error>> {
          let contents = fs::read_to_string(config.file_path)?;
          println!("With text:\n{contents}");
          Ok(())
      }
    explain: "The struct, its fields, `build` and `run` are `pub` so the binary crate can use them. Returning `Ok(())` is the idiomatic way to say \"done, nothing to return\"."

  - type: code
    lang: rust
    file: src/main.rs
    code: |
      use std::env;
      use std::process;

      use minigrep::Config;

      fn main() {
          let args: Vec<String> = env::args().collect();

          let config = Config::build(&args).unwrap_or_else(|err| {
              println!("Problem parsing arguments: {err}");
              process::exit(1);
          });

          println!("Searching for {}", config.query);
          println!("In file {}", config.file_path);

          if let Err(e) = minigrep::run(config) {
              println!("Application error: {e}");
              process::exit(1);
          }
      }
    explain: "`main.rs` is a separate crate that uses the library by its package name, `minigrep`. `run` returns `()` on success, so there is nothing to unwrap: `if let Err(e)` handles only the failure. (Lesson 4 changes these `println!` calls to `eprintln!`.)"

