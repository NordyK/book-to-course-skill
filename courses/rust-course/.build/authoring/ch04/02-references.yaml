title: "References and borrowing"
summary: "Use a value without taking ownership: shared references (&T), mutable references (&mut T), the two borrowing rules, and why dangling references cannot exist in Rust."
minutes: 35
source:
  chapter: ch04
  sections: ["TRPL 4.2 References and Borrowing", "TRPL 4.2 Mutable References", "TRPL 4.2 Dangling References", "TRPL 4.2 The Rules of References", "PR ch5 References to Values", "PR ch5 Working with References", "PR ch5 Sharing Versus Mutation", "RiA 4.3 Resolving ownership issues", "CR Day 3 Borrowing"]
blocks:
  - type: text
    md: |
      At the end of the last lesson, finding the length of a String meant moving it into a function and getting it back. A **reference** removes that dance. A reference is like a pointer: an address you can follow to reach data owned by someone else. Unlike a raw pointer, a reference is guaranteed by the compiler to point to a valid value for as long as the reference exists.

      Creating a reference is called **borrowing**. As in real life, when you borrow something you do not own it, and you have to give it back.

  - type: code
    lang: rust
    code: |
      fn main() {
          let s1 = String::from("hello");
          let len = calculate_length(&s1);
          println!("The length of '{s1}' is {len}.");
      }

      fn calculate_length(s: &String) -> usize {
          s.len()
      }
    output: "The length of 'hello' is 5."
    explain: "`&s1` creates a reference to `s1` without moving it, and the parameter type `&String` says \"a reference to a String\". When `s` goes out of scope at the end of `calculate_length`, nothing is dropped, because `s` never owned the String. `s1` is still valid afterwards."

  - type: svg
