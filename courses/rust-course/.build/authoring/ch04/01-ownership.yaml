  - type: text
    md: |
      If both `s1` and `s2` stayed valid, both would try to free the same heap memory when they go out of scope. That is a **double free**, one of the classic memory-safety bugs. Rust avoids it by treating `let s2 = s1;` as a **move**: ownership of the heap text passes to `s2`, and `s1` can no longer be used. Nothing on the heap is copied, so a move is cheap no matter how big the text is.

  - type: code
    lang: rust
    file: src/main.rs
    code: |
      fn main() {
          let s1 = String::from("hello");
          let s2 = s1;
          println!("{s1}, world!");
      }
    output: |
      error[E0382]: borrow of moved value: `s1`
       --> src/main.rs:4:16
        |
      2 |     let s1 = String::from("hello");
        |         -- move occurs because `s1` has type `String`, which does not implement the `Copy` trait
      3 |     let s2 = s1;
        |              -- value moved here
      4 |     println!("{s1}, world!");
        |                ^^ value borrowed here after move
        |
      help: consider cloning the value if the performance cost is acceptable
        |
      3 |     let s2 = s1.clone();
        |                ++++++++
    output_label: Compiler output
    explain: "The message tells the whole story in three labels: why it moved (`String` is not `Copy`), where it moved, and where you tried to use it afterwards. Learn to read these three lines; you will see them often in your first weeks."

  - type: callout
    kind: note
    title: "Assigning a new value drops the old one"
    md: "`let mut s = String::from(\"hello\"); s = String::from(\"ahoy\");` frees the memory of `\"hello\"` immediately, because nothing owns it any more. You do not have to do anything."

  - type: text
    title: Clone
    md: |
      When you really do want a second, independent copy of the heap data, ask for it explicitly with `.clone()`. Cloning a big value can be expensive, and the visible `clone()` call is Rust's way of making that cost obvious when you read the code.

  - type: code
    lang: rust
    code: |
      fn main() {
          let s1 = String::from("hello");
          let s2 = s1.clone();
          println!("s1 = {s1}, s2 = {s2}");
      }
    output: "s1 = hello, s2 = hello"

  - type: text
    title: Copy types
    md: |
      Why did `let y = x;` work for integers? Because integers live entirely on the stack, and copying them is as cheap as moving them. Types like that implement the **`Copy`** trait, and assigning them copies instead of moving. The original stays valid.

      `Copy` types: all integer types, `bool`, all floating-point types, `char`, and tuples and arrays that contain only `Copy` types, such as `(i32, f64)` or `[u8; 4]`. A type that owns heap memory, like `String`, can never be `Copy`.

  - type: table
    title: "What happens on `let b = a;`"
    headers: ["Type of `a`", "Result", "Can you still use `a`?"]
    rows:
      - ["`i32`, `f64`, `bool`, `char`", "copy", "yes"]
      - ["`(i32, bool)`, `[u8; 4]`", "copy (all parts are `Copy`)", "yes"]
      - ["`String`", "move", "no"]
      - ["`(i32, String)`", "move (one part is not `Copy`)", "no"]
      - ["`a.clone()` of a `String`", "deep copy of the heap data", "yes"]

  - type: text
    title: Ownership and functions
    md: |
      Passing a value to a function works exactly like assigning it to a variable: a `String` is **moved** into the function's parameter, and an `i32` is copied. Returning a value moves it out to the caller.

  - type: stepper
    title: Follow the ownership
    lang: rust
    steps:
      - title: "s comes into scope"
        md: "`s` owns a heap-allocated String."
        code: |
          fn main() {
              let s = String::from("hello");
              takes_ownership(s);
              let x = 5;
              makes_copy(x);
              println!("{x}");
          }

          fn takes_ownership(some_string: String) {
              println!("{some_string}");
          }

          fn makes_copy(some_integer: i32) {
              println!("{some_integer}");
          }
        highlight: [2]
      - title: "s moves into the function"
        md: "Ownership passes to the parameter `some_string`. From this line on, using `s` in `main` would be a compile error."
        code: |
          fn main() {
              let s = String::from("hello");
              takes_ownership(s);
              let x = 5;
              makes_copy(x);
              println!("{x}");
          }

          fn takes_ownership(some_string: String) {
              println!("{some_string}");
          }

          fn makes_copy(some_integer: i32) {
              println!("{some_integer}");
          }
        highlight: [3, 9]
      - title: "The function ends: drop"
        md: "`some_string` goes out of scope at the closing brace of `takes_ownership`, so the String is dropped and its heap memory freed, there and not in `main`."
        code: |
          fn main() {
              let s = String::from("hello");
              takes_ownership(s);
              let x = 5;
              makes_copy(x);
              println!("{x}");
          }

          fn takes_ownership(some_string: String) {
              println!("{some_string}");
          }

          fn makes_copy(some_integer: i32) {
              println!("{some_integer}");
          }
        highlight: [11]
      - title: "x is copied"
        md: "`i32` is `Copy`, so `makes_copy` gets its own copy and `x` stays usable in `main`."
        code: |
          fn main() {
              let s = String::from("hello");
              takes_ownership(s);
              let x = 5;
              makes_copy(x);
              println!("{x}");
          }

          fn takes_ownership(some_string: String) {
              println!("{some_string}");
          }

          fn makes_copy(some_integer: i32) {
              println!("{some_integer}");
          }
        highlight: [4, 5, 6]

  - type: text
    title: Giving it back
    md: |
      A function can return ownership. That works, but threading every value in and back out quickly gets tedious, as this example shows:

  - type: code
    lang: rust
    code: |
      fn main() {
          let s1 = String::from("hello");
          let (s2, len) = calculate_length(s1);
          println!("The length of '{s2}' is {len}.");
      }

      fn calculate_length(s: String) -> (String, usize) {
          let length = s.len();
          (s, length) // give the String back along with the answer
      }
    output: "The length of 'hello' is 5."
    explain: "All we wanted was the length, yet we had to pass the String in, get it back out in a tuple, and give it a new name. The next lesson shows the proper tool for \"let me look at this without taking it\": a **reference**."

  - type: playground
    id: ch04-play-cubesat
    title: "The satellite that vanished"
    lang: rust
    md: |
      Adapted from *Rust in Action*. A ground station checks each satellite's status twice, but `check_status` takes ownership of the satellite name, so the second round does not compile. Run it and read the error. Then fix it **without** using `clone()`: make `check_status` return the name back together with the status, and rebind the variable on each call. The program should print the two lines shown in the task.
    task: "Print `sat-a: ok` twice, once per round, without calling clone()."
    code: |
      fn check_status(sat: String) -> &'static str {
          if sat.is_empty() { "unknown" } else { "ok" }
      }

      fn main() {
          let sat_a = String::from("sat-a");
          let status = check_status(sat_a);
          println!("{sat_a}: {status}");
          let status = check_status(sat_a);
          println!("{sat_a}: {status}");
      }
    starter_ok: compile_error
    expected_output: |
      sat-a: ok
      sat-a: ok
    solution_code: |
      fn check_status(sat: String) -> (String, &'static str) {
          let status = if sat.is_empty() { "unknown" } else { "ok" };
          (sat, status)
      }

      fn main() {
          let sat_a = String::from("sat-a");
          let (sat_a, status) = check_status(sat_a);
          println!("{sat_a}: {status}");
          let (sat_a, status) = check_status(sat_a);
          println!("{sat_a}: {status}");
      }
    hints:
      - "Change the return type to a tuple: `-> (String, &'static str)`, and return `(sat, status)`."
      - "In `main`, shadow the variable on each call: `let (sat_a, status) = check_status(sat_a);`"
      - "This works but is clumsy. Lesson 2 replaces it with `fn check_status(sat: &String)`."

  - type: reveal
    prompt: "Why does Rust move a String instead of copying it, as Python or Java appear to do?"
    md: |
      Copying would mean duplicating the heap data on every assignment and every function call, which would be slow for big values and surprising. Sharing the heap data between two owners without copying (what garbage-collected languages do) needs a runtime to know when the last user is gone. A move gives you the speed of sharing and the safety of a single owner: exactly one variable is responsible for freeing the memory, and the compiler knows which.

  - type: exercise
    id: ch04-ex-ownership
    exercise_dir: ch04-ownership
    title: "Pass, return and clone"
    difficulty: easy
    goal: "Write functions that take ownership of a String and hand back what the caller needs."
    behavior: |
      - `pub fn shout(s: String) -> String`: the same text in capital letters, with `!` added at the end. It takes ownership of `s` and may reuse it.
      - `pub fn join_words(a: String, b: String) -> String`: `a`, a space, then `b`.
      - `pub fn twice(s: &str) -> (String, String)`: two independent Strings containing the same text (you will need `String::from` or `.to_string()`, and `.clone()`).
    examples:
      - input: "shout(String::from(\"hello\"))"
        output: "\"HELLO!\""
      - input: "join_words(String::from(\"ground\"), String::from(\"station\"))"
        output: "\"ground station\""
      - input: "twice(\"sat\")"
        output: "(\"sat\", \"sat\")"
    hints:
      - "`s.to_uppercase()` returns a new String. Then `push('!')` onto it, or use `format!(\"{}!\", ...)`."
      - "`join_words` can take `mut a`, then `a.push(' ');` and `a.push_str(&b);` and return `a`. (The `&` is next lesson's topic; `push_str` wants to look at `b`, not own it.)"
      - "`twice`: `let first = String::from(s); let second = first.clone(); (first, second)`."
    rust:
      starter: |
        /// The text in capital letters with "!" at the end.
        pub fn shout(s: String) -> String {
            todo!()
        }

        /// "a b": the two words joined by one space.
        pub fn join_words(a: String, b: String) -> String {
            todo!()
        }

        /// Two separate Strings holding the same text.
        pub fn twice(s: &str) -> (String, String) {
            todo!()
        }
      tests: |
        use super::*;

        #[test]
        fn shouting() {
            assert_eq!(shout(String::from("hello")), "HELLO!", "shout(\"hello\")");
            assert_eq!(shout(String::new()), "!", "shout of an empty String");
        }

        #[test]
        fn joining() {
            assert_eq!(join_words(String::from("ground"), String::from("station")), "ground station");
            assert_eq!(join_words(String::from("a"), String::new()), "a ", "an empty second word still gets the space");
        }

        #[test]
        fn two_independent_copies() {
            let (mut a, b) = twice("sat");
            assert_eq!((a.as_str(), b.as_str()), ("sat", "sat"), "twice(\"sat\")");
            a.push('!');
            assert_eq!(b, "sat", "changing the first must not change the second");
        }
      solution: |
        /// The text in capital letters with "!" at the end.
        pub fn shout(s: String) -> String {
            let mut loud = s.to_uppercase();
            loud.push('!');
            loud
        }

        /// "a b": the two words joined by one space.
        pub fn join_words(mut a: String, b: String) -> String {
            a.push(' ');
            a.push_str(&b);
            a
        }

        /// Two separate Strings holding the same text.
        pub fn twice(s: &str) -> (String, String) {
            let first = String::from(s);
            let second = first.clone();
            (first, second)
        }
    solution_explain: "`join_words` reuses `a`'s heap buffer instead of allocating a new String: since the function owns `a`, it may change it. `b` is dropped when the function returns. In `twice`, `clone` is the only way to get two owners of equal text."

  - type: quiz
    id: ch04-quiz-ownership
    title: Check yourself
    questions:
      - type: single
        q: "Which statement about the heap is true?"
        options: ["Every value in Rust is on the heap", "Data whose size can change, like a String's text, is stored on the heap", "The heap is faster than the stack", "Heap memory is freed by a garbage collector in Rust"]
        answer: 1
        explanation: "Growable data goes on the heap. Rust frees it when the owner goes out of scope; there is no garbage collector."
      - type: single
        q: "After `let a = String::from(\"x\"); let b = a;`, what happens if you use `a`?"
        options: ["It prints `x`", "It prints an empty string", "Compile error: value used after move", "A panic at run time"]
        answer: 2
        explanation: "Ownership moved to `b`. The compiler rejects any later use of `a`."
      - type: multi
        q: "Which types are `Copy`?"
        options: ["`u64`", "`String`", "`(char, bool)`", "`[i32; 3]`", "`(i32, String)`"]
        answer: [0, 2, 3]
        explanation: "Plain numbers, `char`, `bool`, and tuples or arrays made only of `Copy` types are `Copy`. Anything containing a `String` is not."
      - type: single
        q: "When is the memory of `s` freed here?"
        code: |
          fn eat(s: String) {
              println!("{s}");
          }
          fn main() {
              let s = String::from("hi");
              eat(s);
              println!("done");
          }
        lang: rust
        options: ["At the end of `main`", "At the end of `eat`", "Never, it leaks", "When the program exits"]
        answer: 1
        explanation: "`s` moved into `eat`, so it is dropped when `eat`'s parameter goes out of scope."
      - type: truefalse
        q: "A move copies all of a String's heap data to the new owner."
        answer: false
        explanation: "Only the pointer, length and capacity (on the stack) are copied. That is why a move is cheap."
      - type: fill
        q: "To make a deep copy of a String so both variables stay usable, call `.______()`."
        answer: ["clone"]
        explanation: "`clone` duplicates the heap data."

  - type: summary
    points:
      - "Stack: fast, fixed-size, last in first out. Heap: for data whose size is unknown or changes, reached through a pointer."
      - "Rules: every value has one owner; when the owner goes out of scope, the value is dropped."
      - "Assigning or passing a non-`Copy` value like `String` **moves** it; the old name can no longer be used."
      - "`Copy` types (numbers, `bool`, `char`, and tuples/arrays of them) are copied instead."
      - "`.clone()` makes an explicit, possibly expensive, deep copy."
      - "Functions take ownership of what they are given and can give it back by returning it."
terms:
  - term: ownership
    def: "Rust's system for memory management: each value has exactly one owner, and it is freed when the owner goes out of scope."
  - term: move
    def: "Transferring ownership of a value to another variable or function; the original can no longer be used."
  - term: drop
    def: "Freeing a value's resources when its owner goes out of scope; Rust inserts the call automatically."
  - term: Copy
    def: "A trait for types that are duplicated by simple bit copying (numbers, bool, char); assigning them copies instead of moving."
  - term: clone
    def: "An explicit deep copy of a value, including its heap data."
  - term: heap
    def: "Memory for data whose size is not known at compile time, allocated on request and reached through a pointer."
  - term: stack
    def: "Memory for fixed-size values, managed last in, first out; very fast."
