title: "Ownership: who cleans up"
summary: "Where values live, the three ownership rules, and what moving, copying, cloning and dropping mean, including when you pass values to functions."
minutes: 35
source:
  chapter: ch04
  sections: ["TRPL 4.1 What Is Ownership?", "TRPL 4.1 The Stack and the Heap", "TRPL 4.1 Ownership Rules", "TRPL 4.1 Memory and Allocation", "TRPL 4.1 Ownership and Functions", "PR ch4 Ownership", "PR ch4 Moves", "PR ch4 Copy Types", "RiA 4.1-4.3 CubeSat ground station", "CR Day 3 Memory Management"]
blocks:
  - type: text
    md: |
      Every program has to manage memory: get it when it needs to store something, and give it back when it is finished. Languages solve this in one of two ways:

      - **Garbage collection** (Java, Python, Go, JavaScript): a runtime looks for memory nobody uses any more and frees it. Easy to use, but it costs run time and memory, and you do not decide when cleanup happens.
      - **Manual management** (C, C++): you allocate and free memory yourself. Fast, but forget to free and you leak; free twice or use memory after freeing it and you get crashes and security holes.

      Rust takes a third way. Memory is managed through a set of **ownership** rules that the compiler checks. If a rule is broken, the program does not compile. When it does compile, the cleanup code is placed exactly where it belongs, with no garbage collector running in the background. Ownership is the topic that makes Rust feel different at first, and the one that pays off most once it clicks.

  - type: text
    title: The stack and the heap
    md: |
      To see why ownership exists, you need a rough picture of the two places a program keeps its data.

      The **stack** stores values in the order they arrive and removes them in the opposite order, like a stack of plates: last in, first out. Everything on the stack must have a size known when the program is compiled. Pushing and popping is extremely fast, because the place for new data is always the top.

      The **heap** is for data whose size is unknown when compiling, or which can change: text typed by a user, a list that grows. You ask the memory allocator for space, it finds a free block big enough and gives you its address, a **pointer**. The pointer has a fixed size, so it can live on the stack, while the data it points to lives on the heap. Allocating and reading through a pointer is slower than using the stack.

  - type: callout
    kind: key
    title: What ownership is really about
    md: "Keeping track of which code is using which data on the heap, making sure nothing is duplicated by accident, and freeing heap memory that is no longer used. Once you understand ownership, you rarely need to think about the stack and the heap directly, but knowing they exist explains every rule that follows."

  - type: text
    title: The three rules
    md: |
      1. Each value in Rust has an **owner**.
      2. There can only be **one owner at a time**.
      3. When the owner goes **out of scope**, the value is **dropped** (its memory is freed).

      A **scope** is the region of code where a name is valid, usually the `{ ... }` block it was declared in.

  - type: code
    lang: rust
    code: |
      fn main() {
          {                      // s is not valid here, it is not declared yet
              let s = "hello";   // s is valid from this point forward
              println!("{s}");
          }                      // the scope is over, and s is no longer valid
      }
    output: "hello"

  - type: text
    title: "A type that lives on the heap: String"
    md: |
      String literals like `"hello"` are baked into the program file, so they never need to be freed, and they cannot change. To show ownership in action we need text that lives on the heap: the `String` type. You create one from a literal with `String::from`, and unlike a literal it can grow:

  - type: code
    lang: rust
    code: |
      fn main() {
          let mut s = String::from("hello");
          s.push_str(", world!"); // appends a literal to the String
          println!("{s}");
      }
    output: "hello, world!"
    explain: "`String::from` asks the allocator for heap memory. Someone must give it back. In Rust, that happens automatically when `s` goes out of scope: Rust calls a special function, `drop`, at the closing brace. C++ programmers know this pattern as RAII."

  - type: text
    title: Move
    md: |
      Here is where Rust differs from other languages. With integers, copying a variable copies the value, and both variables are usable:

      ```rust
      let x = 5;
      let y = x;          // y is a copy of 5; x is still 5
      ```

      A `String` is three parts on the stack, a pointer to the heap text, a length and a capacity, plus the text itself on the heap:

  - type: svg
    caption: "`let s1 = String::from(\"hello\"); let s2 = s1;` copies the three stack fields. Both would point at the same heap text, so Rust marks `s1` as no longer valid: the value has **moved** to `s2`."
    svg: |
      <svg viewBox='0 0 560 230' xmlns='http://www.w3.org/2000/svg' font-family='ui-monospace, monospace' font-size='13'>
        <g fill='none' stroke='currentColor' stroke-width='1'>
