      tests: |
        use super::*;

        #[test]
        fn leap_years() {
            assert!(is_leap(2024) && is_leap(2000) && !is_leap(1900) && !is_leap(2023));
            assert_eq!(days_in_month(2024, 2), 29);
            assert_eq!(days_in_month(2023, 2), 28);
            assert_eq!(days_in_month(2023, 4), 30);
            assert_eq!(days_in_month(2023, 12), 31);
        }

        #[test]
        fn civil_roundtrip() {
            assert_eq!(days_from_civil(1970, 1, 1), 0);
            assert_eq!(days_from_civil(2000, 3, 1), 11_017);
            assert_eq!(civil_from_days(-1), (1969, 12, 31));
            for z in (-800_000..800_000).step_by(997) {
                let (y, m, d) = civil_from_days(z);
                assert_eq!(days_from_civil(y, m, d), z);
            }
        }

        #[test]
        fn formatting() {
            assert_eq!(to_rfc3339(0), "1970-01-01T00:00:00Z");
            assert_eq!(to_rfc3339(1_709_211_909), "2024-02-29T13:05:09Z");
            assert_eq!(to_rfc3339(-86_401), "1969-12-30T23:59:59Z");
        }

        #[test]
        fn parsing() {
            assert_eq!(parse_rfc3339("2024-02-29T13:05:09Z"), Some(1_709_211_909));
            assert_eq!(parse_rfc3339("1970-01-01T00:00:00Z"), Some(0));
            for bad in [
                "2023-02-29T00:00:00Z",
                "2024-13-01T00:00:00Z",
                "2024-04-31T00:00:00Z",
                "2024-01-01T24:00:00Z",
                "2024-01-01T00:60:00Z",
                "2024-01-01 00:00:00Z",
                "2024-01-01T00:00:00",
                "24-01-01T00:00:00Z",
                "2024-0a-01T00:00:00Z",
            ] {
                assert_eq!(parse_rfc3339(bad), None, "{bad}");
            }
            for t in [0i64, 951_782_400, 4_102_444_799, -1_000_000] {
                assert_eq!(parse_rfc3339(&to_rfc3339(t)), Some(t));
            }
        }

        #[test]
        fn weekdays() {
            assert_eq!(weekday(0), "Thu");
            assert_eq!(weekday(1_709_211_909), "Thu");
            assert_eq!(weekday(1_709_251_200), "Fri");
            assert_eq!(weekday(-86_400), "Wed");
        }

        #[test]
        fn ntp() {
            assert_eq!(ntp_to_unix(2_208_988_800, 0), (0, 0));
            assert_eq!(ntp_to_unix(3_918_200_709, 1 << 31), (1_709_211_909, 500_000_000));
            assert_eq!(unix_to_ntp(1_709_211_909, 500_000_000), (3_918_200_709, 1 << 31));
            let (s, f) = unix_to_ntp(100, 123_456_789);
            let (s2, n2) = ntp_to_unix(s, f);
            assert_eq!(s2, 100);
            assert!((n2 as i64 - 123_456_789).abs() <= 1, "fraction round-trips to within 1 ns");
        }

        #[test]
        fn offsets() {
            assert_eq!(ntp_offset_delay(1000.0, 1110.0, 1111.0, 1021.0), (100.0, 20.0));
            let samples = [
                (0.0, 60.0, 61.0, 21.0),    // offset 50, delay 20
                (0.0, 210.0, 211.0, 201.0), // offset 110, delay 200
                (0.0, 5.0, 5.0, 0.0),       // delay 0: ignored
            ];
            let best = best_offset(&samples).unwrap();
            let expected = (50.0 / 400.0 + 110.0 / 40_000.0) / (1.0 / 400.0 + 1.0 / 40_000.0);
            assert!((best - expected).abs() < 1e-9);
            assert_eq!(best_offset(&[(0.0, 5.0, 5.0, 0.0)]), None);
            assert_eq!(best_offset(&[]), None);
        }
      solution: |
        pub const NTP_TO_UNIX_SECONDS: i64 = 2_208_988_800;

        pub fn is_leap(y: i64) -> bool {
            (y % 4 == 0 && y % 100 != 0) || y % 400 == 0
        }

        pub fn days_in_month(y: i64, m: u32) -> u32 {
            match m {
                1 | 3 | 5 | 7 | 8 | 10 | 12 => 31,
                4 | 6 | 9 | 11 => 30,
                2 if is_leap(y) => 29,
                2 => 28,
                _ => 0,
            }
        }

        pub fn days_from_civil(y: i64, m: u32, d: u32) -> i64 {
            let y = if m <= 2 { y - 1 } else { y };
            let era = y.div_euclid(400);
            let yoe = y - era * 400;
            let mp = (m as i64 + 9) % 12;
            let doy = (153 * mp + 2) / 5 + d as i64 - 1;
            let doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
            era * 146_097 + doe - 719_468
        }

        pub fn civil_from_days(z: i64) -> (i64, u32, u32) {
            let z = z + 719_468;
            let era = z.div_euclid(146_097);
            let doe = z.rem_euclid(146_097);
            let yoe = (doe - doe / 1460 + doe / 36_524 - doe / 146_096) / 365;
            let y = yoe + era * 400;
            let doy = doe - (365 * yoe + yoe / 4 - yoe / 100);
            let mp = (5 * doy + 2) / 153;
            let d = (doy - (153 * mp + 2) / 5 + 1) as u32;
            let m = if mp < 10 { mp + 3 } else { mp - 9 } as u32;
            (if m <= 2 { y + 1 } else { y }, m, d)
        }

        pub fn to_rfc3339(unix: i64) -> String {
            let (days, secs) = (unix.div_euclid(86_400), unix.rem_euclid(86_400));
            let (y, m, d) = civil_from_days(days);
            format!("{y:04}-{m:02}-{d:02}T{:02}:{:02}:{:02}Z", secs / 3600, secs / 60 % 60, secs % 60)
        }

        pub fn parse_rfc3339(s: &str) -> Option<i64> {
            let b = s.as_bytes();
            if b.len() != 20 {
                return None;
            }
            for (i, c) in [(4, b'-'), (7, b'-'), (10, b'T'), (13, b':'), (16, b':'), (19, b'Z')] {
                if b[i] != c {
                    return None;
                }
            }
            let num = |r: std::ops::Range<usize>| -> Option<i64> {
                let part = s.get(r)?;
                if !part.bytes().all(|c| c.is_ascii_digit()) {
                    return None;
                }
                part.parse().ok()
            };
            let (y, mo, d) = (num(0..4)?, num(5..7)? as u32, num(8..10)? as u32);
            let (h, mi, se) = (num(11..13)?, num(14..16)?, num(17..19)?);
            if !(1..=12).contains(&mo) || d == 0 || d > days_in_month(y, mo) || h >= 24 || mi >= 60 || se >= 60 {
                return None;
            }
            Some(days_from_civil(y, mo, d) * 86_400 + h * 3600 + mi * 60 + se)
        }

        pub fn weekday(unix: i64) -> &'static str {
            const NAMES: [&str; 7] = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
            NAMES[(unix.div_euclid(86_400) + 3).rem_euclid(7) as usize]
        }

        pub fn ntp_to_unix(seconds: u32, fraction: u32) -> (i64, u32) {
            let nanos = ((fraction as u64) * 1_000_000_000) >> 32;
            (seconds as i64 - NTP_TO_UNIX_SECONDS, nanos as u32)
        }

        pub fn unix_to_ntp(secs: i64, nanos: u32) -> (u32, u32) {
            let fraction = ((nanos as u64) << 32) / 1_000_000_000;
            ((secs + NTP_TO_UNIX_SECONDS) as u32, fraction as u32)
        }

        pub fn ntp_offset_delay(t1: f64, t2: f64, t3: f64, t4: f64) -> (f64, f64) {
            (((t2 - t1) + (t3 - t4)) / 2.0, (t4 - t1) - (t3 - t2))
        }

        pub fn best_offset(samples: &[(f64, f64, f64, f64)]) -> Option<f64> {
            let mut total = 0.0;
            let mut weights = 0.0;
            for &(t1, t2, t3, t4) in samples {
                let (offset, delay) = ntp_offset_delay(t1, t2, t3, t4);
                if delay <= 0.0 {
                    continue;
                }
                let w = 1.0 / (delay * delay);
                total += offset * w;
                weights += w;
            }
            if weights > 0.0 { Some(total / weights) } else { None }
        }
    solution_explain: "Both calendar functions work on March-based years in 400-year eras, which removes every leap-year special case except the century rule baked into the constants. Parsing validates structure first, then ranges, then the day against `days_in_month`, so `2023-02-29` is caught. The NTP fraction conversion is exact for half seconds and within one nanosecond otherwise."

  - type: quiz
    id: ch23-quiz-time
    title: Check yourself
    questions:
      - type: single
        q: "Which clock should you use to measure how long a function takes?"
        options: ["SystemTime", "Instant", "The RTC", "UNIX_EPOCH"]
        answer: 1
        explanation: "It is monotonic and steady."
      - type: single
        q: "Why does `SystemTime::duration_since` return a Result?"
        options: ["Time zones", "The system clock can be set backwards", "Leap seconds always fail", "It allocates"]
        answer: 1
        explanation: "The wall clock jumps."
      - type: single
        q: "What epoch does NTP use?"
        options: ["1970-01-01", "1900-01-01", "2000-01-01", "The boot time"]
        answer: 1
        explanation: "2,208,988,800 seconds before the Unix epoch."
      - type: single
        q: "With T1 = 0, T2 = 60, T3 = 61, T4 = 21 (ms), what is the offset?"
        options: ["20", "50", "60", "41"]
        answer: 1
        explanation: "((60 - 0) + (61 - 21)) / 2 = 50."
      - type: single
        q: "What happens at 03:14:07 UTC on 19 January 2038?"
        options: ["Nothing", "Signed 32-bit Unix timestamps overflow", "NTP stops", "A leap second"]
        answer: 1
        explanation: "The year 2038 problem; i64 timestamps are fine."

  - type: summary
    points:
      - "Keep time in UTC as seconds since an epoch; convert to local calendars only for display."
      - "SystemTime is the wall clock and can jump; Instant is monotonic for measuring durations."
      - "Calendar dates come from days since the epoch; the civil_from_days algorithm handles leap years."
      - "NTP timestamps are 32.32 fixed-point seconds since 1900."
      - "NTP estimates offset ((T2-T1)+(T3-T4))/2 and delay (T4-T1)-(T3-T2), and weights servers by 1/delay²."
terms:
  - term: epoch
    def: "The fixed starting point a timestamp counts from, such as 1970-01-01 for Unix."
  - term: Unix timestamp
    def: "The number of seconds since 1970-01-01 00:00:00 UTC, ignoring leap seconds."
  - term: monotonic clock
    def: "A clock that never goes backwards."
  - term: RFC 3339
    def: "The internet date format like 2024-02-29T13:05:09Z, a profile of ISO 8601."
  - term: NTP
    def: "The Network Time Protocol, used to synchronize clocks over a network."
  - term: leap second
    def: "An extra second occasionally inserted into UTC to keep it aligned with the Earth's rotation."
