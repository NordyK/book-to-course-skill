        // TODO: Display for Mac

        #[derive(Debug, PartialEq)]
        pub enum Conn {
            Closed,
            SynSent,
            Established { sent: usize, received: usize },
            FinWait,
        }

        #[derive(Debug)]
        pub enum Event {
            Open,
            SynAck,
            Send(usize),
            Recv(usize),
            Close,
            Ack,
        }

        pub fn step(state: Conn, event: Event) -> Result<Conn, NetError> {
