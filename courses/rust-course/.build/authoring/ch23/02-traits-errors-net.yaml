        }
      tests: |
        use super::*;

        #[test]
        fn endpoints() {
            let a = parse_endpoint("127.0.0.1:8080").unwrap();
            assert_eq!(a.port(), 8080);
            assert!(matches!(parse_endpoint("300.0.0.1:80"), Err(NetError::Addr(_))));
            let e = parse_endpoint("10.0.0.1:x").unwrap_err();
            assert!(matches!(e, NetError::Port(_)));
            assert_eq!(e.to_string(), "port: invalid digit found in string");
            assert!(e.source().is_some());
            assert!(matches!(parse_endpoint("no-port"), Err(NetError::Protocol(_))));
        }

        #[test]
        fn io_errors_convert() {
            fn open() -> Result<(), NetError> {
                std::fs::File::open("/definitely/missing")?;
                Ok(())
            }
            let e = open().unwrap_err();
            assert!(matches!(e, NetError::Io(_)));
            assert!(e.to_string().starts_with("io: "));
            let p = NetError::Protocol(String::from("x"));
            assert_eq!(p.to_string(), "protocol: x");
            assert!(p.source().is_none());
        }

        #[test]
        fn macs() {
            let m = Mac::parse("AA-bb-01-02-03-04").unwrap();
            assert_eq!(m.to_string(), "aa:bb:01:02:03:04");
            assert!(m.is_local());
            assert!(!m.is_multicast());
            assert!(Mac::parse("01:00:5e:00:00:fb").unwrap().is_multicast());
            for bad in ["aa:bb:cc", "aa:bb:cc:dd:ee:gg", "aabbccddeeff", "a:bb:cc:dd:ee:ff0"] {
                assert!(matches!(Mac::parse(bad), Err(NetError::Protocol(_))), "{bad}");
            }
            let g = Mac::local_unicast([0xff; 6]);
            assert!(g.is_local() && !g.is_multicast());
            assert_eq!(g.0[0], 0xfe);
            assert_eq!(&g.0[1..], &[0xff; 5]);
        }

        #[test]
        fn happy_path() {
            let mut s = Conn::Closed;
            for e in [Event::Open, Event::SynAck, Event::Send(10), Event::Recv(200), Event::Send(5)] {
                s = step(s, e).unwrap();
            }
            assert_eq!(s, Conn::Established { sent: 15, received: 200 });
            let s = step(s, Event::Close).unwrap();
            assert_eq!(s, Conn::FinWait);
            assert_eq!(step(s, Event::Ack).unwrap(), Conn::Closed);
        }

        #[test]
        fn illegal_transitions() {
            let e = step(Conn::Closed, Event::Send(5)).unwrap_err();
            assert_eq!(e.to_string(), "protocol: Closed cannot handle Send(5)");
            assert!(step(Conn::SynSent, Event::Close).is_err());
            assert!(step(Conn::FinWait, Event::Open).is_err());
            let e = step(Conn::Established { sent: 1, received: 2 }, Event::Open).unwrap_err();
            assert_eq!(e.to_string(), "protocol: Established cannot handle Open");
        }
      solution: |
        use std::error::Error;
        use std::fmt;
        use std::io;
        use std::net::{AddrParseError, Ipv4Addr, SocketAddr};
        use std::num::ParseIntError;

        #[derive(Debug)]
        pub enum NetError {
            Io(io::Error),
            Addr(AddrParseError),
            Port(ParseIntError),
            Protocol(String),
        }

        impl fmt::Display for NetError {
            fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                match self {
                    NetError::Io(e) => write!(f, "io: {e}"),
                    NetError::Addr(e) => write!(f, "address: {e}"),
                    NetError::Port(e) => write!(f, "port: {e}"),
                    NetError::Protocol(m) => write!(f, "protocol: {m}"),
                }
            }
        }

        impl Error for NetError {
            fn source(&self) -> Option<&(dyn Error + 'static)> {
                match self {
                    NetError::Io(e) => Some(e),
                    NetError::Addr(e) => Some(e),
                    NetError::Port(e) => Some(e),
                    NetError::Protocol(_) => None,
                }
            }
        }

        impl From<io::Error> for NetError {
            fn from(e: io::Error) -> Self {
                NetError::Io(e)
            }
        }

        impl From<AddrParseError> for NetError {
            fn from(e: AddrParseError) -> Self {
                NetError::Addr(e)
            }
        }

        impl From<ParseIntError> for NetError {
            fn from(e: ParseIntError) -> Self {
                NetError::Port(e)
            }
        }

        pub fn parse_endpoint(s: &str) -> Result<SocketAddr, NetError> {
            let (ip, port) = s
                .rsplit_once(':')
                .ok_or_else(|| NetError::Protocol(format!("{s:?} has no port")))?;
            let ip: Ipv4Addr = ip.parse()?;
            let port: u16 = port.parse()?;
            Ok(SocketAddr::from((ip, port)))
        }

        #[derive(Debug, Clone, Copy, PartialEq)]
        pub struct Mac(pub [u8; 6]);

        impl Mac {
            pub fn parse(s: &str) -> Result<Mac, NetError> {
                let bad = || NetError::Protocol(format!("{s:?} is not a MAC address"));
                let parts: Vec<&str> = s.split(|c| c == ':' || c == '-').collect();
                if parts.len() != 6 || parts.iter().any(|p| p.len() != 2) {
                    return Err(bad());
                }
                let mut bytes = [0u8; 6];
                for (b, p) in bytes.iter_mut().zip(&parts) {
                    *b = u8::from_str_radix(p, 16).map_err(|_| bad())?;
                }
                Ok(Mac(bytes))
            }
            pub fn is_local(&self) -> bool {
                self.0[0] & 0b10 != 0
            }
            pub fn is_multicast(&self) -> bool {
                self.0[0] & 0b01 != 0
            }
            pub fn local_unicast(mut bytes: [u8; 6]) -> Mac {
                bytes[0] = (bytes[0] | 0b10) & !0b01;
                Mac(bytes)
            }
        }

        impl fmt::Display for Mac {
            fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                let parts: Vec<String> = self.0.iter().map(|b| format!("{b:02x}")).collect();
                write!(f, "{}", parts.join(":"))
            }
        }

        #[derive(Debug, PartialEq)]
        pub enum Conn {
            Closed,
            SynSent,
            Established { sent: usize, received: usize },
            FinWait,
        }

        impl Conn {
            fn name(&self) -> &'static str {
                match self {
                    Conn::Closed => "Closed",
                    Conn::SynSent => "SynSent",
                    Conn::Established { .. } => "Established",
                    Conn::FinWait => "FinWait",
                }
            }
        }

        #[derive(Debug)]
        pub enum Event {
            Open,
            SynAck,
            Send(usize),
            Recv(usize),
            Close,
            Ack,
        }

        pub fn step(state: Conn, event: Event) -> Result<Conn, NetError> {
            match (state, event) {
                (Conn::Closed, Event::Open) => Ok(Conn::SynSent),
                (Conn::SynSent, Event::SynAck) => Ok(Conn::Established { sent: 0, received: 0 }),
                (Conn::Established { sent, received }, Event::Send(n)) => Ok(Conn::Established { sent: sent + n, received }),
                (Conn::Established { sent, received }, Event::Recv(n)) => Ok(Conn::Established { sent, received: received + n }),
                (Conn::Established { .. }, Event::Close) => Ok(Conn::FinWait),
                (Conn::FinWait, Event::Ack) => Ok(Conn::Closed),
                (s, e) => Err(NetError::Protocol(format!("{} cannot handle {:?}", s.name(), e))),
            }
        }
    solution_explain: "With the three `From` impls, `?` turns `AddrParseError` and `ParseIntError` into `NetError` without any `map_err`. Matching on the pair `(state, event)` lists every legal transition in one place, and the final arm turns everything else into an error instead of a silent no-op."

  - type: quiz
    id: ch23-quiz-errors
    title: Check yourself
    questions:
      - type: single
        q: "Why does `?` on an AddrParseError fail in a function returning `Result<T, io::Error>`?"
        options: ["? only works on io errors", "There is no From<AddrParseError> for io::Error", "AddrParseError is not an error", "It does not fail"]
        answer: 1
        explanation: "? converts with From."
      - type: single
        q: "What is the drawback of returning `Box<dyn Error>` from a library?"
        options: ["It is slow", "Callers lose the concrete error type and must downcast to match on it", "It cannot be printed", "It does not work with ?"]
        answer: 1
        explanation: "Fine for applications."
      - type: multi
        q: "What makes a custom error enum work smoothly with `?`?"
        options: ["impl Display", "impl std::error::Error", "impl From<Downstream> for MyError", "impl Clone"]
        answer: [0, 1, 2]
        explanation: "From does the conversion; Display and Error make it a proper error."
      - type: single
        q: "Which bit of a MAC address's first byte marks a multicast address?"
        options: ["bit 0 (0b01)", "bit 1 (0b10)", "bit 7", "none"]
        answer: 0
        explanation: "Bit 1 marks locally administered addresses."
      - type: single
        q: "Why model a protocol as an enum state machine?"
        options: ["It is faster", "Each state carries only its own data and match forces every transition to be handled", "Enums are required by TCP", "To save memory only"]
        answer: 1
        explanation: "Impossible states become unrepresentable."

  - type: summary
    points:
      - "`?` converts errors with From; mixing error types needs a common target."
      - "`Box<dyn Error>` is quick for applications; libraries define an error enum."
      - "A custom error implements Display, Error (with source) and From for each wrapped error."
      - "MAC addresses are 6 bytes; bit 1 of the first byte means local, bit 0 means multicast."
      - "Enums with a loop and match model protocol states and transitions explicitly."
terms:
  - term: error type
    def: "A type, usually an enum, that represents the ways an operation can fail."
  - term: source
    def: "The Error trait method that returns the lower-level error that caused this one."
  - term: MAC address
    def: "A 48-bit hardware address used by Ethernet and Wi-Fi on the local network."
  - term: multicast
    def: "Addressed to a group of devices rather than a single one (unicast)."
  - term: state machine
    def: "A model in which a system is in one of a fixed set of states and events cause transitions."
