title: "Errors, MAC addresses and protocol state machines"
summary: "Returning several error types from one function: Box<dyn Error>, a custom error enum with Display, Error and From so ? converts automatically, and when unwrap is acceptable; trait objects in Rust in Action's role-playing game; MAC addresses as a newtype with local and multicast bits; and network protocols as enum state machines."
minutes: 40
source:
  chapter: ch23
  sections: ["RiA 8.3 Trait Objects", "RiA 8.3.3 Creating a tiny role-playing game", "RiA 8.5 Ergonomic Error Handling for Libraries", "RiA 8.5.1 Issue: unable to return multiple error types", "RiA 8.5.2 Wrapping downstream errors by defining our own error type", "RiA 8.5.3 Cheat with unwrap() and expect()", "RiA 8.6 MAC addresses", "RiA 8.6.1 Generating MAC addresses", "RiA 8.7 Implementing state machines with Rust's enums"]
blocks:
  - type: text
    title: One function, several kinds of error
    md: |
      Network code fails in many ways: the address does not parse (`AddrParseError`), the connection is refused (`io::Error`), the reply is not a number (`ParseIntError`). A function that uses `?` on all three cannot return `Result<T, io::Error>`, because `?` only converts errors into the declared type. *Rust in Action* shows three ways out.

  - type: code
    lang: rust
    code: |
      use std::fs::File;
      use std::net::Ipv6Addr;

      fn main() -> Result<(), std::io::Error> {
          let _f = File::open("invisible.txt")?;

          let _localhost = "::1".parse::<Ipv6Addr>()?;

          Ok(())
      }
    output: |
      error[E0277]: `?` couldn't convert the error to `std::io::Error`
       --> src/main.rs:7:47
        |
      4 | fn main() -> Result<(), std::io::Error> {
        |              -------------------------- expected `std::io::Error` because of this
      ...
      7 |     let _localhost = "::1".parse::<Ipv6Addr>()?;
        |                            -------------------^ the trait `From<AddrParseError>` is not implemented for `std::io::Error`
        |                            |
        |                            this can't be annotated with `?` because it has type `Result<_, AddrParseError>`
        |
        = note: the question mark operation (`?`) implicitly performs a conversion on the error value using the `From` trait
        = help: `std::io::Error` implements trait `From<T>`:
                  From<ErrorKind>
                  From<IntoInnerError<W>>
                  From<NulError>
                  From<TryReserveError>
                  From<std::fs::TryLockError>
    output_label: Compiler output
    explain: "`?` needs a `From<AddrParseError> for io::Error` impl to convert the error, and none exists."

  - type: text
    title: "Way 1: Box<dyn Error>"
    md: |
      Every error type implements the `std::error::Error` trait, and there is a blanket `From<E: Error> for Box<dyn Error>`. So a function returning `Result<T, Box<dyn Error>>` can use `?` on anything. It is quick and fine for applications, but callers lose the concrete type: they can print the error, but matching on it needs `downcast_ref`.

  - type: code
    lang: rust
    code: |
      use std::error::Error;
      use std::net::Ipv6Addr;

      fn parse_both(addr: &str, port: &str) -> Result<(Ipv6Addr, u16), Box<dyn Error>> {
          let ip = addr.parse::<Ipv6Addr>()?;
          let port = port.parse::<u16>()?;
          Ok((ip, port))
      }

      fn main() {
          println!("{:?}", parse_both("::1", "8080"));
          println!("{}", parse_both("::1", "99999").unwrap_err());
          let e = parse_both("not-an-ip", "80").unwrap_err();
          println!("{e}");
          println!("is AddrParseError: {}", e.downcast_ref::<std::net::AddrParseError>().is_some());
      }
    output: |
      Ok((::1, 8080))
      number too large to fit in target type
      invalid IPv6 address syntax
      is AddrParseError: true

  - type: text
    title: "Way 2: your own error type"
    md: |
      Libraries should give callers an error they can match on. Define an **enum** with one variant per downstream error, then implement three things:

      1. `std::fmt::Display`, so it can be printed;
      2. `std::error::Error`, so it fits wherever errors are expected (`source()` can return the wrapped error);
      3. `From<DownstreamError>` for each variant, so `?` converts automatically.

  - type: code
    lang: rust
    code: |
      use std::error;
      use std::fmt;
      use std::fs::File;
      use std::io;
      use std::net::{self, Ipv6Addr};

      #[derive(Debug)]
      enum UpstreamError {
          IO(io::Error),
          Parsing(net::AddrParseError),
      }

      impl fmt::Display for UpstreamError {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              match self {
                  UpstreamError::IO(e) => write!(f, "I/O error: {e}"),
                  UpstreamError::Parsing(e) => write!(f, "bad address: {e}"),
              }
          }
      }

      impl error::Error for UpstreamError {
          fn source(&self) -> Option<&(dyn error::Error + 'static)> {
              match self {
                  UpstreamError::IO(e) => Some(e),
                  UpstreamError::Parsing(e) => Some(e),
              }
          }
      }

      impl From<io::Error> for UpstreamError {
          fn from(error: io::Error) -> Self {
              UpstreamError::IO(error)
          }
      }

      impl From<net::AddrParseError> for UpstreamError {
          fn from(error: net::AddrParseError) -> Self {
              UpstreamError::Parsing(error)
          }
      }

      fn connect(addr: &str, file: &str) -> Result<Ipv6Addr, UpstreamError> {
          let ip = addr.parse::<Ipv6Addr>()?;
          let _f = File::open(file)?;
          Ok(ip)
      }

      fn main() {
          for (addr, file) in [("zz", "x"), ("::1", "/no/such/file")] {
              match connect(addr, file) {
                  Ok(ip) => println!("ok {ip}"),
                  Err(UpstreamError::Parsing(_)) => println!("fix the address, please"),
                  Err(e) => println!("{e} (source: {:?})", error::Error::source(&e).is_some()),
              }
          }
      }
    output: |
      fix the address, please
      I/O error: No such file or directory (os error 2) (source: true)
    explain: "The `?` operator calls `From::from` on the error, which is why the two `impl From` blocks are all it takes for both `?`s to compile. The `thiserror` crate generates exactly this boilerplate from attributes; `anyhow` is a richer `Box<dyn Error>` for applications."

  - type: callout
    kind: tip
    title: "Way 3: unwrap and expect"
    md: "*Rust in Action* also lists \"cheating\" with `unwrap()` and `expect()`. In prototypes, examples and tests that is reasonable: a crash with a message is what you want. In library code it turns a recoverable error into a panic for every user, so prefer the error enum there."

  - type: text
    title: Trait objects in a tiny game
    md: |
      *Rust in Action* introduces trait objects (chapter 18 of this course) with a role-playing game: dwarves, elves and humans can all `enchant` things, and a party is a `Vec<&dyn Enchanter>`. Different types, one interface, chosen at run time:

  - type: code
    lang: rust
    code: |
      #[derive(Debug)]
      struct Dwarf;
      #[derive(Debug)]
      struct Elf;
      #[derive(Debug)]
      struct Human;

      #[derive(Debug)]
      enum Thing {
          Sword,
          Trinket,
      }

      trait Enchanter: std::fmt::Debug {
          fn competency(&self) -> f64;

          // the book rolls a random die here; a fixed "roll" keeps the output repeatable
          fn enchant(&self, thing: &mut Thing, roll: f64) {
              let probability_of_success = self.competency();
              print!("{:?} mutters incoherently. ", self);
              if roll < probability_of_success {
                  println!("The {:?} glows brightly.", thing);
              } else {
                  println!("The {:?} fizzes, then turns into a worthless trinket.", thing);
                  *thing = Thing::Trinket;
              }
          }
      }

      impl Enchanter for Dwarf {
          fn competency(&self) -> f64 {
              0.5
          }
      }
      impl Enchanter for Elf {
          fn competency(&self) -> f64 {
              0.95
          }
      }
      impl Enchanter for Human {
          fn competency(&self) -> f64 {
              0.8
          }
      }

      fn main() {
          let mut it = Thing::Sword;
          let d = Dwarf;
          let e = Elf;
          let h = Human;
          let party: Vec<&dyn Enchanter> = vec![&d, &h, &e];
          for (spellcaster, roll) in party.iter().zip([0.3, 0.9, 0.1]) {
              spellcaster.enchant(&mut it, roll);
          }
      }
    output: |
      Dwarf mutters incoherently. The Sword glows brightly.
      Human mutters incoherently. The Sword fizzes, then turns into a worthless trinket.
      Elf mutters incoherently. The Trinket glows brightly.

  - type: text
    title: MAC addresses
    md: |
      IP addresses route between networks; on the local network, Ethernet and Wi-Fi deliver **frames** to **MAC addresses**: 48 bits (6 bytes), written `aa:bb:cc:dd:ee:ff`, normally burned in by the manufacturer. They are not hierarchical: numerically close addresses can be on different continents.

      Two bits of the **first byte** carry meaning:

      - bit 1 (`0b10`): **locally administered** if set, universal (assigned by the manufacturer under an IEEE prefix) if clear. Addresses you invent in software must set it.
      - bit 0 (`0b01`): **multicast** (a group address) if set, **unicast** (one device) if clear.

      *Rust in Action*'s `macgen` wraps the bytes in a newtype and sets both bits with `|=`. Note one detail: by the IEEE definition, setting bit 0 makes the address **multicast**; its `is_unicast` method actually tests the multicast bit. A generated unicast address should set bit 1 and **clear** bit 0, as below.

  - type: code
    lang: rust
    code: |
      use std::fmt;

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct MacAddress([u8; 6]);

      impl fmt::Display for MacAddress {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              let o = &self.0;
              write!(f, "{:02x}:{:02x}:{:02x}:{:02x}:{:02x}:{:02x}", o[0], o[1], o[2], o[3], o[4], o[5])
          }
      }

      impl MacAddress {
          /// A locally administered unicast address from 6 random bytes.
          fn local_unicast(mut octets: [u8; 6]) -> MacAddress {
              octets[0] |= 0b0000_0010; // local
              octets[0] &= !0b0000_0001; // unicast
              MacAddress(octets)
          }

          fn is_local(&self) -> bool {
              self.0[0] & 0b10 != 0
          }

          fn is_multicast(&self) -> bool {
              self.0[0] & 0b01 != 0
          }
      }

      fn main() {
          // bytes from a simple generator, so the output is repeatable
          let mut seed: u64 = 0x2545_F491_4F6C_DD1D;
          let mut octets = [0u8; 6];
          for b in octets.iter_mut() {
              seed ^= seed << 13;
              seed ^= seed >> 7;
              seed ^= seed << 17;
              *b = seed as u8;
          }
          let mac = MacAddress::local_unicast(octets);
          println!("mac: {mac} local={} multicast={}", mac.is_local(), mac.is_multicast());

          let broadcast = MacAddress([0xff; 6]);
          println!("{broadcast} local={} multicast={}", broadcast.is_local(), broadcast.is_multicast());
      }
    output: |
      mac: e6:e0:b7:36:8e:c1 local=true multicast=false
      ff:ff:ff:ff:ff:ff local=true multicast=true

  - type: text
    title: Protocols as state machines
    md: |
      A network connection moves through **states**: connecting, sending, waiting for a reply, closed. *Rust in Action* models this with an enum, a `loop` and a `match` that computes the next state. Because each state is a variant that can carry data, impossible combinations (a reply buffer while not yet connected) cannot be represented. The match makes every transition explicit, and the compiler checks that every state is handled.

  - type: code
    lang: rust
    code: |
      #[derive(Debug)]
      enum State {
          Connecting { attempt: u32 },
          Sending(String),
          Waiting { sent: usize },
          Done(String),
          Failed(String),
      }

      // a pretend network: the first attempt fails, the second succeeds
      fn try_connect(attempt: u32) -> bool {
          attempt >= 2
      }

      fn main() {
          let mut state = State::Connecting { attempt: 1 };
          loop {
              println!("{state:?}");
              state = match state {
                  State::Connecting { attempt } if attempt > 3 => State::Failed(String::from("gave up")),
                  State::Connecting { attempt } => {
                      if try_connect(attempt) {
                          State::Sending(String::from("GET / HTTP/1.0\r\n\r\n"))
                      } else {
                          State::Connecting { attempt: attempt + 1 }
                      }
                  }
                  State::Sending(request) => State::Waiting { sent: request.len() },
                  State::Waiting { sent } => State::Done(format!("200 OK after sending {sent} bytes")),
                  State::Done(_) | State::Failed(_) => break,
              };
          }
      }
    output: |
      Connecting { attempt: 1 }
      Connecting { attempt: 2 }
      Sending("GET / HTTP/1.0\r\n\r\n")
      Waiting { sent: 18 }
      Done("200 OK after sending 18 bytes")

  - type: playground
    id: ch23-play-error
    title: "An error type for a port scanner"
    lang: rust
    md: |
      `parse_target("host:port")` must return `Result<(String, u16), TargetError>`. Define `TargetError` with variants `MissingPort`, `BadPort(ParseIntError)` and `EmptyHost`, implement `Display` and `From<ParseIntError>`, and use `?` for the port.
    task: "Print `Ok((\"example.com\", 443))`, `missing :port`, `bad port: invalid digit found in string`, `empty host`."
    code: |
      use std::fmt;
      use std::num::ParseIntError;

      #[derive(Debug)]
      enum TargetError {
          // TODO
      }

      // TODO: impl Display and From<ParseIntError>

      fn parse_target(s: &str) -> Result<(String, u16), TargetError> {
          todo!()
      }

      fn main() {
          println!("{:?}", parse_target("example.com:443"));
          for bad in ["example.com", "example.com:https", ":80"] {
              match parse_target(bad) {
                  Ok(t) => println!("unexpected {t:?}"),
                  Err(e) => println!("{e}"),
              }
          }
      }
    starter_ok: compile_error
    expected_output: |
      Ok(("example.com", 443))
      missing :port
      bad port: invalid digit found in string
      empty host
    solution_code: |
      use std::fmt;
      use std::num::ParseIntError;

      #[derive(Debug)]
      enum TargetError {
          MissingPort,
          BadPort(ParseIntError),
          EmptyHost,
      }

      impl fmt::Display for TargetError {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              match self {
                  TargetError::MissingPort => write!(f, "missing :port"),
                  TargetError::BadPort(e) => write!(f, "bad port: {e}"),
                  TargetError::EmptyHost => write!(f, "empty host"),
              }
          }
      }

      impl From<ParseIntError> for TargetError {
          fn from(e: ParseIntError) -> Self {
              TargetError::BadPort(e)
          }
      }

      fn parse_target(s: &str) -> Result<(String, u16), TargetError> {
          let (host, port) = s.rsplit_once(':').ok_or(TargetError::MissingPort)?;
          if host.is_empty() {
              return Err(TargetError::EmptyHost);
          }
          let port: u16 = port.parse()?;
          Ok((host.to_string(), port))
      }

      fn main() {
          println!("{:?}", parse_target("example.com:443"));
          for bad in ["example.com", "example.com:https", ":80"] {
              match parse_target(bad) {
                  Ok(t) => println!("unexpected {t:?}"),
                  Err(e) => println!("{e}"),
              }
          }
      }
    hints:
      - "`s.rsplit_once(':').ok_or(TargetError::MissingPort)?` handles the missing colon."
      - "With `impl From<ParseIntError> for TargetError`, `port.parse()?` converts the error for you."

  - type: exercise
    id: ch23-ex-net
    exercise_dir: ch23-net
    title: "A connection library"
    difficulty: hard
    goal: "Design a library error type that wraps several downstream errors, a MAC address type, and a connection state machine with checked transitions."
    behavior: |
      Errors:
      - `pub enum NetError { Io(io::Error), Addr(AddrParseError), Port(ParseIntError), Protocol(String) }` with `Display` (`"io: ..."`, `"address: ..."`, `"port: ..."`, `"protocol: ..."`), `std::error::Error` (with `source` returning the wrapped error for the first three) and `From` for the three wrapped types.
      - `pub fn parse_endpoint(s: &str) -> Result<SocketAddr, NetError>`: `"IP:PORT"` for IPv4 only, split at the last `:`; uses `?` for both parts.
      MAC:
      - `pub struct Mac(pub [u8; 6])` with `Display` (lowercase, colon-separated), `pub fn parse(s: &str) -> Result<Mac, NetError>` (six two-digit hex groups separated by `:` or `-`; anything else is a `Protocol` error), `is_local`, `is_multicast`, and `pub fn local_unicast(bytes: [u8; 6]) -> Mac`.
      State machine:
      - `pub enum Conn { Closed, SynSent, Established { sent: usize, received: usize }, FinWait }` and `pub enum Event { Open, SynAck, Send(usize), Recv(usize), Close, Ack }`.
      - `pub fn step(state: Conn, event: Event) -> Result<Conn, NetError>`: Closed + Open → SynSent; SynSent + SynAck → Established {0, 0}; Established + Send(n)/Recv(n) adds to the counters; Established + Close → FinWait; FinWait + Ack → Closed. Every other pair is `Protocol("<state> cannot handle <event>")` using the `Debug` names, e.g. `"Closed cannot handle Send(5)"`.
    examples:
      - input: "parse_endpoint(\"10.0.0.1:x\")"
        output: "Err(NetError::Port(..)), displayed as \"port: invalid digit found in string\""
      - input: "Mac::parse(\"AA-bb-01-02-03-04\").unwrap().to_string()"
        output: "\"aa:bb:01:02:03:04\""
    hints:
      - "`parse_endpoint`: `let (ip, port) = s.rsplit_once(':').ok_or_else(|| NetError::Protocol(...))?; let ip: Ipv4Addr = ip.parse()?; let port: u16 = port.parse()?;`"
      - "Mac parsing: `s.split(|c| c == ':' || c == '-')`, check there are six parts of length 2, then `u8::from_str_radix(part, 16)`."
      - "Derive `Debug` on `Conn` and `Event` so the error message can use `{:?}`; for the state name only, a small `fn name(&self) -> &'static str` helps."
