        }

        pub fn parse_response(raw: &str) -> Result<Response, String> {
            todo!()
        }

        pub fn fetch(addr: SocketAddr, path: &str) -> io::Result<Response> {
            todo!()
        }
      tests: |
        use super::*;
        use std::io::{BufRead, BufReader};
        use std::net::TcpListener;
        use std::thread;

        #[test]
        fn requests() {
            assert_eq!(
                build_request("GET", "example.com", "/", ""),
                "GET / HTTP/1.1\r\nHost: example.com\r\nConnection: close\r\n\r\n"
            );
            assert_eq!(
                build_request("POST", "api.local", "/items", "{\"a\":1}"),
                "POST /items HTTP/1.1\r\nHost: api.local\r\nConnection: close\r\nContent-Length: 7\r\n\r\n{\"a\":1}"
            );
        }

        #[test]
        fn parsing() {
            let raw = "HTTP/1.1 404 Not Found\r\nContent-Type: text/plain\r\ncontent-length:  5\r\n\r\nnope!extra";
            let r = parse_response(raw).unwrap();
            assert_eq!(r.status, 404);
            assert_eq!(r.reason, "Not Found");
            assert_eq!(r.header("Content-Length"), Some("5"));
            assert_eq!(r.header("content-type"), Some("text/plain"));
            assert_eq!(r.header("X-Missing"), None);
            assert_eq!(r.body, "nope!", "Content-Length limits the body");

            let r = parse_response("HTTP/1.0 200 OK\r\n\r\nall of it").unwrap();
            assert_eq!(r.body, "all of it");
            assert!(r.headers.is_empty());
        }

        #[test]
        fn parse_errors() {
            assert!(parse_response("HTTP/1.1 200 OK\r\nNo-Blank-Line: yes").is_err());
            assert!(parse_response("HTTP/1.1 abc OK\r\n\r\n").is_err());
            assert!(parse_response("SPDY 200 OK\r\n\r\n").is_err());
            assert!(parse_response("HTTP/1.1 200 OK\r\nbroken header\r\n\r\n").is_err());
        }

        #[test]
        fn fetch_from_local_server() {
            let listener = TcpListener::bind("127.0.0.1:0").unwrap();
            let addr = listener.local_addr().unwrap();
            let server = thread::spawn(move || {
                let (stream, _) = listener.accept().unwrap();
                let mut reader = BufReader::new(&stream);
                let mut first = String::new();
                reader.read_line(&mut first).unwrap();
                loop {
                    let mut h = String::new();
                    reader.read_line(&mut h).unwrap();
                    if h == "\r\n" || h.is_empty() {
                        break;
                    }
                }
                let body = format!("path={}", first.split(' ').nth(1).unwrap());
                let mut s = &stream;
                write!(s, "HTTP/1.1 200 OK\r\nContent-Length: {}\r\nServer: test\r\n\r\n{}", body.len(), body).unwrap();
            });
            let r = fetch(addr, "/status").unwrap();
            server.join().unwrap();
            assert_eq!(r.status, 200);
            assert_eq!(r.body, "path=/status");
            assert_eq!(r.header("server"), Some("test"));
        }
      solution: |
        use std::io::{self, Read, Write};
        use std::net::{SocketAddr, TcpStream};

        pub fn build_request(method: &str, host: &str, path: &str, body: &str) -> String {
            let mut req = format!("{method} {path} HTTP/1.1\r\nHost: {host}\r\nConnection: close\r\n");
            if !body.is_empty() {
                req.push_str(&format!("Content-Length: {}\r\n", body.len()));
            }
            req.push_str("\r\n");
            req.push_str(body);
            req
        }

        #[derive(Debug)]
        pub struct Response {
            pub status: u16,
            pub reason: String,
            pub headers: Vec<(String, String)>,
            pub body: String,
        }

        impl Response {
            pub fn header(&self, name: &str) -> Option<&str> {
                self.headers
                    .iter()
                    .find(|(n, _)| n.eq_ignore_ascii_case(name))
                    .map(|(_, v)| v.as_str())
            }
        }

        pub fn parse_response(raw: &str) -> Result<Response, String> {
            let (head, body) = raw.split_once("\r\n\r\n").ok_or("no blank line after the headers")?;
            let mut lines = head.split("\r\n");
            let status_line = lines.next().ok_or("empty response")?;
            let mut parts = status_line.splitn(3, ' ');
            let version = parts.next().unwrap_or("");
            if !version.starts_with("HTTP/1.") {
                return Err(format!("bad version in {status_line:?}"));
            }
            let status: u16 = parts
                .next()
                .and_then(|c| c.parse().ok())
                .ok_or_else(|| format!("bad status code in {status_line:?}"))?;
            let reason = parts.next().unwrap_or("").to_string();

            let mut headers = Vec::new();
            for line in lines {
                let (name, value) = line.split_once(':').ok_or_else(|| format!("bad header {line:?}"))?;
                headers.push((name.trim().to_string(), value.trim().to_string()));
            }
            let mut response = Response { status, reason, headers, body: String::new() };
            response.body = match response.header("Content-Length").and_then(|v| v.parse::<usize>().ok()) {
                Some(n) => body.get(..n).unwrap_or(body).to_string(),
                None => body.to_string(),
            };
            Ok(response)
        }

        pub fn fetch(addr: SocketAddr, path: &str) -> io::Result<Response> {
            let mut stream = TcpStream::connect(addr)?;
            stream.write_all(build_request("GET", &addr.to_string(), path, "").as_bytes())?;
            let mut raw = String::new();
            stream.read_to_string(&mut raw)?;
            parse_response(&raw).map_err(|e| io::Error::new(io::ErrorKind::InvalidData, e))
        }
    solution_explain: "`split_once` and `splitn(3, ' ')` do most of the parsing; the reason phrase keeps its spaces because it is the third, unsplit part. `Connection: close` makes the server close after responding, which is why `read_to_string` in `fetch` terminates."

  - type: quiz
    id: ch23-quiz-http
    title: Check yourself
    questions:
      - type: single
        q: "Which layer guarantees ordered, reliable delivery of bytes?"
        options: ["IP", "TCP", "UDP", "HTTP"]
        answer: 1
        explanation: "UDP gives no such guarantee."
      - type: single
        q: "How do HTTP/1.x headers end?"
        options: ["With a NUL byte", "With an empty line: \\r\\n\\r\\n", "With END", "They have a length prefix"]
        answer: 1
        explanation: "Then the body begins."
      - type: single
        q: "What does binding a listener to port 0 do?"
        options: ["Fails", "Lets the operating system pick a free port", "Uses port 80", "Listens on every port"]
        answer: 1
        explanation: "local_addr() tells you which one."
      - type: single
        q: "Why is the Host header needed?"
        options: ["For encryption", "Many websites can share one IP address", "TCP requires it", "It is not"]
        answer: 1
        explanation: "The server picks the site by it."
      - type: single
        q: "Which protocol do DNS and NTP usually use?"
        options: ["TCP", "UDP", "HTTP", "TLS"]
        answer: 1
        explanation: "Small, independent messages."

  - type: summary
    points:
      - "Networks are layered: application (HTTP), security (TLS), transport (TCP/UDP), network (IP), link (Ethernet)."
      - "HTTP/1.x is text: a request line, headers, a blank line and an optional body, with \\r\\n line endings."
      - "TcpStream and TcpListener give byte streams that implement Read and Write."
      - "A socket address is an IP and a port; ToSocketAddrs resolves names through the OS."
      - "UdpSocket sends datagrams without connections; set timeouts because packets can be lost."
terms:
  - term: protocol
    def: "An agreed set of message formats and rules for two programs to communicate."
  - term: TCP
    def: "Transmission Control Protocol: a reliable, ordered byte stream between two sockets."
  - term: UDP
    def: "User Datagram Protocol: independent datagrams with no delivery guarantees."
  - term: port
    def: "A 16-bit number identifying a service on a host."
  - term: socket address
    def: "An IP address combined with a port."
  - term: DNS
    def: "The Domain Name System, which maps names like example.com to IP addresses."
  - term: loopback
    def: "The address 127.0.0.1 (or ::1) that always refers to the local machine."
