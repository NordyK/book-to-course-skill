title: "HTTP by hand over TCP"
summary: "The layers of the networking stack, what an HTTP request and response look like on the wire, TcpStream and TcpListener with a local server, ports and sockets, converting host names to addresses with ToSocketAddrs, UDP datagrams, timeouts, and where reqwest fits in."
minutes: 40
source:
  chapter: ch23
  sections: ["RiA 8 Networking", "RiA 8.1 Just enough HTTP", "RiA 8.2 Generating an HTTP GET request with reqwest", "RiA 8.4 TCP", "RiA 8.4.1 What is a port number?", "RiA 8.4.2 Converting a hostname to an IP address"]
blocks:
  - type: text
    md: |
      Networking is built in **layers**. Each layer uses the one below and knows nothing about the one above:

      - **Application**: HTTP, DNS, SMTP. What programs say to each other.
      - **Security**: TLS, which encrypts HTTP into HTTPS.
      - **Transport**: TCP (a reliable, ordered byte stream) or UDP (independent datagrams, no guarantees).
      - **Network**: IP, which routes packets between addresses.
      - **Link**: Ethernet or Wi-Fi, which moves frames between neighbouring machines identified by MAC addresses.

      *Rust in Action* works down the stack. It starts with HTTP, because almost every program talks it.

  - type: text
    title: An HTTP request is text
    md: |
      HTTP/1.x messages are lines of text separated by **`\r\n`** (carriage return, line feed). A request has a **request line** (method, path, version), **headers**, an empty line, and an optional body. The response has a **status line** (`HTTP/1.1 200 OK`), headers, an empty line and the body:

      ```text
      GET /index.html HTTP/1.1\r\n
      Host: www.rustinaction.com\r\n
      \r\n
      ```

      ```text
      HTTP/1.1 200 OK\r\n
      Content-Type: text/html; charset=utf-8\r\n
      Content-Length: 13\r\n
      \r\n
      Hello, world!
      ```

      The `Host` header matters because one IP address can serve many websites. `Content-Length` tells the client where the body ends.

  - type: text
    title: TCP in the standard library
    md: |
      `std::net::TcpStream::connect(addr)` opens a TCP connection; the stream implements `Read` and `Write`, so everything from chapter 22 applies. *Rust in Action* connects to `www.rustinaction.com:80` and writes the request with `write_all`. The course console has no internet access, so the example below starts its own tiny server with **`TcpListener`** on the loopback address `127.0.0.1`, port `0` (meaning "pick any free port"), in a second thread, and then talks to it like a browser would.

  - type: code
    lang: rust
    code: |
      use std::io::{BufRead, BufReader, Read, Write};
      use std::net::{TcpListener, TcpStream};
      use std::thread;

      fn main() -> std::io::Result<()> {
          let listener = TcpListener::bind("127.0.0.1:0")?;
          let addr = listener.local_addr()?;

          // a server that answers exactly one request
          let server = thread::spawn(move || -> std::io::Result<()> {
              let (stream, _peer) = listener.accept()?;
              let mut reader = BufReader::new(&stream);
              let mut request_line = String::new();
              reader.read_line(&mut request_line)?;
              loop {
                  let mut header = String::new();
                  reader.read_line(&mut header)?;
                  if header == "\r\n" {
                      break;
                  }
              }
              let body = format!("you asked for {}", request_line.split(' ').nth(1).unwrap_or("?"));
              let mut stream = &stream;
              write!(stream, "HTTP/1.0 200 OK\r\nContent-Length: {}\r\n\r\n{}", body.len(), body)?;
              Ok(())
          });

          // the client, as in Rust in Action's ch8-stdlib
          let mut connection = TcpStream::connect(addr)?;
          connection.write_all(b"GET /hello HTTP/1.0")?;
          connection.write_all(b"\r\n")?;
          connection.write_all(b"Host: localhost")?;
          connection.write_all(b"\r\n\r\n")?;

          let mut response = String::new();
          connection.read_to_string(&mut response)?;
          print!("{}", response.replace("\r\n", "\n"));
          println!();

          server.join().unwrap()?;
          Ok(())
      }
    output: |
      HTTP/1.0 200 OK
      Content-Length: 20

      you asked for /hello
    explain: "HTTP/1.0 closes the connection after the response, so `read_to_string` ends when the server's stream is dropped. Real HTTP/1.1 keeps connections alive and needs `Content-Length` to know when to stop reading. `\\r\\n` is replaced only to print the response neatly."

  - type: stepper
    title: What happens on the wire
    steps:
      - title: bind and listen
        md: "`TcpListener::bind` asks the operating system for a **socket** on an address and port and starts accepting connections."
      - title: The three-way handshake
        md: "`TcpStream::connect` sends SYN, the server's kernel replies SYN-ACK, the client sends ACK. Only then does `accept` return a stream on the server side."
      - title: Bytes, not messages
        md: "TCP delivers a **stream** of bytes, in order, retransmitting lost packets. It has no idea where one HTTP message ends: that is HTTP's job (the blank line, `Content-Length`)."
      - title: Closing
        md: "Dropping a stream closes it (FIN). The reader on the other side sees end of file: `read` returns 0."

  - type: text
    title: Ports and addresses
    md: |
      A **port** is just a `u16` that lets one IP address host many services: 80 for HTTP, 443 for HTTPS, 22 for SSH, 53 for DNS. Ports below 1024 usually need administrator rights. An IP address plus a port is a **socket address**, `SocketAddr` in Rust, either `SocketAddrV4` (`127.0.0.1:8080`) or `SocketAddrV6` (`[::1]:8080`).

      TCP knows nothing about names like `www.rustinaction.com`. **DNS** turns names into IP addresses. *Rust in Action* writes a DNS resolver with a crate; the standard library offers **`ToSocketAddrs`**, which asks the operating system's resolver and is what `connect("host:port")` uses internally:

  - type: code
    lang: rust
    code: |
      use std::net::{IpAddr, Ipv4Addr, SocketAddr, ToSocketAddrs};

      fn main() -> std::io::Result<()> {
          let addr: SocketAddr = "192.168.1.20:8080".parse().unwrap();
          println!("ip {} port {} v4? {}", addr.ip(), addr.port(), addr.is_ipv4());

          let local = IpAddr::V4(Ipv4Addr::LOCALHOST);
          println!("{local} loopback? {}", local.is_loopback());
          println!("{}", "10.0.0.1".parse::<Ipv4Addr>().unwrap().is_private());
          println!("{:?}", "999.1.1.1".parse::<Ipv4Addr>().is_err());

          // name resolution through the operating system
          let v4: Vec<SocketAddr> = "localhost:80".to_socket_addrs()?.filter(|a| a.is_ipv4()).collect();
          println!("{v4:?}");
          Ok(())
      }
    output: |
      ip 192.168.1.20 port 8080 v4? true
      127.0.0.1 loopback? true
      true
      true
      [127.0.0.1:80]

  - type: text
    title: UDP
    md: |
      **UDP** sends individual **datagrams**. There is no connection, no ordering and no retransmission: a datagram arrives whole or not at all. That makes it fast and simple, which is why DNS and NTP (lesson 3) use it. `UdpSocket::bind` gets a socket; `send_to` and `recv_from` move one datagram at a time.

  - type: code
    lang: rust
    code: |
      use std::net::UdpSocket;
      use std::time::Duration;

      fn main() -> std::io::Result<()> {
          let server = UdpSocket::bind("127.0.0.1:0")?;
          let client = UdpSocket::bind("127.0.0.1:0")?;
          client.set_read_timeout(Some(Duration::from_secs(2)))?;

          client.send_to(b"ping", server.local_addr()?)?;

          let mut buf = [0u8; 512];
          let (n, from) = server.recv_from(&mut buf)?;
          println!("server got {:?}", String::from_utf8_lossy(&buf[..n]));
          server.send_to(b"pong", from)?;

          let (n, _) = client.recv_from(&mut buf)?;
          println!("client got {:?}", String::from_utf8_lossy(&buf[..n]));
          Ok(())
      }
    output: |
      server got "ping"
      client got "pong"
    explain: "A read timeout matters with UDP: if the reply datagram is lost, `recv_from` would otherwise wait forever. It returns an error of kind `WouldBlock` or `TimedOut` when the time runs out."

  - type: callout
    kind: note
    title: "reqwest"
    md: "For real HTTP clients, *Rust in Action* starts with the **reqwest** crate: `reqwest::blocking::get(url)?.text()?` handles DNS, TLS, redirects, keep-alive and chunked bodies. Use it (or `ureq`) in practice. It needs crates.io, so this course shows the protocol by hand instead."

  - type: playground
    id: ch23-play-echo
    title: "An echo server"
    lang: rust
    md: |
      Complete the server thread: accept one connection, then read lines with a `BufReader` and write each one back in upper case, until the client closes. The client sends three lines and then shuts down its writing half with `shutdown(Shutdown::Write)` so the server sees end of file.
    task: "Print `HELLO`, `RUST`, `BYE`."
    code: |
      use std::io::{BufRead, BufReader, Write};
      use std::net::{Shutdown, TcpListener, TcpStream};
      use std::thread;

      fn main() -> std::io::Result<()> {
          let listener = TcpListener::bind("127.0.0.1:0")?;
          let addr = listener.local_addr()?;

          let server = thread::spawn(move || -> std::io::Result<()> {
              let (stream, _) = listener.accept()?;
              for line in BufReader::new(stream).lines() {
                  let _line = line?;
                  // TODO: write the line back upper-cased (you need a second handle to write with)
              }
              Ok(())
          });

          let mut client = TcpStream::connect(addr)?;
          client.write_all(b"hello\nrust\nbye\n")?;
          client.shutdown(Shutdown::Write)?;
          for line in BufReader::new(client).lines() {
              println!("{}", line?);
          }
          server.join().unwrap()
      }
    expected_output: |
      HELLO
      RUST
      BYE
    solution_code: |
      use std::io::{BufRead, BufReader, Write};
      use std::net::{Shutdown, TcpListener, TcpStream};
      use std::thread;

      fn main() -> std::io::Result<()> {
          let listener = TcpListener::bind("127.0.0.1:0")?;
          let addr = listener.local_addr()?;

          let server = thread::spawn(move || -> std::io::Result<()> {
              let (stream, _) = listener.accept()?;
              let mut writer = stream.try_clone()?;
              for line in BufReader::new(stream).lines() {
                  writeln!(writer, "{}", line?.to_uppercase())?;
              }
              Ok(())
          });

          let mut client = TcpStream::connect(addr)?;
          client.write_all(b"hello\nrust\nbye\n")?;
          client.shutdown(Shutdown::Write)?;
          for line in BufReader::new(client).lines() {
              println!("{}", line?);
          }
          server.join().unwrap()
      }
    hints:
      - "`stream.try_clone()?` gives a second handle to the same connection: read from one, write to the other."
      - "`for line in BufReader::new(stream).lines() { writeln!(writer, \"{}\", line?.to_uppercase())?; }`"

  - type: exercise
    id: ch23-ex-http
    exercise_dir: ch23-http
    title: "A minimal HTTP client and parser"
    difficulty: hard
    goal: "Build and parse HTTP/1.x messages, and run a request against a real TCP server on the loopback interface."
    behavior: |
      - `pub fn build_request(method: &str, host: &str, path: &str, body: &str) -> String`: request line `METHOD PATH HTTP/1.1`, headers `Host`, `Connection: close` and, if the body is not empty, `Content-Length`; every line ends with `\r\n`, then a blank line, then the body.
      - `pub struct Response { pub status: u16, pub reason: String, pub headers: Vec<(String, String)>, pub body: String }` with `pub fn header(&self, name: &str) -> Option<&str>` (case-insensitive).
      - `pub fn parse_response(raw: &str) -> Result<Response, String>`: split head and body at the first `\r\n\r\n`; parse the status line (`HTTP/1.x CODE REASON`, reason may contain spaces); headers are `Name: value` (trim the value); if `Content-Length` is present, the body is exactly that many bytes. Errors (as `Err(String)`) for a missing blank line, a bad status line or a malformed header.
      - `pub fn fetch(addr: SocketAddr, path: &str) -> std::io::Result<Response>`: connect, send a GET, read everything, parse (map a parse error to `io::ErrorKind::InvalidData`).
    examples:
      - input: "build_request(\"GET\", \"example.com\", \"/\", \"\")"
        output: "\"GET / HTTP/1.1\\r\\nHost: example.com\\r\\nConnection: close\\r\\n\\r\\n\""
    hints:
      - "`raw.split_once(\"\\r\\n\\r\\n\")` separates head and body."
      - "Status line: `let mut parts = line.splitn(3, ' ');` gives version, code and the rest."
      - "`name.eq_ignore_ascii_case(other)` compares header names."
      - "`fetch`: `TcpStream::connect(addr)?`, `write_all(build_request(...).as_bytes())`, `read_to_string`."
