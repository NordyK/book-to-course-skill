title: "The standard traits"
summary: "The traits every Rust type plugs into: derivable ones (Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash, Default), Display, From and Into, TryFrom, AsRef, Drop, and operator overloading with Add, Neg, Index and friends."
minutes: 40
source:
  chapter: ch10
  sections: ["TRPL Appendix C Derivable Traits", "PR ch12 Operator Overloading", "PR ch12 Arithmetic and Bitwise Operators", "PR ch12 Equivalence Comparisons", "PR ch12 Ordered Comparisons", "PR ch12 Index and IndexMut", "PR ch13 Utility Traits", "PR ch13 Drop", "PR ch13 Clone", "PR ch13 Copy", "PR ch13 Default", "PR ch13 AsRef and AsMut", "PR ch13 From and Into", "PR ch13 TryFrom and TryInto", "CR Day 2 Standard Library Traits", "CR Day 2 Comparisons", "CR Day 2 Operators", "CR Day 2 From and Into", "CR Day 2 Default"]
blocks:
  - type: text
    md: |
      Much of the standard library works through traits. `println!("{}")` needs `Display`, `==` needs `PartialEq`, `+` needs `Add`, sorting needs `Ord`, `HashMap` keys need `Hash` and `Eq`. Implement these traits for your types and they work with all of that code. *Programming Rust* calls this making your types "first-class citizens".

  - type: table
    title: Derivable traits
    headers: ["Trait", "Gives you", "Derive needs every field to have it"]
    rows:
      - ["`Debug`", "`{:?}` and `{:#?}` formatting", "yes"]
      - ["`Clone`", "`.clone()`: an explicit deep copy", "yes"]
      - ["`Copy`", "implicit copy on assignment instead of a move (requires `Clone`)", "yes, and no heap data: no String, Vec, Box"]
      - ["`PartialEq` / `Eq`", "`==` and `!=`; `Eq` promises `x == x` always (not true for floats: NaN)", "yes"]
      - ["`PartialOrd` / `Ord`", "`<`, `>`, `sort()`, `max()`; derive compares fields in order, enum variants in declaration order", "yes"]
      - ["`Hash`", "use as a `HashMap` key or in a `HashSet` (with `Eq`)", "yes"]
      - ["`Default`", "`Type::default()`: zero, empty, false for each field", "yes"]

  - type: code
    lang: rust
    code: |
      #[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash, Default)]
      enum Priority {
          #[default]
          Low,
          Medium,
          High,
      }

      #[derive(Debug, Clone, PartialEq, Default)]
      struct Task {
          title: String,
          priority: Priority,
          done: bool,
      }

      fn main() {
          let mut ps = vec![Priority::High, Priority::Low, Priority::Medium];
          ps.sort();
          println!("{ps:?}");
          println!("{}", Priority::High > Priority::Medium);

          let t = Task { title: String::from("write tests"), ..Default::default() };
          let copy = t.clone();
          println!("{t:?}");
          println!("{}", t == copy);
      }
    output: |
      [Low, Medium, High]
      true
      Task { title: "write tests", priority: Low, done: false }
      true
    explain: "`#[default]` picks the variant `Default` returns. `..Default::default()` fills the remaining fields. `Task` cannot be `Copy` because it holds a `String`."

  - type: text
    title: Display
    md: |
      `Debug` is for programmers; `Display` is for users, and it is never derived because only you know how your type should read. Implement its `fmt` method with `write!`. Implementing `Display` also gives you `.to_string()` through the blanket impl from lesson 2.

  - type: code
    lang: rust
    code: |
      use std::fmt;

      struct Money {
          cents: i64,
      }

      impl fmt::Display for Money {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let sign = if self.cents < 0 { "-" } else { "" };
              let c = self.cents.abs();
              write!(f, "{sign}${}.{:02}", c / 100, c % 100)
          }
      }

      fn main() {
          let price = Money { cents: 1999 };
          println!("{price}");
          println!("{}", Money { cents: -5 });
          let s: String = price.to_string();
          println!("{} characters", s.len());
      }
    output: |
      $19.99
      -$0.05
      6 characters

  - type: text
    title: From and Into
    md: |
      `From<T>` says "this type can be built from a `T`", infallibly. Implement `From` and you get **`Into` for free** (another blanket impl), so both of these work:

      ```rust
      let c = Celsius::from(Fahrenheit(212.0));
      let c: Celsius = Fahrenheit(212.0).into();
      ```

      `?` uses `From` to convert errors, as you saw in chapter 9. When a conversion can fail, implement **`TryFrom`** instead, with an associated `Error` type; you then get `try_into()`.

  - type: code
    lang: rust
    code: |
      #[derive(Debug)]
      struct Celsius(f64);
      struct Fahrenheit(f64);

      impl From<Fahrenheit> for Celsius {
          fn from(f: Fahrenheit) -> Self {
              Celsius((f.0 - 32.0) * 5.0 / 9.0)
          }
      }

      #[derive(Debug)]
      struct Even(u32);

      impl TryFrom<u32> for Even {
          type Error = String;

          fn try_from(n: u32) -> Result<Self, Self::Error> {
              if n % 2 == 0 { Ok(Even(n)) } else { Err(format!("{n} is odd")) }
          }
      }

      fn print_temp(t: impl Into<Celsius>) {
          let c: Celsius = t.into();
          println!("{:.1} °C", c.0);
      }

      fn main() {
          println!("{:?}", Celsius::from(Fahrenheit(212.0)));
          print_temp(Fahrenheit(98.6));
          let e: Result<Even, _> = 8u32.try_into();
          println!("{e:?}");
          println!("{:?}", Even::try_from(7));
      }
    output: |
      Celsius(100.0)
      37.0 °C
      Ok(Even(8))
      Err("7 is odd")
    explain: "`impl Into<Celsius>` in a parameter accepts anything convertible, a common API style. Implement `From`, not `Into`: you get both."

  - type: text
    title: AsRef and Drop
    md: |
      **`AsRef<T>`** means "can cheaply lend a `&T`". Functions use it to accept many argument types: `std::fs::read_to_string` takes `impl AsRef<Path>`, so a `&str`, a `String` and a `PathBuf` all work.

      **`Drop`** runs code when a value goes out of scope: closing a file, releasing a lock, printing a message. You cannot call `drop` methods yourself; use `std::mem::drop(value)` (in the prelude as `drop`) to drop early. Chapter 15 returns to `Drop` with smart pointers.

  - type: code
    lang: rust
    code: |
      struct Noisy(&'static str);

      impl Drop for Noisy {
          fn drop(&mut self) {
              println!("dropping {}", self.0);
          }
      }

      fn shout<S: AsRef<str>>(s: S) -> String {
          s.as_ref().to_uppercase()
      }

      fn main() {
          let _a = Noisy("a");
          {
              let _b = Noisy("b");
              println!("inner scope ends");
          }
          let c = Noisy("c");
          drop(c);
          println!("{} {}", shout("hi"), shout(String::from("there")));
          println!("main ends");
      }
    output: |
      inner scope ends
      dropping b
      dropping c
      HI THERE
      main ends
      dropping a
    explain: "Values are dropped in reverse order of declaration at the end of their scope. `drop(c)` moves `c` into the function, which drops it right away."

  - type: text
    title: Operator overloading
    md: |
      Operators are trait methods in disguise. `a + b` is `Add::add(a, b)`, `-a` is `Neg::neg(a)`, `a += b` is `AddAssign::add_assign(&mut a, b)`, and `v[i]` is `*Index::index(&v, i)`. All live in `std::ops`. Implement them for your own types where the meaning is obvious, such as vectors in maths, money, or matrices:

  - type: code
    lang: rust
    code: |
      use std::ops::{Add, AddAssign, Mul, Neg, Index};

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct V2 {
          x: f64,
          y: f64,
      }

      impl Add for V2 {
          type Output = V2;
          fn add(self, o: V2) -> V2 {
              V2 { x: self.x + o.x, y: self.y + o.y }
          }
      }

      impl Mul<f64> for V2 {
          type Output = V2;
          fn mul(self, k: f64) -> V2 {
              V2 { x: self.x * k, y: self.y * k }
          }
      }

      impl Neg for V2 {
          type Output = V2;
          fn neg(self) -> V2 {
              V2 { x: -self.x, y: -self.y }
          }
      }

      impl AddAssign for V2 {
          fn add_assign(&mut self, o: V2) {
              self.x += o.x;
              self.y += o.y;
          }
      }

      impl Index<usize> for V2 {
          type Output = f64;
          fn index(&self, i: usize) -> &f64 {
              match i {
                  0 => &self.x,
                  1 => &self.y,
                  _ => panic!("V2 index out of range: {i}"),
              }
          }
      }

      fn main() {
          let a = V2 { x: 1.0, y: 2.0 };
          let b = V2 { x: 0.5, y: -1.0 };
          let mut c = a + b * 2.0;
          println!("{c:?}");
          c += -a;
          println!("{c:?} {} {}", c[0], c[1]);
      }
    output: |
      V2 { x: 2.0, y: 0.0 }
      V2 { x: 1.0, y: -2.0 } 1 -2
    explain: "`Output` is an associated type: the result of `V2 * f64` could be any type you choose. `Mul<f64>` takes the right-hand type as a generic parameter, so `V2` could also implement `Mul<V2>` separately. Deriving `Copy` lets `a` be used after `a + ...` moved it."

  - type: callout
    kind: warning
    title: Overload only where it reads naturally
    md: "*Programming Rust* advises keeping operators for types where they mean what readers expect. `+` on two money values is clear; `+` that appends a user to a database is not. Comparison operators come from `PartialEq` and `PartialOrd`, usually derived."

  - type: exercise
    id: ch10-ex-std-traits
    exercise_dir: ch10-std-traits
    title: "A Money type that fits in"
    difficulty: hard
    goal: "Make a type first-class by implementing Display, Default, From, TryFrom, Add, Sub, Neg, AddAssign and Sum, and deriving comparisons."
    behavior: |
      `pub struct Money { pub cents: i64 }` (derive `Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Default` is already written).
      - `Display`: `"$12.30"`, `"-$0.05"`, `"$0.00"` (dollars, a dot, two-digit cents).
      - `From<i64>` (whole dollars): `Money::from(3)` is 300 cents.
      - `TryFrom<&str>` with `type Error = String`: parses `"12.30"`, `"-0.05"` or `"7"` (no cents). Exactly two digits after a dot if a dot is present. Anything else gives `Err(format!("bad amount: {s}"))`.
      - `Add`, `Sub`, `Neg` (all `Output = Money`) and `AddAssign`.
      - `std::iter::Sum` so `vec_of_money.into_iter().sum::<Money>()` works: `fn sum<I: Iterator<Item = Money>>(iter: I) -> Money`.
    examples:
      - input: "Money::from(3) + Money { cents: 45 }"
        output: "Money { cents: 345 } (prints $3.45)"
      - input: "Money::try_from(\"-0.05\")"
        output: "Ok(Money { cents: -5 })"
      - input: "Money::try_from(\"1.5\")"
        output: "Err(\"bad amount: 1.5\")"
    hints:
      - "Display: `let sign = if self.cents < 0 { \"-\" } else { \"\" }; let c = self.cents.abs(); write!(f, \"{sign}${}.{:02}\", c / 100, c % 100)`."
      - "TryFrom: strip a leading `-` with `strip_prefix`, then `split_once('.')`. Check the cents part has length 2 and all digits; parse dollars as `i64` with `.map_err(|_| err())?`."
      - "Sum: `iter.fold(Money::default(), |a, b| a + b)`."
    rust:
      starter: |
        use std::fmt;
        use std::ops::{Add, AddAssign, Neg, Sub};

        #[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Default)]
        pub struct Money {
            pub cents: i64,
        }

        // impl fmt::Display for Money

        // impl From<i64> for Money

        // impl TryFrom<&str> for Money  (type Error = String)

        // impl Add, Sub, Neg, AddAssign for Money

        // impl std::iter::Sum for Money
      tests: |
        use super::*;

        fn m(c: i64) -> Money {
            Money { cents: c }
        }

        #[test]
        fn display() {
            assert_eq!(m(1230).to_string(), "$12.30");
            assert_eq!(m(-5).to_string(), "-$0.05");
            assert_eq!(Money::default().to_string(), "$0.00");
        }

        #[test]
        fn from_dollars() {
            assert_eq!(Money::from(3), m(300));
            let x: Money = 2.into();
            assert_eq!(x, m(200), "From gives Into");
        }

        #[test]
        fn parsing() {
            assert_eq!(Money::try_from("12.30"), Ok(m(1230)));
            assert_eq!(Money::try_from("-0.05"), Ok(m(-5)));
            assert_eq!(Money::try_from("7"), Ok(m(700)));
            assert_eq!(Money::try_from("1.5"), Err(String::from("bad amount: 1.5")));
            assert_eq!(Money::try_from("abc"), Err(String::from("bad amount: abc")));
            assert_eq!(Money::try_from("1.x5"), Err(String::from("bad amount: 1.x5")));
        }

        #[test]
        fn arithmetic() {
            assert_eq!(Money::from(3) + m(45), m(345));
            assert_eq!(m(100) - m(250), m(-150));
            assert_eq!(-m(5), m(-5));
            let mut wallet = m(10);
            wallet += m(5);
            assert_eq!(wallet, m(15));
        }

        #[test]
        fn summing_and_ordering() {
            let items = vec![m(199), m(1), m(300)];
            let total: Money = items.iter().copied().sum();
            assert_eq!(total, m(500));
            assert_eq!(items.iter().copied().max(), Some(m(300)), "derived Ord");
        }
      solution: |
        use std::fmt;
        use std::ops::{Add, AddAssign, Neg, Sub};

        #[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Default)]
        pub struct Money {
            pub cents: i64,
        }

        impl fmt::Display for Money {
            fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                let sign = if self.cents < 0 { "-" } else { "" };
                let c = self.cents.abs();
                write!(f, "{sign}${}.{:02}", c / 100, c % 100)
            }
        }

        impl From<i64> for Money {
            fn from(dollars: i64) -> Self {
                Money { cents: dollars * 100 }
            }
        }

        impl TryFrom<&str> for Money {
            type Error = String;

            fn try_from(s: &str) -> Result<Self, Self::Error> {
                let err = || format!("bad amount: {s}");
                let (negative, body) = match s.strip_prefix('-') {
                    Some(rest) => (true, rest),
                    None => (false, s),
                };
                let (dollars, cents) = match body.split_once('.') {
                    Some((d, c)) => {
                        if c.len() != 2 || !c.chars().all(|ch| ch.is_ascii_digit()) {
                            return Err(err());
                        }
                        (d, c.parse::<i64>().map_err(|_| err())?)
                    }
                    None => (body, 0),
                };
                if dollars.is_empty() || !dollars.chars().all(|ch| ch.is_ascii_digit()) {
                    return Err(err());
                }
                let dollars: i64 = dollars.parse().map_err(|_| err())?;
                let total = dollars * 100 + cents;
                Ok(Money { cents: if negative { -total } else { total } })
            }
        }

        impl Add for Money {
            type Output = Money;
            fn add(self, o: Money) -> Money {
                Money { cents: self.cents + o.cents }
            }
        }

        impl Sub for Money {
            type Output = Money;
            fn sub(self, o: Money) -> Money {
                Money { cents: self.cents - o.cents }
            }
        }

        impl Neg for Money {
            type Output = Money;
            fn neg(self) -> Money {
                Money { cents: -self.cents }
            }
        }

        impl AddAssign for Money {
            fn add_assign(&mut self, o: Money) {
                self.cents += o.cents;
            }
        }

        impl std::iter::Sum for Money {
            fn sum<I: Iterator<Item = Money>>(iter: I) -> Money {
                iter.fold(Money::default(), |a, b| a + b)
            }
        }
    solution_explain: "Storing cents in an `i64` avoids floating-point rounding, which is why money is almost never an `f64`. Each trait plugs `Money` into a piece of the language or standard library: formatting, conversions, operators, and `Iterator::sum`."

  - type: quiz
    id: ch10-quiz-std
    title: Check yourself
    questions:
      - type: single
        q: "Why can't a struct with a `String` field derive `Copy`?"
        options: ["Strings are immutable", "Copy is only for types with no heap data to duplicate; a String owns heap memory", "Copy cannot be derived", "Strings are not Clone"]
        answer: 1
        explanation: "A bitwise copy would make two owners of one heap buffer."
      - type: single
        q: "You implement `From<A> for B`. What else do you get?"
        options: ["Nothing", "`Into<B> for A`", "`From<B> for A`", "`Display for B`"]
        answer: 1
        explanation: "A blanket impl provides Into."
      - type: single
        q: "What does `a + b` call for a type that implements `Add`?"
        options: ["`a.plus(b)`", "`Add::add(a, b)`", "`a.add_assign(b)`", "`Sum::sum`"]
        answer: 1
        explanation: "Operators are trait methods."
      - type: single
        q: "In what order are `x` then `y` (declared in that order in one scope) dropped?"
        options: ["x, then y", "y, then x", "At random", "Neither is dropped"]
        answer: 1
        explanation: "Reverse order of declaration."
      - type: multi
        q: "Which traits must a type implement to be a `HashMap` key?"
        options: ["`Hash`", "`Eq`", "`Display`", "`Copy`"]
        answer: [0, 1]
        explanation: "Keys are hashed and compared for equality."
      - type: single
        q: "Why does `f64` implement `PartialOrd` but not `Ord`?"
        options: ["Floats are too big", "NaN is not ordered with anything, so a total order does not exist", "Ord is only for integers by design", "It does implement Ord"]
        answer: 1
        explanation: "That is why `v.sort()` does not work on a `Vec<f64>`."

  - type: summary
    points:
      - "Derive `Debug`, `Clone`, `Copy`, `PartialEq`, `Eq`, `PartialOrd`, `Ord`, `Hash` and `Default` when they make sense."
      - "Implement `Display` by hand for user-facing output; it gives `to_string()` too."
      - "Implement `From` (and get `Into`); use `TryFrom` for fallible conversions."
      - "`AsRef` lets functions accept many argument types; `Drop` runs cleanup at end of scope."
      - "Operators come from `std::ops` traits like `Add`, `Neg`, `AddAssign` and `Index`, usually with an associated `Output` type."
terms:
  - term: derive
    def: "An attribute (#[derive(...)]) that generates a trait implementation from a type's fields."
  - term: Display
    def: "The trait for user-facing formatting with {}; implemented by hand."
  - term: "From / Into"
    def: "Infallible conversion traits; implementing From<T> for U also gives Into<U> for T."
  - term: TryFrom
    def: "A conversion trait that can fail, returning Result<Self, Self::Error>."
  - term: Drop
    def: "A trait whose drop method runs when a value goes out of scope."
  - term: operator overloading
    def: "Implementing std::ops traits so operators like + and [] work with your types."
