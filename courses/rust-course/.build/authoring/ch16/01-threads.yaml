    solution_code: |
      use std::thread;

      fn main() {
          let docs = vec![
              String::from("the quick brown fox"),
              String::from("jumps over"),
              String::from("the lazy dog and keeps running far"),
          ];

          let mut handles = Vec::new();
          for doc in docs {
              handles.push(thread::spawn(move || doc.split_whitespace().count()));
          }

          let mut total = 0;
          for h in handles {
              total += h.join().unwrap();
          }
          println!("total words: {total}");
      }
    hints:
      - "`handles.push(thread::spawn(move || doc.split_whitespace().count()));`"
      - "`total += h.join().unwrap();`"
      - "The starter does not compile until `handles` has an element type: pushing a JoinHandle gives it one."

  - type: exercise
    id: ch16-ex-threads
    exercise_dir: ch16-threads
    title: "Fork-join helpers"
    difficulty: hard
    goal: "Split work across threads, both with move and with scoped threads, and handle a panicking thread."
    behavior: |
      - `pub fn parallel_sum(data: &[u64], parts: usize) -> u64`: split `data` into `parts` chunks (use `chunks` with a size of `ceil(len / parts)`, at least 1) and sum each chunk on its own **scoped** thread. Empty data gives 0.
      - `pub fn map_in_threads(inputs: Vec<String>, f: fn(&str) -> String) -> Vec<String>`: one spawned thread per input (with `move`), results in the input order.
      - `pub fn run_safely(job: fn() -> i32) -> Result<i32, String>`: run `job` on a thread; if it panicked, return `Err("job panicked")`.
    examples:
      - input: "parallel_sum(&[1, 2, 3, 4, 5], 2)"
        output: "15"
      - input: "map_in_threads(vec![\"a\".into(), \"bc\".into()], |s| s.to_uppercase())"
        output: "[\"A\", \"BC\"]"
    hints:
      - "Chunk size: `data.len().div_ceil(parts.max(1)).max(1)`."
      - "`thread::scope(|s| { let handles: Vec<_> = data.chunks(size).map(|c| s.spawn(move || c.iter().sum::<u64>())).collect(); handles.into_iter().map(|h| h.join().unwrap()).sum() })`"
      - "`fn` pointers are `Copy` and `Send`, so `f` can be moved into many threads."
      - "`thread::spawn(job).join().map_err(|_| String::from(\"job panicked\"))`"
    rust:
      starter: |
        use std::thread;

        pub fn parallel_sum(data: &[u64], parts: usize) -> u64 {
            todo!()
        }

        pub fn map_in_threads(inputs: Vec<String>, f: fn(&str) -> String) -> Vec<String> {
            todo!()
        }

        pub fn run_safely(job: fn() -> i32) -> Result<i32, String> {
            todo!()
        }
      tests: |
        use super::*;

        #[test]
        fn sums() {
            let data: Vec<u64> = (1..=1000).collect();
            assert_eq!(parallel_sum(&data, 4), 500500);
            assert_eq!(parallel_sum(&data, 7), 500500, "uneven chunks");
            assert_eq!(parallel_sum(&[1, 2, 3, 4, 5], 10), 15, "more parts than items");
            assert_eq!(parallel_sum(&[], 3), 0);
            assert_eq!(parallel_sum(&[5], 0), 5, "zero parts treated as one");
        }

        #[test]
        fn maps_in_order() {
            let out = map_in_threads(vec!["a".into(), "bc".into(), "def".into()], |s| s.to_uppercase());
            assert_eq!(out, vec!["A", "BC", "DEF"]);
            let lens = map_in_threads(vec!["xyz".into()], |s| s.len().to_string());
            assert_eq!(lens, vec!["3"]);
        }

        #[test]
        fn catches_panics() {
            assert_eq!(run_safely(|| 42), Ok(42));
            assert_eq!(run_safely(|| panic!("boom")), Err(String::from("job panicked")));
        }
      solution: |
        use std::thread;

        pub fn parallel_sum(data: &[u64], parts: usize) -> u64 {
            let size = data.len().div_ceil(parts.max(1)).max(1);
            thread::scope(|s| {
                let handles: Vec<_> = data
                    .chunks(size)
                    .map(|c| s.spawn(move || c.iter().sum::<u64>()))
                    .collect();
                handles.into_iter().map(|h| h.join().unwrap()).sum()
            })
        }

        pub fn map_in_threads(inputs: Vec<String>, f: fn(&str) -> String) -> Vec<String> {
            let handles: Vec<_> = inputs
                .into_iter()
                .map(|s| thread::spawn(move || f(&s)))
                .collect();
            handles.into_iter().map(|h| h.join().unwrap()).collect()
        }

        pub fn run_safely(job: fn() -> i32) -> Result<i32, String> {
            thread::spawn(job).join().map_err(|_| String::from("job panicked"))
        }
    solution_explain: "Collecting the handles into a vector **before** joining is essential: joining inside the same `map` would wait for each thread before starting the next, making the code sequential. In `parallel_sum`, `move` copies the chunk reference `c` into the closure; the scope lets that borrow of `data` be used across threads."

  - type: quiz
    id: ch16-quiz-threads
    title: Check yourself
    questions:
      - type: single
        q: "What happens to spawned threads when main returns?"
        options: ["They keep running", "They are stopped, whether finished or not", "main waits for them automatically", "They become the main thread"]
        answer: 1
        explanation: "Use join to wait."
      - type: single
        q: "What does `handle.join()` return if the thread panicked?"
        options: ["It panics too, always", "An `Err` value", "`Ok(())`", "Nothing; it hangs"]
        answer: 1
        explanation: "Panics are reported through join's Result."
      - type: single
        q: "Why must closures passed to thread::spawn usually be `move`?"
        options: ["Threads cannot read memory", "The thread may outlive the variables it borrows", "move makes it faster", "For Send"]
        answer: 1
        explanation: "spawn requires 'static data."
      - type: single
        q: "What does `thread::scope` guarantee?"
        options: ["Threads run in order", "Every thread spawned in it is joined before the scope ends, so they may borrow locals", "Threads never panic", "Only one thread runs at a time"]
        answer: 1
        explanation: "That makes borrowing safe."
      - type: single
        q: "Spawning and joining inside the same loop iteration makes the work..."
        options: ["parallel", "sequential", "a compile error", "faster"]
        answer: 1
        explanation: "Spawn them all first, then join."

  - type: summary
    points:
      - "`thread::spawn(closure)` starts a thread; its `JoinHandle` lets you `join` and get the return value."
      - "When `main` ends, all threads end; join the ones you need."
      - "Use `move` to give a thread ownership of its data."
      - "`thread::scope` lets threads borrow local data, because they are joined before the scope ends."
      - "Spawn everything first, then join, or the work runs one after another."
terms:
  - term: thread
    def: "An independently scheduled sequence of execution inside a process."
  - term: JoinHandle
    def: "The value returned by thread::spawn; join waits for the thread and returns its result."
  - term: race condition
    def: "A bug where the result depends on the timing of threads accessing shared data."
  - term: deadlock
    def: "Threads waiting for each other forever."
  - term: scoped thread
    def: "A thread spawned with thread::scope, guaranteed to finish before the scope ends, so it can borrow locals."
  - term: fork-join
    def: "Splitting work into parts, running them in parallel, and joining the results."
