title: "Using threads to run code simultaneously"
summary: "Processes and threads, the problems concurrency brings, thread::spawn and JoinHandle, join, move closures, returning values from threads, scoped threads that can borrow, and a closer look at what a thread costs."
minutes: 35
source:
  chapter: ch16
  sections: ["TRPL 16 Fearless Concurrency", "TRPL 16.1 Using Threads to Run Code Simultaneously", "TRPL 16.1 Creating a New Thread with spawn", "TRPL 16.1 Waiting for All Threads to Finish", "TRPL 16.1 Using move Closures with Threads", "RiA 10.1 Anonymous functions", "RiA 10.2 Spawning threads", "RiA 10.2 Effect of spawning a few threads", "RiA 10.2 Effect of spawning many threads", "RiA 10.2 Thread yielding", "PR ch19 Fork-Join Parallelism", "PR ch19 spawn and join", "PR ch19 Error Handling Across Threads", "PR ch19 Sharing Immutable Data Across Threads", "CR Concurrency Morning Threads", "CR Concurrency Morning Scoped Threads"]
blocks:
  - type: text
    md: |
      An operating system runs each program in a **process**. Inside a process, independent parts can run at the same time as **threads**. Splitting work across threads can make a program faster on multi-core machines, or keep it responsive while it waits. It also brings classic problems:

      - **Race conditions**: threads access data in an inconsistent order.
      - **Deadlocks**: two threads each wait for the other, forever.
      - **Heisenbugs**: bugs that happen only sometimes and vanish when you look.

      Rust's ownership and type system turn many of these into **compile-time errors**. The Rust community calls this **fearless concurrency**: you can refactor concurrent code and the compiler tells you when you break something.

  - type: text
    title: Spawning a thread
    md: |
      `std::thread::spawn` takes a closure and runs it on a new thread. Rust uses **1:1** threads: one operating-system thread per language thread.

  - type: code
    lang: rust
    code: |
      use std::thread;
      use std::time::Duration;

      fn main() {
          thread::spawn(|| {
              for i in 1..10 {
                  println!("hi number {i} from the spawned thread!");
                  thread::sleep(Duration::from_millis(1));
              }
          });

          for i in 1..5 {
              println!("hi number {i} from the main thread!");
              thread::sleep(Duration::from_millis(1));
          }
      }
    explain: "Run it a few times: the two threads take turns in a different order each time, decided by the operating system's scheduler. And the spawned thread **does not finish**: when `main` returns, the whole process ends, and every other thread is stopped."

  - type: code
    lang: text
    code: |
      hi number 1 from the main thread!
      hi number 1 from the spawned thread!
      hi number 2 from the main thread!
      hi number 2 from the spawned thread!
      hi number 3 from the main thread!
      hi number 3 from the spawned thread!
      hi number 4 from the main thread!
      hi number 4 from the spawned thread!
      hi number 5 from the spawned thread!
    explain: "One possible run. Yours will differ."

  - type: text
    title: Waiting with join
    md: |
      `spawn` returns a **`JoinHandle<T>`**. Calling **`.join()`** on it blocks the current thread until that thread finishes. Where you call it matters:

  - type: code
    lang: rust
    code: |
      use std::thread;

      fn main() {
          let handle = thread::spawn(|| {
              let mut total = 0u64;
              for i in 1..=1_000_000u64 {
                  total += i;
              }
              total // the thread's return value
          });

          println!("main keeps working while the sum runs...");

          let total = handle.join().unwrap();
          println!("sum = {total}");
      }
    output: |
      main keeps working while the sum runs...
      sum = 500000500000
    explain: "`join` returns `Result<T, _>`: `Ok` with the closure's return value, or `Err` if the thread panicked. A panic in a spawned thread does not crash the others; `join` is where you find out about it (*Programming Rust*)."

  - type: text
    title: move closures and threads
    md: |
      A thread's closure often needs data from the spawning thread. It must **own** that data, because Rust cannot know how long the thread will run:

  - type: code
    lang: rust
    code: |
      use std::thread;

      fn main() {
          let v = vec![1, 2, 3];

          let handle = thread::spawn(|| {
              println!("Here's a vector: {v:?}");
          });

          handle.join().unwrap();
      }
    output: |
      error[E0373]: closure may outlive the current function, but it borrows `v`, which is owned by the current function
       --> src/main.rs:6:32
        |
      6 |     let handle = thread::spawn(|| {
        |                                ^^ may outlive borrowed value `v`
      7 |         println!("Here's a vector: {v:?}");
        |                                     - `v` is borrowed here
        |
      note: function requires argument type to outlive `'static`
       --> src/main.rs:6:18
        |
      6 |       let handle = thread::spawn(|| {
        |  __________________^
      7 | |         println!("Here's a vector: {v:?}");
      8 | |     });
        | |______^
      help: to force the closure to take ownership of `v` (and any other referenced variables), use the `move` keyword
        |
      6 |     let handle = thread::spawn(move || {
        |                                ++++
    output_label: Compiler output
    explain: "If this compiled, `main` could `drop(v)` while the thread still uses it. With `move`, the vector moves into the thread, and `main` can no longer touch it: the compiler then rejects `drop(v)` instead."

  - type: text
    title: Scoped threads can borrow
    md: |
      `move` is not always what you want: sometimes several threads should **read** the same local data, and you will wait for all of them anyway. **`thread::scope`** guarantees that every thread spawned inside it is joined before the scope returns, so those threads may borrow local variables:

  - type: code
    lang: rust
    code: |
      use std::thread;

      fn main() {
          let numbers: Vec<u64> = (1..=100).collect();
          let (left, right) = numbers.split_at(numbers.len() / 2);

          let (a, b) = thread::scope(|s| {
              let h1 = s.spawn(|| left.iter().sum::<u64>());
              let h2 = s.spawn(|| right.iter().sum::<u64>());
              (h1.join().unwrap(), h2.join().unwrap())
          });

          println!("{a} + {b} = {}", a + b);
          println!("numbers is still usable: {} items", numbers.len());
      }
    output: |
      1275 + 3775 = 5050
      numbers is still usable: 100 items
    explain: "This is **fork-join parallelism** (*Programming Rust*): split the work, run the parts in parallel, join the results. No `move`, no cloning, no `Arc`; the borrow checker knows the threads end inside the scope."

  - type: callout
    kind: note
    title: What a thread costs (Rust in Action)
    md: "Spawning an OS thread takes microseconds and reserves its own stack (2 MiB by default for Rust threads). *Rust in Action* measures that a few threads are almost free, but thousands start to slow the whole program, and spinning in a loop wastes CPU that `thread::sleep` or `thread::yield_now` would give back. For many small tasks, use a thread pool (chapter 25) or async (chapter 17)."

