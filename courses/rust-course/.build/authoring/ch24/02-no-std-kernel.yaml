            }
        }

        impl fmt::Write for Writer<'_> {
            fn write_str(&mut self, s: &str) -> fmt::Result {
                todo!()
            }
        }
      tests: |
        use super::*;
        use core::fmt::Write;

        fn row(buf: &[u16], width: usize, r: usize) -> String {
            buf[r * width..(r + 1) * width]
                .iter()
                .map(|&c| match (c & 0xff) as u8 {
                    0xfe => '#',
                    b => b as char,
                })
                .collect()
        }

        #[test]
        fn attributes_and_cells() {
            assert_eq!(attribute(Color::BrightCyan, Color::Black), 0x0b);
            assert_eq!(attribute(Color::Yellow, Color::Blue), 0x1e);
            assert_eq!(cell(b'A', 0x1e), 0x1e41);
            assert_eq!(Color::White as u8, 15);
        }

        #[test]
        fn new_clears() {
            let mut buf = [0xffffu16; 6];
            let w = Writer::new(&mut buf, 3, 2);
            assert_eq!(w.position(), (0, 0));
            assert!(buf.iter().all(|&c| c == 0x0720));
        }

        #[test]
        #[should_panic]
        fn wrong_size_panics() {
            let mut buf = [0u16; 5];
            Writer::new(&mut buf, 3, 2);
        }

        #[test]
        fn writing_and_colors() {
            let mut buf = [0u16; 8];
            let mut w = Writer::new(&mut buf, 4, 2);
            w.write_byte(b'h');
            w.set_color(Color::Yellow, Color::Blue);
            w.write_byte(b'i');
            assert_eq!(w.position(), (0, 2));
            assert_eq!(buf[0], 0x0768);
            assert_eq!(buf[1], 0x1e69);
            assert_eq!(buf[2], 0x0720);
        }

        #[test]
        fn newline_and_wrap() {
            let mut buf = [0u16; 15];
            let mut w = Writer::new(&mut buf, 5, 3);
            write!(w, "ab\ncdefgh").unwrap();
            assert_eq!(w.position(), (2, 1));
            assert_eq!(row(&buf, 5, 0), "ab   ");
            assert_eq!(row(&buf, 5, 1), "cdefg");
            assert_eq!(row(&buf, 5, 2), "h    ");
        }

        #[test]
        fn exact_fill_waits_to_wrap() {
            let mut buf = [0u16; 6];
            let mut w = Writer::new(&mut buf, 3, 2);
            write!(w, "abc").unwrap();
            assert_eq!(w.position(), (0, 3));
            w.write_byte(b'\n');
            assert_eq!(w.position(), (1, 0));
        }

        #[test]
        fn scrolling() {
            let mut buf = [0u16; 6];
            let mut w = Writer::new(&mut buf, 3, 2);
            write!(w, "one\ntwo\nsix").unwrap();
            assert_eq!(w.position(), (1, 3));
            assert_eq!(row(&buf, 3, 0), "two");
            assert_eq!(row(&buf, 3, 1), "six");
        }

        #[test]
        fn scroll_blanks_in_current_color() {
            let mut buf = [0u16; 4];
            let mut w = Writer::new(&mut buf, 2, 2);
            w.set_color(Color::White, Color::Red);
            write!(w, "a\nb\n").unwrap();
            assert_eq!(w.position(), (1, 0));
            assert_eq!(row(&buf, 2, 0), "b ");
            assert_eq!(buf[0], 0x4f62);
            assert_eq!(buf[1], 0x0720);
            assert_eq!(buf[2], 0x4f20);
            assert_eq!(buf[3], 0x4f20);
        }

        #[test]
        fn wrapping_on_last_row_scrolls() {
            let mut buf = [0u16; 4];
            let mut w = Writer::new(&mut buf, 2, 2);
            write!(w, "abcdef").unwrap();
            assert_eq!(w.position(), (1, 2));
            assert_eq!(row(&buf, 2, 0), "cd");
            assert_eq!(row(&buf, 2, 1), "ef");
        }

        #[test]
        fn non_printable_bytes() {
            let mut buf = [0u16; 8];
            let mut w = Writer::new(&mut buf, 8, 1);
            write!(w, "é\t~").unwrap();
            assert_eq!(row(&buf, 8, 0), "###~    ");
        }

        #[test]
        fn clear_resets() {
            let mut buf = [0u16; 4];
            let mut w = Writer::new(&mut buf, 2, 2);
            write!(w, "xyz").unwrap();
            w.set_color(Color::Black, Color::Green);
            w.clear();
            assert_eq!(w.position(), (0, 0));
            assert!(buf.iter().all(|&c| c == 0x2020));
        }

        #[test]
        fn formatting() {
            let mut buf = [0u16; 20];
            let mut w = Writer::new(&mut buf, 20, 1);
            write!(w, "{}+{}={}", 2, 2, 2 + 2).unwrap();
            assert_eq!(row(&buf, 20, 0).trim_end(), "2+2=4");
        }
      solution: |
        #![cfg_attr(not(test), no_std)]

        use core::fmt;

        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        #[repr(u8)]
        pub enum Color {
            Black = 0, Blue = 1, Green = 2, Cyan = 3,
            Red = 4, Magenta = 5, Brown = 6, Gray = 7,
            DarkGray = 8, BrightBlue = 9, BrightGreen = 10, BrightCyan = 11,
            BrightRed = 12, BrightMagenta = 13, Yellow = 14, White = 15,
        }

        pub fn attribute(fg: Color, bg: Color) -> u8 {
            (bg as u8) << 4 | fg as u8
        }

        pub fn cell(ch: u8, attr: u8) -> u16 {
            (attr as u16) << 8 | ch as u16
        }

        pub struct Writer<'a> {
            buf: &'a mut [u16],
            width: usize,
            height: usize,
            row: usize,
            col: usize,
            attr: u8,
        }

        impl<'a> Writer<'a> {
            pub fn new(buf: &'a mut [u16], width: usize, height: usize) -> Writer<'a> {
                assert_eq!(buf.len(), width * height, "buffer size must be width * height");
                let mut w = Writer { buf, width, height, row: 0, col: 0, attr: 0x07 };
                w.clear();
                w
            }

            pub fn set_color(&mut self, fg: Color, bg: Color) {
                self.attr = attribute(fg, bg);
            }

            pub fn position(&self) -> (usize, usize) {
                (self.row, self.col)
            }

            fn blank(&self) -> u16 {
                cell(b' ', self.attr)
            }

            fn newline(&mut self) {
                self.col = 0;
                if self.row + 1 < self.height {
                    self.row += 1;
                } else {
                    let w = self.width;
                    self.buf.copy_within(w.., 0);
                    let blank = self.blank();
                    let last = (self.height - 1) * w;
                    self.buf[last..].fill(blank);
                }
            }

            pub fn write_byte(&mut self, b: u8) {
                let ch = match b {
                    b'\n' => {
                        self.newline();
                        return;
                    }
                    0x20..=0x7e => b,
                    _ => 0xfe,
                };
                if self.col == self.width {
                    self.newline();
                }
                self.buf[self.row * self.width + self.col] = cell(ch, self.attr);
                self.col += 1;
            }

            pub fn clear(&mut self) {
                let blank = self.blank();
                self.buf.fill(blank);
                self.row = 0;
                self.col = 0;
            }
        }

        impl fmt::Write for Writer<'_> {
            fn write_str(&mut self, s: &str) -> fmt::Result {
                for b in s.bytes() {
                    self.write_byte(b);
                }
                Ok(())
            }
        }
    solution_explain: "The writer only borrows a slice of cells, so the same code drives a test buffer or, in a kernel, a slice made from `0xb8000` (where you would switch the stores to `write_volatile`). Scrolling is one `copy_within` plus a `fill`. Wrapping lazily, only when the next byte arrives, keeps an exactly full line from leaving an empty row behind it."

  - type: quiz
    id: ch24-quiz-nostd
    title: Check yourself
    questions:
      - type: single
        q: "Which crate is available with `#![no_std]` and no allocator?"
        options: ["std", "alloc", "core", "none"]
        answer: 2
        explanation: "core needs nothing from the platform."
      - type: single
        q: "Why does a freestanding binary need `#![no_main]`?"
        options: ["main is slow", "No runtime calls main; we define the entry point such as _start", "It enables unsafe", "To skip the panic handler"]
        answer: 1
        explanation: "The bootloader jumps to _start."
      - type: single
        q: "Why use `write_volatile` for the VGA buffer?"
        options: ["It is faster", "The optimizer might remove ordinary writes the program never reads back", "It is the only safe write", "It writes two bytes"]
        answer: 1
        explanation: "Device memory has side effects the compiler cannot see."
      - type: single
        q: "What is the attribute byte for yellow (0xE) on blue (0x1)?"
        options: ["0xe1", "0x1e", "0x0e", "0xef"]
        answer: 1
        explanation: "Background in the high nibble, foreground in the low."
      - type: single
        q: "What lets `write!` work without std?"
        options: ["alloc::format!", "Implementing core::fmt::Write", "println!", "A global allocator"]
        answer: 1
        explanation: "One method: write_str."

  - type: summary
    points:
      - "std = core + alloc + the OS layer; no_std code uses core, plus alloc if you provide an allocator."
      - "A freestanding binary needs no_main, an entry point such as _start that never returns, and a #[panic_handler]."
      - "VGA text mode is 80x25 two-byte cells at 0xb8000: character, then attribute."
      - "Use write_volatile for memory-mapped I/O; #[repr(u8)] enums give names to hardware values."
      - "core::fmt::Write gives formatted output with no heap."
      - "Embedded Rust layers PAC, HAL and embedded-hal traits, and uses type-state to make misuse a compile error."
terms:
  - term: no_std
    def: "A crate attribute that links core instead of std, for code without an operating system."
  - term: freestanding binary
    def: "A program that runs without an operating system or C runtime."
  - term: panic handler
    def: "The function marked #[panic_handler] that decides what a panic does in a no_std program."
  - term: memory-mapped I/O
    def: "Controlling hardware by reading and writing special memory addresses."
  - term: volatile access
    def: "A memory read or write the compiler must perform exactly as written."
  - term: HAL
    def: "Hardware abstraction layer: a crate with safe drivers for a chip's peripherals."
