title: "Foreign functions: Rust and C"
summary: "The C ABI as the common language of systems code, matching C types with core::ffi, struct layout with repr(C), declaring C functions and choosing which are safe, CString and CStr, passing Rust callbacks to C, wrapping a C handle in a safe type with Drop, the -sys crate pattern, and exporting Rust functions to C without unwinding across the boundary."
minutes: 45
source:
  chapter: ch24
  sections: ["PR 23 Foreign Functions", "PR 23 Finding Common Data Representations", "PR 23 Declaring Foreign Functions and Variables", "PR 23 Using Functions from Libraries", "PR 23 A Raw Interface to libgit2", "PR 23 A Safe Interface to libgit2", "CR XVI Unsafe: FFI"]
blocks:
  - type: text
    md: |
      Not every library is written in Rust. Operating systems, databases, codecs and graphics drivers expose **C interfaces**, and almost every language can call C. *Programming Rust* calls this the common denominator: Rust's **foreign function interface** (FFI) lets Rust call C functions and lets C call Rust, as long as both sides agree on how values look in memory and how functions are called. That agreement is the **C ABI** (application binary interface).

      Chapter 20 showed the minimum: an `unsafe extern "C"` block declaring `strlen`. This lesson goes the rest of the way. Everything here calls functions from the C standard library, which every Rust program on Linux already links, so all examples run in the console.

  - type: table
    title: C types and their Rust equivalents
    headers: ["C", "Rust (core::ffi / std::ffi)", "Notes"]
    rows:
      - ["`int`, `unsigned int`", "`c_int`, `c_uint`", "aliases for `i32`, `u32` on every mainstream platform"]
      - ["`long`, `long long`", "`c_long`, `c_longlong`", "`long` is 64 bits on Linux and macOS, 32 bits on Windows"]
      - ["`char`", "`c_char`", "`i8` or `u8` depending on the platform; not Rust's 4-byte `char`"]
      - ["`double`, `float`", "`f64`, `f32`", ""]
      - ["`size_t`, `ptrdiff_t`", "`usize`, `isize`", ""]
      - ["`bool`", "`bool`", ""]
      - ["`void *`, `T *`", "`*mut c_void`, `*mut T` / `*const T`", "C pointers and C++ references are raw pointers"]
      - ["`char *` string", "`*const c_char` plus `CStr` / `CString`", "NUL-terminated"]
      - ["`struct`", "`#[repr(C)] struct`", "C field order and padding"]

  - type: text
    title: "repr(C): the C layout"
    md: |
      Rust is free to **reorder** struct fields to reduce padding, and it does. C lays fields out in declaration order, each aligned to its own size. `#[repr(C)]` asks Rust to use exactly the C rules, so a pointer to the struct can be handed to C. `std::mem::offset_of!` shows where each field lands.

  - type: code
    lang: rust
    code: |
      use std::mem::{align_of, offset_of, size_of};

      #[repr(C)]
      struct CLayout {
          a: u8,
          b: u32,
          c: u16,
      }

      struct RustLayout {
          a: u8,
          b: u32,
          c: u16,
      }

      fn main() {
          println!("repr(C): size {}, align {}", size_of::<CLayout>(), align_of::<CLayout>());
          println!("offsets a={} b={} c={}", offset_of!(CLayout, a), offset_of!(CLayout, b), offset_of!(CLayout, c));
          println!("default: size {}", size_of::<RustLayout>());
          println!("offsets a={} b={} c={}", offset_of!(RustLayout, a), offset_of!(RustLayout, b), offset_of!(RustLayout, c));
      }
    output: |
      repr(C): size 12, align 4
      offsets a=0 b=4 c=8
      default: size 8
      offsets a=6 b=0 c=4
    explain: "In C order, `a` is followed by 3 bytes of padding so `b` is 4-aligned, and 2 bytes of tail padding make the size a multiple of 4. The default Rust layout is unspecified; today's compiler puts the largest field first and saves 4 bytes. Never pass a struct without `repr(C)` to C."

  - type: text
    title: Declaring C functions, safe and unsafe
    md: |
      Inside an `unsafe extern "C" { ... }` block you write the C prototype in Rust syntax. The block is `unsafe` because the compiler cannot check that the declaration matches the real function: get a type wrong and you have undefined behavior. Every function declared there is `unsafe` to call, unless you mark it **`safe fn`**, a promise that **every** possible input is fine.

      That promise is easy to get wrong. C's `sqrt` is fine for any `double`, so it can be `safe`. But `abs(INT_MIN)` and `div(n, 0)` are undefined behavior in C, so those must stay `unsafe` and every call needs a reason it is sound. C functions that return values through pointers, like `strtol`'s end pointer, take a `*mut` to a local variable.

  - type: code
    lang: rust
    code: |
      use std::ffi::{CStr, c_char, c_int, c_long};

      #[repr(C)]
      #[derive(Debug)]
      struct DivT {
          quot: c_int,
          rem: c_int,
      }

      unsafe extern "C" {
          safe fn sqrt(x: f64) -> f64; // defined for every input
          fn abs(x: c_int) -> c_int; // abs(INT_MIN) is undefined
          fn div(n: c_int, d: c_int) -> DivT; // div by 0 is undefined
          fn strtol(s: *const c_char, end: *mut *mut c_char, base: c_int) -> c_long;
      }

      fn main() {
          println!("sqrt(2) = {}", sqrt(2.0));
          // SAFETY: -42 is not INT_MIN.
          println!("abs(-42) = {}", unsafe { abs(-42) });
          // SAFETY: the divisor is not zero and the quotient fits.
          println!("{:?}", unsafe { div(17, 5) });

          let text: &CStr = c"0x1F rest";
          let mut end: *mut c_char = std::ptr::null_mut();
          // SAFETY: text is NUL-terminated; strtol sets end to a position inside it.
          let n = unsafe { strtol(text.as_ptr(), &mut end, 0) };
          let used = end as usize - text.as_ptr() as usize;
          let rest = unsafe { CStr::from_ptr(end) };
          println!("{n} (used {used} bytes, rest {rest:?})");
      }
    output: |
      sqrt(2) = 1.4142135623730951
      abs(-42) = 42
      DivT { quot: 3, rem: 2 }
      31 (used 4 bytes, rest " rest")
    explain: "`div` returns a struct by value, which works because `DivT` is `repr(C)` with the same fields as C's `div_t`. With base 0, `strtol` reads a `0x` prefix as hexadecimal. The end pointer tells us how much of the string was a number."

  - type: text
    title: Strings across the boundary
    md: |
      C strings are a pointer to bytes ending in a NUL (`0`) byte. Rust strings carry a length and may contain `0`. Two types bridge them:

      - **`CString`** owns a NUL-terminated buffer. `CString::new(s)` copies a Rust string and appends the NUL; it fails with `NulError` if `s` contains a `0` byte. `.as_ptr()` lends it to C.
      - **`CStr`** borrows a C string. `CStr::from_ptr(p)` (unsafe) wraps a pointer you got from C; `.to_str()` checks it is UTF-8. A `c"..."` literal is a `&'static CStr`.

      They mirror `String` and `&str`, and `OsString` / `OsStr` from chapter 22.

  - type: callout
    kind: warning
    title: "The dangling as_ptr trap"
    md: "`let p = CString::new(\"hi\").unwrap().as_ptr();` compiles, but the `CString` is a temporary that is dropped at the end of the statement, so `p` points at freed memory. Keep the `CString` in a variable that lives as long as C uses the pointer. Rust warns about this (`dangling_pointers_from_temporaries`); treat that warning as an error."

  - type: code
    lang: rust
    code: |
      use std::ffi::{CStr, CString, c_char, c_int};

      unsafe extern "C" {
          fn strlen(s: *const c_char) -> usize;
          fn strchr(s: *const c_char, c: c_int) -> *mut c_char;
      }

      fn main() {
          let owned = CString::new("hello, world").expect("no NUL inside");
          let len = unsafe { strlen(owned.as_ptr()) };
          println!("strlen = {len}");

          let p = unsafe { strchr(owned.as_ptr(), b',' as c_int) };
          if !p.is_null() {
              // SAFETY: strchr returns a pointer into `owned`, which is still alive.
              let tail = unsafe { CStr::from_ptr(p) };
              println!("from comma: {:?}", tail.to_str());
          }

          println!("{:?}", CString::new("bad\0string"));
          let bytes = owned.as_bytes_with_nul();
          println!("{} bytes with NUL, last = {}", bytes.len(), bytes[bytes.len() - 1]);
          let back: String = owned.into_string().unwrap();
          println!("{back}");
      }
    output: |
      strlen = 12
      from comma: Ok(", world")
      Err(NulError(3, [98, 97, 100, 0, 115, 116, 114, 105, 110, 103]))
      13 bytes with NUL, last = 0
      hello, world
    explain: "`strchr` returns NULL when the character is missing, so the pointer is checked before use. `NulError` reports where the forbidden `0` was and gives the bytes back."

  - type: text
    title: "Callbacks: C calling Rust"
    md: |
      Some C functions take a **function pointer** and call it back. C's `qsort` sorts any array: it takes a pointer to the first element, the count, the element size and a comparison function returning negative, zero or positive. A Rust function declared `extern "C" fn` uses the C calling convention and can be passed directly. It receives `void` pointers, so it must cast them back to the real element type.

  - type: code
    lang: rust
    code: |
      use std::cmp::Ordering;
      use std::ffi::{c_int, c_void};

      unsafe extern "C" {
          fn qsort(
              base: *mut c_void,
              n: usize,
              size: usize,
              cmp: extern "C" fn(*const c_void, *const c_void) -> c_int,
          );
      }

      extern "C" fn by_abs(a: *const c_void, b: *const c_void) -> c_int {
          // SAFETY: qsort passes pointers to elements of our i32 array.
          let (a, b) = unsafe { (*(a as *const i32), *(b as *const i32)) };
          match a.unsigned_abs().cmp(&b.unsigned_abs()) {
              Ordering::Less => -1,
              Ordering::Equal => 0,
              Ordering::Greater => 1,
          }
      }

      fn main() {
          let mut v = [5, -12, 3, -1, 8, -7];
          unsafe { qsort(v.as_mut_ptr().cast(), v.len(), size_of::<i32>(), by_abs) };
          println!("{v:?}");
      }
    output: |
      [-1, 3, 5, -7, 8, -12]
    explain: "`unsigned_abs` cannot overflow, unlike `abs` on `i32::MIN`. That matters here: a panic inside an `extern \"C\"` function cannot unwind into C, so Rust **aborts the whole process** instead."

  - type: text
    title: Wrapping a C library safely
    md: |
      *Programming Rust* wraps **libgit2** in two layers, and that is how real FFI crates are built:

      1. A **raw** layer (by convention a crate named `foo-sys`) with `#[repr(C)]` types and `extern` declarations, often generated from the C headers by **bindgen**, plus a `build.rs` that tells Cargo what to link (`cargo:rustc-link-lib=git2`) or builds the C code with the `cc` crate.
      2. A **safe** layer that owns the C handles: each type holds a raw pointer, its constructor checks for errors and returns `Result`, its methods convert strings with `CString` / `CStr`, and its `Drop` calls the C cleanup function. Lifetimes (and `PhantomData`) make sure borrowed C data cannot outlive its owner.

      C hands out **opaque** types (a pointer to a struct whose fields you never see). In Rust, declare them as a zero-sized `#[repr(C)]` struct with a private field so nobody can create or move one: `#[repr(C)] pub struct git_repository { _private: [u8; 0] }`. Here is the same pattern around C's `FILE`:

  - type: code
    lang: rust
    code: |
      use std::ffi::{CStr, CString, c_char, c_int};
      use std::io;

      #[repr(C)]
      struct FILE {
          _private: [u8; 0],
      }

      unsafe extern "C" {
          fn fopen(path: *const c_char, mode: *const c_char) -> *mut FILE;
          fn fputs(s: *const c_char, f: *mut FILE) -> c_int;
          fn fclose(f: *mut FILE) -> c_int;
      }

      /// Owns an open C `FILE *`; closing happens in Drop.
      struct CFile(*mut FILE);

      impl CFile {
          fn create(path: &str) -> io::Result<CFile> {
              let path = CString::new(path).map_err(|e| io::Error::new(io::ErrorKind::InvalidInput, e))?;
              let f = unsafe { fopen(path.as_ptr(), c"w".as_ptr()) };
              if f.is_null() { Err(io::Error::last_os_error()) } else { Ok(CFile(f)) }
          }

          fn write(&mut self, s: &CStr) -> io::Result<()> {
              if unsafe { fputs(s.as_ptr(), self.0) } < 0 { Err(io::Error::last_os_error()) } else { Ok(()) }
          }
      }

      impl Drop for CFile {
          fn drop(&mut self) {
              unsafe { fclose(self.0) };
          }
      }

      fn main() -> io::Result<()> {
          let path = std::env::temp_dir().join(format!("ffi-{}.txt", std::process::id()));
          {
              let mut f = CFile::create(path.to_str().unwrap())?;
              f.write(c"written by C's stdio\n")?;
              f.write(c"closed by Drop\n")?;
          } // fclose runs here and flushes the buffer
          print!("{}", std::fs::read_to_string(&path)?);
          std::fs::remove_file(&path)?;
          println!("{:?}", CFile::create("/no/such/dir/x.txt").err().map(|e| e.kind()));
          Ok(())
      }
    output: |
      written by C's stdio
      closed by Drop
      Some(NotFound)
    explain: "Users of `CFile` never write `unsafe`, cannot forget to close the file, and get `io::Error` values. `io::Error::last_os_error()` reads C's `errno`, which `fopen` set to `ENOENT`."

  - type: text
    title: Exporting Rust to C
    md: |
      To let C call Rust, write an `extern "C" fn` and stop the compiler from **mangling** its name: `#[unsafe(no_mangle)] pub extern "C" fn rust_add(a: i32, b: i32) -> i32`. Build the crate as a C library with `crate-type = ["cdylib"]` (shared `.so` / `.dll`) or `["staticlib"]` in `Cargo.toml`, and generate the C header with **cbindgen**. The attribute is `unsafe(...)` since the 2024 edition because two exported functions with the same name would clash at link time.

      Two rules at the boundary: take only C-compatible types (raw pointers, not references, if C might pass NULL), and never let a panic escape. A panic in an `extern "C"` function aborts the process; catch it with `std::panic::catch_unwind` and turn it into an error code. (`extern "C-unwind"` exists for the rare case where unwinding through C is intended.)

  - type: code
    lang: rust
    code: |
      use std::panic;

      /// C signature: int checked_div(int a, int b, int *out);
      /// Returns 0 on success, -1 on a panic, -2 if out is NULL.
      #[unsafe(no_mangle)]
      pub extern "C" fn checked_div(a: i32, b: i32, out: *mut i32) -> i32 {
          if out.is_null() {
              return -2;
          }
          match panic::catch_unwind(|| a / b) {
              Ok(v) => {
                  // SAFETY: the caller promises out points to a writable int.
                  unsafe { *out = v };
                  0
              }
              Err(_) => -1,
          }
      }

      fn main() {
          panic::set_hook(Box::new(|_| {})); // keep the panic message out of the output
          let mut out = 0;
          println!("{} {}", checked_div(17, 5, &mut out), out);
          println!("{}", checked_div(1, 0, &mut out));
          println!("{}", checked_div(1, 1, std::ptr::null_mut()));
      }
    output: |
      0 3
      -1
      -2
    explain: "Dividing by zero panics in Rust; `catch_unwind` stops the unwinding and the function reports `-1` instead of taking the C program down."

  - type: playground
    id: ch24-play-qsort
    title: "Sort C strings with qsort and strcmp"
    lang: rust
    md: |
      `ptrs` is an array of C string pointers. Finish `compare` so `qsort` sorts them alphabetically with C's `strcmp`. `qsort` passes **pointers to elements**, and each element is itself a `*const c_char`, so each argument is really a `*const *const c_char`.
    task: "Print `apple`, `banana`, `cherry`, `fig`, `pear`."
    code: |
      use std::ffi::{CStr, c_char, c_int, c_void};

      unsafe extern "C" {
          fn qsort(base: *mut c_void, n: usize, size: usize, cmp: extern "C" fn(*const c_void, *const c_void) -> c_int);
          fn strcmp(a: *const c_char, b: *const c_char) -> c_int;
      }

      extern "C" fn compare(a: *const c_void, b: *const c_void) -> c_int {
          // TODO: cast a and b to *const *const c_char, read the string pointers, call strcmp
          0
      }

      fn main() {
          let words: [&CStr; 5] = [c"pear", c"apple", c"fig", c"banana", c"cherry"];
          let mut ptrs: Vec<*const c_char> = words.iter().map(|w| w.as_ptr()).collect();
          unsafe { qsort(ptrs.as_mut_ptr().cast(), ptrs.len(), size_of::<*const c_char>(), compare) };
          for p in ptrs {
              println!("{}", unsafe { CStr::from_ptr(p) }.to_str().unwrap());
          }
      }
    expected_output: |
      apple
      banana
      cherry
      fig
      pear
    solution_code: |
      use std::ffi::{CStr, c_char, c_int, c_void};

      unsafe extern "C" {
          fn qsort(base: *mut c_void, n: usize, size: usize, cmp: extern "C" fn(*const c_void, *const c_void) -> c_int);
          fn strcmp(a: *const c_char, b: *const c_char) -> c_int;
      }

      extern "C" fn compare(a: *const c_void, b: *const c_void) -> c_int {
          // SAFETY: qsort passes pointers to elements of `ptrs`, which hold valid C strings.
          unsafe {
              let a = *(a as *const *const c_char);
              let b = *(b as *const *const c_char);
              strcmp(a, b)
          }
      }

      fn main() {
          let words: [&CStr; 5] = [c"pear", c"apple", c"fig", c"banana", c"cherry"];
          let mut ptrs: Vec<*const c_char> = words.iter().map(|w| w.as_ptr()).collect();
          unsafe { qsort(ptrs.as_mut_ptr().cast(), ptrs.len(), size_of::<*const c_char>(), compare) };
          for p in ptrs {
              println!("{}", unsafe { CStr::from_ptr(p) }.to_str().unwrap());
          }
      }
    hints:
      - "`let a = *(a as *const *const c_char);` reads the string pointer stored in the element."
      - "`strcmp` already returns negative, zero or positive, which is what `qsort` wants."

  - type: exercise
    id: ch24-ex-ffi
    exercise_dir: ch24-ffi
    title: "Safe wrappers over libc"
    difficulty: hard
    goal: "Write safe Rust functions over C library calls, so the unsafe code and its conditions live in one place."
    behavior: |
      The `unsafe extern "C"` declarations are given. Implement:
      - `pub fn c_len(s: &CStr) -> usize` with `strlen`.
      - `pub fn c_div(n: i32, d: i32) -> Option<(i32, i32)>` with `div`; return `None` when C would hit undefined behavior: `d == 0`, or `n == i32::MIN` with `d == -1`.
      - `pub fn parse_long(s: &str, base: u32) -> Option<(i64, usize)>` with `strtol`: the value and how many bytes were used (leading spaces count). `None` if `base` is not 0 or 2..=36, if `s` contains a NUL byte, or if no digits were read.
      - `pub fn sort_desc(v: &mut [i32])` with `qsort` and your own `extern "C"` comparator, largest first. It must work for `i32::MIN` and `i32::MAX`.
      - `pub fn zero_pad(n: i32, width: usize) -> String` with `snprintf` and the format `%0*d`: call it once with a NULL buffer to learn the length, then again into a buffer of length + 1.
    examples:
      - input: "parse_long(\"  -17xyz\", 10)"
        output: "Some((-17, 5))"
      - input: "zero_pad(-42, 5)"
        output: "\"-0042\""
    hints:
      - "`parse_long`: `let c = CString::new(s).ok()?;` then call `strtol` with `&mut end` and compute `end as usize - c.as_ptr() as usize`."
      - "A comparator that returns `a - b` overflows for `i32::MIN`. Use `b.cmp(&a)` and map the `Ordering` to -1, 0 or 1."
      - "`snprintf` is variadic: pass `width as c_int` and `n as c_int` after the format. The first call `snprintf(null_mut(), 0, fmt, ...)` returns the number of characters it would write."
      - "For the second call allocate `vec![0u8; len + 1]`, pass `buf.as_mut_ptr().cast()`, then `buf.truncate(len)` and `String::from_utf8(buf)`."
    rust:
      starter: |
        use std::ffi::{CStr, CString, c_char, c_int, c_long, c_void};

        #[repr(C)]
        pub struct DivT {
            pub quot: c_int,
            pub rem: c_int,
        }

        unsafe extern "C" {
            fn strlen(s: *const c_char) -> usize;
            fn div(n: c_int, d: c_int) -> DivT;
            fn strtol(s: *const c_char, end: *mut *mut c_char, base: c_int) -> c_long;
            fn qsort(base: *mut c_void, n: usize, size: usize, cmp: extern "C" fn(*const c_void, *const c_void) -> c_int);
            fn snprintf(buf: *mut c_char, n: usize, fmt: *const c_char, ...) -> c_int;
        }

        pub fn c_len(s: &CStr) -> usize {
            todo!()
        }

        pub fn c_div(n: i32, d: i32) -> Option<(i32, i32)> {
            todo!()
        }

        pub fn parse_long(s: &str, base: u32) -> Option<(i64, usize)> {
            todo!()
        }

        pub fn sort_desc(v: &mut [i32]) {
            todo!()
        }

        pub fn zero_pad(n: i32, width: usize) -> String {
            todo!()
        }
      tests: |
        use super::*;

        #[test]
        fn lengths() {
            assert_eq!(c_len(c""), 0);
            assert_eq!(c_len(c"hello"), 5);
            let s = CString::new("ünï").unwrap();
            assert_eq!(c_len(&s), 5, "strlen counts bytes, not characters");
        }

        #[test]
        fn division() {
            assert_eq!(c_div(17, 5), Some((3, 2)));
            assert_eq!(c_div(-17, 5), Some((-3, -2)));
            assert_eq!(c_div(1, 0), None);
            assert_eq!(c_div(i32::MIN, -1), None);
            assert_eq!(c_div(i32::MIN, 1), Some((i32::MIN, 0)));
        }

        #[test]
        fn parsing() {
            assert_eq!(parse_long("42", 10), Some((42, 2)));
            assert_eq!(parse_long("  -17xyz", 10), Some((-17, 5)));
            assert_eq!(parse_long("ff", 16), Some((255, 2)));
            assert_eq!(parse_long("0x1F rest", 0), Some((31, 4)));
            assert_eq!(parse_long("1011", 2), Some((11, 4)));
            assert_eq!(parse_long("xyz", 10), None);
            assert_eq!(parse_long("", 10), None);
            assert_eq!(parse_long("12\0 3", 10), None);
            assert_eq!(parse_long("12", 1), None);
            assert_eq!(parse_long("12", 37), None);
        }

        #[test]
        fn sorting() {
            let mut v = [3, -1, 7, 0, 7, -5];
            sort_desc(&mut v);
            assert_eq!(v, [7, 7, 3, 0, -1, -5]);
            let mut empty: [i32; 0] = [];
            sort_desc(&mut empty);
            let mut extremes = [i32::MIN, i32::MAX, 0, -1, 1];
            sort_desc(&mut extremes);
            assert_eq!(extremes, [i32::MAX, 1, 0, -1, i32::MIN]);
        }

        #[test]
        fn padding() {
            assert_eq!(zero_pad(42, 5), "00042");
            assert_eq!(zero_pad(-42, 5), "-0042");
            assert_eq!(zero_pad(123_456, 3), "123456");
            assert_eq!(zero_pad(7, 0), "7");
            assert_eq!(zero_pad(i32::MIN, 12), "-02147483648");
        }
      solution: |
        use std::cmp::Ordering;
        use std::ffi::{CStr, CString, c_char, c_int, c_long, c_void};

        #[repr(C)]
        pub struct DivT {
            pub quot: c_int,
            pub rem: c_int,
        }

        unsafe extern "C" {
            fn strlen(s: *const c_char) -> usize;
            fn div(n: c_int, d: c_int) -> DivT;
            fn strtol(s: *const c_char, end: *mut *mut c_char, base: c_int) -> c_long;
            fn qsort(base: *mut c_void, n: usize, size: usize, cmp: extern "C" fn(*const c_void, *const c_void) -> c_int);
            fn snprintf(buf: *mut c_char, n: usize, fmt: *const c_char, ...) -> c_int;
        }

        pub fn c_len(s: &CStr) -> usize {
            // SAFETY: a CStr is always NUL-terminated.
            unsafe { strlen(s.as_ptr()) }
        }

        pub fn c_div(n: i32, d: i32) -> Option<(i32, i32)> {
            if d == 0 || (n == i32::MIN && d == -1) {
                return None;
            }
            // SAFETY: the two undefined cases were excluded above.
            let r = unsafe { div(n, d) };
            Some((r.quot, r.rem))
        }

        pub fn parse_long(s: &str, base: u32) -> Option<(i64, usize)> {
            if base == 1 || base > 36 {
                return None;
            }
            let c = CString::new(s).ok()?;
            let mut end: *mut c_char = std::ptr::null_mut();
            // SAFETY: c is NUL-terminated and outlives the call; end points into c afterwards.
            let value = unsafe { strtol(c.as_ptr(), &mut end, base as c_int) };
            let used = end as usize - c.as_ptr() as usize;
            if used == 0 { None } else { Some((value as i64, used)) }
        }

        extern "C" fn descending(a: *const c_void, b: *const c_void) -> c_int {
            // SAFETY: qsort passes pointers to elements of an i32 slice.
            let (a, b) = unsafe { (*(a as *const i32), *(b as *const i32)) };
            match b.cmp(&a) {
                Ordering::Less => -1,
                Ordering::Equal => 0,
                Ordering::Greater => 1,
            }
        }

        pub fn sort_desc(v: &mut [i32]) {
            if v.is_empty() {
                return;
            }
            // SAFETY: the pointer, count and element size describe the slice exactly.
            unsafe { qsort(v.as_mut_ptr().cast(), v.len(), size_of::<i32>(), descending) };
        }

        pub fn zero_pad(n: i32, width: usize) -> String {
            let fmt = c"%0*d";
            let width = width as c_int;
            // SAFETY: a NULL buffer with size 0 is allowed; the arguments match %0*d (int, int).
            let len = unsafe { snprintf(std::ptr::null_mut(), 0, fmt.as_ptr(), width, n as c_int) };
            let len = len as usize;
            let mut buf = vec![0u8; len + 1];
            // SAFETY: buf has room for len characters plus the NUL.
            unsafe { snprintf(buf.as_mut_ptr().cast(), buf.len(), fmt.as_ptr(), width, n as c_int) };
            buf.truncate(len);
            String::from_utf8(buf).expect("digits are ASCII")
        }
    solution_explain: "Each wrapper checks the conditions under which the C call is defined before making it, so callers cannot cause undefined behavior. `parse_long` relies on the end pointer to tell \"no digits\" apart from a real 0. The comparator uses `cmp` rather than subtraction, which would overflow. `zero_pad` uses the standard two-call `snprintf` pattern: measure, allocate, write."

  - type: quiz
    id: ch24-quiz-ffi
    title: Check yourself
    questions:
      - type: single
        q: "Why must a struct passed to C be `#[repr(C)]`?"
        options: ["For speed", "Rust may reorder fields; repr(C) uses C's order and padding", "To make it Copy", "To allow references"]
        answer: 1
        explanation: "The default layout is unspecified."
      - type: single
        q: "When may a foreign function be declared `safe fn`?"
        options: ["Always", "When every possible input is defined behavior", "When it returns a value", "When it is in libc"]
        answer: 1
        explanation: "sqrt yes, abs and div no."
      - type: single
        q: "What is wrong with `let p = CString::new(\"x\").unwrap().as_ptr();`?"
        options: ["Nothing", "The CString is dropped at the end of the statement, so p dangles", "as_ptr is unsafe", "It leaks"]
        answer: 1
        explanation: "Keep the CString in a variable."
      - type: single
        q: "What happens if a Rust `extern \"C\"` function panics?"
        options: ["C catches it", "The process aborts", "It returns 0", "It unwinds through C"]
        answer: 1
        explanation: "Catch panics with catch_unwind at the boundary."
      - type: single
        q: "What does a `-sys` crate usually contain?"
        options: ["A safe API", "Raw declarations and the build script that links the C library", "Tests only", "A C compiler"]
        answer: 1
        explanation: "The safe wrapper is a separate crate on top."

  - type: summary
    points:
      - "The C ABI is the common interface; core::ffi has c_int, c_char and friends."
      - "#[repr(C)] gives a struct C's layout; opaque C types are zero-sized private structs."
      - "Foreign functions are unsafe to call unless declared safe fn, which promises every input is fine."
      - "CString owns a NUL-terminated string to lend to C; CStr borrows one from C."
      - "Pass extern \"C\" fns as callbacks; wrap C handles in types whose Drop frees them."
      - "Export with #[unsafe(no_mangle)] pub extern \"C\" fn, and never let a panic cross into C."
terms:
  - term: FFI
    def: "The foreign function interface: calling functions written in another language, usually through the C ABI."
  - term: ABI
    def: "Application binary interface: how arguments, return values and data are laid out at the machine level."
  - term: repr(C)
    def: "An attribute that lays out a struct or enum the way a C compiler would."
  - term: CString / CStr
    def: "Owned and borrowed NUL-terminated strings for passing text to and from C."
  - term: name mangling
    def: "The compiler encoding extra information into symbol names; no_mangle turns it off so C can find the function."
  - term: bindgen
    def: "A tool that generates Rust extern declarations from C header files."
