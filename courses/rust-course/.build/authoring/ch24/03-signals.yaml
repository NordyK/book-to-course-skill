      tests: |
        use super::*;

        #[test]
        fn numbers() {
            assert_eq!(from_number(2), Some(Signal::Int));
            assert_eq!(from_number(9), Some(Signal::Kill));
            assert_eq!(from_number(19), Some(Signal::Stop));
            assert_eq!(from_number(20), Some(Signal::Tstp));
            assert_eq!(from_number(5), None);
            assert_eq!(from_number(0), None);
            assert_eq!(from_number(-1), None);
            assert_eq!(Signal::Term as i32, 15);
        }

        #[test]
        fn defaults() {
            use Action::*;
            for (s, a) in [
                (Signal::Term, Terminate), (Signal::Int, Terminate), (Signal::Kill, Terminate),
                (Signal::Usr1, Terminate), (Signal::Hup, Terminate), (Signal::Pipe, Terminate),
                (Signal::Segv, CoreDump), (Signal::Abrt, CoreDump), (Signal::Quit, CoreDump), (Signal::Fpe, CoreDump),
                (Signal::Chld, Ignore), (Signal::Stop, Stop), (Signal::Tstp, Stop), (Signal::Cont, Continue),
            ] {
                assert_eq!(default_action(s), a, "{s:?}");
            }
        }

        #[test]
        fn default_delivery() {
            let mut p = Process::new();
            assert!(p.is_alive() && !p.is_stopped());
            assert_eq!(p.send(Signal::Chld), Outcome::Ignored);
            assert_eq!(p.send(Signal::Segv), Outcome::CoreDumped(Signal::Segv));
            assert!(!p.is_alive());
            assert_eq!(p.send(Signal::Term), Outcome::NoProcess);
        }

        #[test]
        fn handlers_and_ignore() {
            let mut p = Process::new();
            p.set_disposition(Signal::Term, Disposition::Handle).unwrap();
            p.set_disposition(Signal::Int, Disposition::Ignore).unwrap();
            assert_eq!(p.send(Signal::Term), Outcome::Handled(Signal::Term));
            assert_eq!(p.send(Signal::Int), Outcome::Ignored);
            assert_eq!(p.send(Signal::Term), Outcome::Handled(Signal::Term));
            assert_eq!(p.handled(), &[Signal::Term, Signal::Term]);
            assert!(p.is_alive());
            p.set_disposition(Signal::Term, Disposition::Default).unwrap();
            assert_eq!(p.send(Signal::Term), Outcome::Terminated(Signal::Term));
            assert!(!p.is_alive());
            assert_eq!(p.send(Signal::Usr1), Outcome::NoProcess);
        }

        #[test]
        fn kill_and_stop_are_special() {
            let mut p = Process::new();
            assert!(p.set_disposition(Signal::Kill, Disposition::Handle).is_err());
            assert!(p.set_disposition(Signal::Stop, Disposition::Ignore).is_err());
            assert!(p.set_disposition(Signal::Tstp, Disposition::Ignore).is_ok());
            p.block(Signal::Kill);
            p.block(Signal::Stop);
            assert_eq!(p.blocked_mask(), 0);
            assert_eq!(p.send(Signal::Stop), Outcome::Stopped);
            assert_eq!(p.send(Signal::Kill), Outcome::Terminated(Signal::Kill));
        }

        #[test]
        fn stop_and_continue() {
            let mut p = Process::new();
            assert_eq!(p.send(Signal::Stop), Outcome::Stopped);
            assert!(p.is_stopped());
            assert_eq!(p.send(Signal::Cont), Outcome::Continued);
            assert!(!p.is_stopped());

            p.set_disposition(Signal::Cont, Disposition::Ignore).unwrap();
            assert_eq!(p.send(Signal::Tstp), Outcome::Stopped);
            assert_eq!(p.send(Signal::Cont), Outcome::Continued, "SIGCONT resumes even when ignored");
            assert!(!p.is_stopped());

            p.set_disposition(Signal::Cont, Disposition::Handle).unwrap();
            p.send(Signal::Stop);
            assert_eq!(p.send(Signal::Cont), Outcome::Handled(Signal::Cont));
            assert!(!p.is_stopped());
            assert_eq!(p.handled(), &[Signal::Cont]);
        }

        #[test]
        fn blocking_and_pending() {
            let mut p = Process::new();
            p.set_disposition(Signal::Usr1, Disposition::Handle).unwrap();
            p.block(Signal::Usr1);
            assert_eq!(p.send(Signal::Usr1), Outcome::Pending);
            assert_eq!(p.send(Signal::Usr1), Outcome::Pending);
            assert!(p.is_pending(Signal::Usr1));
            assert!(p.handled().is_empty());
            assert_eq!(p.unblock(Signal::Usr1), Some(Outcome::Handled(Signal::Usr1)));
            assert_eq!(p.handled(), &[Signal::Usr1], "standard signals do not queue");
            assert!(!p.is_pending(Signal::Usr1));
            assert_eq!(p.unblock(Signal::Usr1), None);
            assert_eq!(p.send(Signal::Usr1), Outcome::Handled(Signal::Usr1));
        }

        #[test]
        fn pending_default_acts_on_unblock() {
            let mut p = Process::new();
            p.block(Signal::Term);
            assert_eq!(p.send(Signal::Term), Outcome::Pending);
            assert!(p.is_alive());
            assert_eq!(p.unblock(Signal::Term), Some(Outcome::Terminated(Signal::Term)));
            assert!(!p.is_alive());
        }

        #[test]
        fn mask() {
            let mut p = Process::new();
            p.block(Signal::Int);
            p.block(Signal::Term);
            p.block(Signal::Int);
            assert_eq!(p.blocked_mask(), 1 << 2 | 1 << 15);
            p.unblock(Signal::Int);
            assert_eq!(p.blocked_mask(), 1 << 15);
        }
      solution: |
        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        pub enum Signal {
            Hup = 1, Int = 2, Quit = 3, Ill = 4, Abrt = 6, Fpe = 8, Kill = 9, Usr1 = 10,
            Segv = 11, Usr2 = 12, Pipe = 13, Alrm = 14, Term = 15, Chld = 17, Cont = 18, Stop = 19, Tstp = 20,
        }

        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        pub enum Action {
            Terminate,
            CoreDump,
            Ignore,
            Stop,
            Continue,
        }

        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        pub enum Disposition {
            Default,
            Ignore,
            Handle,
        }

        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        pub enum Outcome {
            Terminated(Signal),
            CoreDumped(Signal),
            Stopped,
            Continued,
            Ignored,
            Handled(Signal),
            Pending,
            NoProcess,
        }

        pub fn from_number(n: i32) -> Option<Signal> {
            use Signal::*;
            Some(match n {
                1 => Hup, 2 => Int, 3 => Quit, 4 => Ill, 6 => Abrt, 8 => Fpe, 9 => Kill, 10 => Usr1,
                11 => Segv, 12 => Usr2, 13 => Pipe, 14 => Alrm, 15 => Term, 17 => Chld, 18 => Cont,
                19 => Stop, 20 => Tstp,
                _ => return None,
            })
        }

        pub fn default_action(s: Signal) -> Action {
            use Signal::*;
            match s {
                Hup | Int | Kill | Usr1 | Usr2 | Pipe | Alrm | Term => Action::Terminate,
                Quit | Ill | Abrt | Fpe | Segv => Action::CoreDump,
                Chld => Action::Ignore,
                Stop | Tstp => Action::Stop,
                Cont => Action::Continue,
            }
        }

        fn bit(s: Signal) -> u32 {
            1u32 << (s as u32)
        }

        fn uncatchable(s: Signal) -> bool {
            matches!(s, Signal::Kill | Signal::Stop)
        }

        pub struct Process {
            dispositions: [Disposition; 32],
            blocked: u32,
            pending: u32,
            alive: bool,
            stopped: bool,
            handled: Vec<Signal>,
        }

        impl Process {
            pub fn new() -> Process {
                Process {
                    dispositions: [Disposition::Default; 32],
                    blocked: 0,
                    pending: 0,
                    alive: true,
                    stopped: false,
                    handled: Vec::new(),
                }
            }

            pub fn set_disposition(&mut self, s: Signal, d: Disposition) -> Result<(), &'static str> {
                if uncatchable(s) {
                    return Err("SIGKILL and SIGSTOP cannot be caught or ignored");
                }
                self.dispositions[s as usize] = d;
                Ok(())
            }

            pub fn block(&mut self, s: Signal) {
                if !uncatchable(s) {
                    self.blocked |= bit(s);
                }
            }

            pub fn unblock(&mut self, s: Signal) -> Option<Outcome> {
                self.blocked &= !bit(s);
                if self.pending & bit(s) != 0 {
                    self.pending &= !bit(s);
                    Some(self.deliver(s))
                } else {
                    None
                }
            }

            pub fn blocked_mask(&self) -> u32 {
                self.blocked
            }

            pub fn send(&mut self, s: Signal) -> Outcome {
                if !self.alive {
                    return Outcome::NoProcess;
                }
                if self.blocked & bit(s) != 0 {
                    self.pending |= bit(s);
                    return Outcome::Pending;
                }
                self.deliver(s)
            }

            fn deliver(&mut self, s: Signal) -> Outcome {
                let disposition = self.dispositions[s as usize];
                if s == Signal::Cont {
                    self.stopped = false;
                    if disposition == Disposition::Handle {
                        self.handled.push(s);
                        return Outcome::Handled(s);
                    }
                    return Outcome::Continued;
                }
                match disposition {
                    Disposition::Ignore => Outcome::Ignored,
                    Disposition::Handle => {
                        self.handled.push(s);
                        Outcome::Handled(s)
                    }
                    Disposition::Default => match default_action(s) {
                        Action::Terminate => {
                            self.alive = false;
                            Outcome::Terminated(s)
                        }
                        Action::CoreDump => {
                            self.alive = false;
                            Outcome::CoreDumped(s)
                        }
                        Action::Ignore => Outcome::Ignored,
                        Action::Stop => {
                            self.stopped = true;
                            Outcome::Stopped
                        }
                        Action::Continue => Outcome::Continued,
                    },
                }
            }

            pub fn is_alive(&self) -> bool {
                self.alive
            }

            pub fn is_stopped(&self) -> bool {
                self.stopped
            }

            pub fn is_pending(&self, s: Signal) -> bool {
                self.pending & bit(s) != 0
            }

            pub fn handled(&self) -> &[Signal] {
                &self.handled
            }
        }
    solution_explain: "The kernel really does keep two bit masks per thread, blocked and pending, which is why a second SIGUSR1 sent while the first is pending is lost: a bit cannot count. Putting delivery in one private `deliver` method keeps `send` and `unblock` consistent. Kill and Stop are refused in both `set_disposition` and `block`, so no process can make itself unkillable."

  - type: quiz
    id: ch24-quiz-signals
    title: Check yourself
    questions:
      - type: single
        q: "Which of these comes from the current instruction rather than a device?"
        options: ["A timer tick", "A page fault", "A key press", "A network packet"]
        answer: 1
        explanation: "Exceptions are caused by the instruction being executed."
      - type: single
        q: "Which two signals can never be caught, blocked or ignored?"
        options: ["SIGINT and SIGTERM", "SIGKILL and SIGSTOP", "SIGSEGV and SIGABRT", "SIGUSR1 and SIGUSR2"]
        answer: 1
        explanation: "So the system can always stop or kill a process."
      - type: single
        q: "What should a signal handler do?"
        options: ["Print a message and exit", "Set an atomic flag and return", "Lock a Mutex and update state", "Allocate a log entry"]
        answer: 1
        explanation: "Only async-signal-safe work; the main loop acts on the flag."
      - type: single
        q: "Why is `longjmp` a bad fit for Rust?"
        options: ["It is slow", "It skips the destructors of the frames it jumps over", "It needs threads", "It only works on Windows"]
        answer: 1
        explanation: "Use Result and ? or catch_unwind."
      - type: single
        q: "SIGUSR1 is blocked and sent three times. How many times does its handler run after unblocking?"
        options: ["0", "1", "3", "It depends on timing"]
        answer: 1
        explanation: "Standard signals set one pending bit; they do not queue."

  - type: summary
    points:
      - "Hardware interrupts come from devices, exceptions from the current instruction, signals from the kernel to a process."
      - "Each signal has a default action: terminate, core dump, ignore, stop or continue."
      - "SIGKILL and SIGSTOP cannot be caught, blocked or ignored."
      - "Handlers run between any two instructions, so they only set atomics or do other async-signal-safe work."
      - "Blocked signals wait as pending bits and do not queue."
      - "Graceful shutdown: the handler records the request, the main loop acts on it; use signal-hook or ctrlc in real code."
terms:
  - term: interrupt
    def: "A signal from hardware that makes the CPU stop and run a handler in the kernel."
  - term: exception
    def: "An event caused by the current CPU instruction: a trap, a fault or an abort."
  - term: signal
    def: "A notification the kernel delivers to a process, such as SIGINT or SIGTERM."
  - term: signal handler
    def: "A function the kernel runs in the process when a signal is delivered."
  - term: async-signal-safe
    def: "Safe to call from a signal handler, even if the signal interrupted the same code."
  - term: pending signal
    def: "A signal that has been sent but not yet delivered, usually because it is blocked."
