title: "Rc<T> and RefCell<T>"
summary: "Shared ownership with reference counting, Rc::clone and strong_count, interior mutability with RefCell and run-time borrow checking, the mock object example, Cell for Copy values, and combining Rc<RefCell<T>> for shared mutable data."
minutes: 40
source:
  chapter: ch15
  sections: ["TRPL 15.4 Rc<T>, the Reference Counted Smart Pointer", "TRPL 15.4 Sharing Data", "TRPL 15.4 Cloning to Increase the Reference Count", "TRPL 15.5 RefCell<T> and the Interior Mutability Pattern", "TRPL 15.5 Enforcing Borrowing Rules at Runtime", "TRPL 15.5 Using Interior Mutability", "TRPL 15.5 Testing with Mock Objects", "TRPL 15.5 Tracking Borrows at Runtime", "TRPL 15.5 Allowing Multiple Owners of Mutable Data", "PR ch9 Interior Mutability", "PR ch4 Rc and Arc: Shared Ownership", "RiA 6.2 Smart pointer building blocks", "CR Day 3 Rc", "CR Day 3 Cell and RefCell"]
blocks:
  - type: text
    md: |
      Ownership usually has one owner. Sometimes a value really has several: in a graph, a node may be pointed to by many edges and should live as long as any of them. **`Rc<T>`** (reference counted) allows that. It keeps a count of how many `Rc`s point to the value and drops the value when the count reaches zero.

      *The Rust Programming Language*'s picture: a TV in a family room. The first person in turns it on; others come and watch; the last one to leave turns it off. `Rc<T>` is for **single-threaded** code; chapter 16 has `Arc<T>` for threads.

  - type: text
    title: Sharing a list
    md: |
      Two lists `b` and `c` should share the tail `a`. With `Box`, the first `Cons` would **move** `a` and the second could not use it. With `Rc`, both hold a counted pointer:

  - type: code
    lang: rust
    code: |
      use std::rc::Rc;

      enum List {
          Cons(i32, Rc<List>),
          Nil,
      }

      use List::{Cons, Nil};

      fn main() {
          let a = Rc::new(Cons(5, Rc::new(Cons(10, Rc::new(Nil)))));
          println!("count after creating a = {}", Rc::strong_count(&a));
          let _b = Cons(3, Rc::clone(&a));
          println!("count after creating b = {}", Rc::strong_count(&a));
          {
              let _c = Cons(4, Rc::clone(&a));
              println!("count after creating c = {}", Rc::strong_count(&a));
          }
          println!("count after c goes out of scope = {}", Rc::strong_count(&a));
      }
    output: |
      count after creating a = 1
      count after creating b = 2
      count after creating c = 3
      count after c goes out of scope = 2
    explain: "`Rc::clone(&a)` does not copy the list; it increments the count and returns another pointer. Writing `Rc::clone(&a)` rather than `a.clone()` is the convention, so deep clones and cheap count bumps look different when reading code."

