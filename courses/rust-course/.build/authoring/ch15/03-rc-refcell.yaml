  - type: callout
    kind: key
    title: Rc gives shared, read-only access
    md: "Through an `Rc<T>` you get only `&T`. If several owners could mutate the value, the borrowing rules (one writer or many readers) would be broken. To mutate shared data, combine `Rc` with a type that provides **interior mutability**."

  - type: text
    title: Interior mutability and RefCell<T>
    md: |
      **Interior mutability** is a design pattern that lets you mutate data even through a shared reference. It is safe because the borrowing rules are still enforced, just at **run time** instead of compile time. **`RefCell<T>`** does this:

      - `.borrow()` returns a `Ref<T>`, which acts like `&T`;
      - `.borrow_mut()` returns a `RefMut<T>`, which acts like `&mut T`.

      `RefCell` counts the active borrows. Asking for `borrow_mut` while any other borrow is alive, or for `borrow` while a mutable one is alive, **panics**. The rules are the same; the check moved from the compiler to the program.

  - type: table
    title: Box, Rc and RefCell
    headers: ["", "`Box<T>`", "`Rc<T>`", "`RefCell<T>`"]
    rows:
      - ["owners", "one", "many", "one"]
      - ["borrow checking", "compile time", "compile time (shared only)", "run time"]
      - ["mutation", "if the Box is `mut`", "no", "yes, even through `&RefCell<T>`"]
      - ["cost", "a heap allocation", "allocation + counter updates", "a borrow counter, checks on each borrow"]
      - ["threads", "yes", "no (use `Arc`)", "no (use `Mutex`)"]

  - type: text
    title: "A use case: mock objects"
    md: |
      *The Rust Programming Language* tests a `LimitTracker` that sends a warning when a user nears a quota. It talks to the outside world through a trait whose method takes `&self`:

      ```rust
      pub trait Messenger {
          fn send(&self, msg: &str);
      }
      ```

      A test wants a **mock** messenger that only records the messages so the test can inspect them. But recording means mutating, and `send` gets only `&self`. Changing the trait to `&mut self` would distort the real design just for a test. `RefCell` solves it:

  - type: code
    lang: rust
    code: |
      use std::cell::RefCell;

      pub trait Messenger {
          fn send(&self, msg: &str);
      }

      pub struct LimitTracker<'a, T: Messenger> {
          messenger: &'a T,
          value: usize,
          max: usize,
      }

      impl<'a, T: Messenger> LimitTracker<'a, T> {
          pub fn new(messenger: &'a T, max: usize) -> LimitTracker<'a, T> {
              LimitTracker { messenger, value: 0, max }
          }

          pub fn set_value(&mut self, value: usize) {
              self.value = value;
              let percentage_of_max = self.value as f64 / self.max as f64;
              if percentage_of_max >= 1.0 {
                  self.messenger.send("Error: You are over your quota!");
              } else if percentage_of_max >= 0.9 {
                  self.messenger.send("Urgent warning: You've used up over 90% of your quota!");
              } else if percentage_of_max >= 0.75 {
                  self.messenger.send("Warning: You've used up over 75% of your quota!");
              }
          }
      }

      struct MockMessenger {
          sent_messages: RefCell<Vec<String>>,
      }

      impl Messenger for MockMessenger {
          fn send(&self, message: &str) {
              self.sent_messages.borrow_mut().push(String::from(message));
          }
      }

      fn main() {
          let mock = MockMessenger { sent_messages: RefCell::new(vec![]) };
          let mut tracker = LimitTracker::new(&mock, 100);
          tracker.set_value(80);
          tracker.set_value(95);
          println!("{:?}", mock.sent_messages.borrow());
      }
    output: |
      ["Warning: You've used up over 75% of your quota!", "Urgent warning: You've used up over 90% of your quota!"]

  - type: code
    lang: rust
    code: |
      use std::cell::RefCell;

      fn main() {
          let cell = RefCell::new(vec![1, 2, 3]);
          let first = cell.borrow_mut();
          let second = cell.borrow_mut(); // a second mutable borrow at once
          println!("{} {}", first.len(), second.len());
      }
    output: |
      thread 'main' panicked at src/main.rs:6:23:
      RefCell already borrowed
      note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace
    output_label: Standard error
    explain: "This compiles, but it breaks the rules at run time, so it panics. `try_borrow_mut()` returns a `Result` instead, for code that wants to handle the conflict."

  - type: callout
    kind: tip
    title: Cell<T> for small Copy values
    md: "`Cell<T>` is a lighter form of interior mutability for `Copy` types: `get()` copies the value out and `set(v)` replaces it. No references to the inside are ever handed out, so no borrow tracking is needed. *Programming Rust* uses it for counters, such as a hit counter on a struct shared by `&`."

  - type: text
    title: "Rc<RefCell<T>>: shared and mutable"
    md: |
      Combine the two: `Rc` for several owners, `RefCell` for mutation. Every owner can then change the value, and every owner sees the change:

  - type: code
    lang: rust
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      #[derive(Debug)]
      enum List {
          Cons(Rc<RefCell<i32>>, Rc<List>),
          Nil,
      }

      use List::{Cons, Nil};

      fn main() {
          let value = Rc::new(RefCell::new(5));

          let a = Rc::new(Cons(Rc::clone(&value), Rc::new(Nil)));
          let b = Cons(Rc::new(RefCell::new(3)), Rc::clone(&a));
          let c = Cons(Rc::new(RefCell::new(4)), Rc::clone(&a));

          *value.borrow_mut() += 10;

          println!("a after = {a:?}");
          println!("b after = {b:?}");
          println!("c after = {c:?}");
      }
    output: |
      a after = Cons(RefCell { value: 15 }, Nil)
      b after = Cons(RefCell { value: 3 }, Cons(RefCell { value: 15 }, Nil))
      c after = Cons(RefCell { value: 4 }, Cons(RefCell { value: 15 }, Nil))
    explain: "`value.borrow_mut()` goes through the `Rc` with deref coercion and asks the `RefCell` for a mutable borrow, which ends at the semicolon."

  - type: playground
    id: ch15-play-shared-account
    title: "A shared bank account"
    lang: rust
    md: |
      Two cards share one account. Make `Card` hold an `Rc<RefCell<Account>>` so a payment with either card changes the same balance, and print how many owners the account has.
    task: "Print `balance after payments: 70` and `owners: 3`."
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      struct Account {
          balance: i64,
      }

      struct Card {
          account: Account, // TODO: share it
      }

      impl Card {
          fn pay(&self, amount: i64) {
              // TODO: subtract amount from the shared balance
          }
      }

      fn main() {
          let account = Rc::new(RefCell::new(Account { balance: 100 }));
          let debit = Card { account: Rc::clone(&account) };
          let credit = Card { account: Rc::clone(&account) };
          debit.pay(20);
          credit.pay(10);
          println!("balance after payments: {}", account.borrow().balance);
          println!("owners: {}", Rc::strong_count(&account));
      }
    starter_ok: compile_error
    expected_output: |
      balance after payments: 70
      owners: 3
    solution_code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      struct Account {
          balance: i64,
      }

      struct Card {
          account: Rc<RefCell<Account>>,
      }

      impl Card {
          fn pay(&self, amount: i64) {
              self.account.borrow_mut().balance -= amount;
          }
      }

      fn main() {
          let account = Rc::new(RefCell::new(Account { balance: 100 }));
          let debit = Card { account: Rc::clone(&account) };
          let credit = Card { account: Rc::clone(&account) };
          debit.pay(20);
          credit.pay(10);
          println!("balance after payments: {}", account.borrow().balance);
          println!("owners: {}", Rc::strong_count(&account));
      }
    hints:
      - "`account: Rc<RefCell<Account>>`"
      - "`self.account.borrow_mut().balance -= amount;` works with `&self`: that is interior mutability."

  - type: exercise
    id: ch15-ex-rc
    exercise_dir: ch15-rc
    title: "Shared inventory with mock notifications"
    difficulty: hard
    goal: "Share mutable state with Rc<RefCell<T>> and test through a trait with a RefCell-based mock."
    behavior: |
      - `pub trait Notifier { fn notify(&self, msg: &str); }`.
      - `pub struct Store { stock: Rc<RefCell<HashMap<String, u32>>>, notifier: Rc<dyn Notifier> }`. Several `Store` values (branches) may share one stock map.
      - `pub fn new(stock: &Rc<RefCell<HashMap<String, u32>>>, notifier: Rc<dyn Notifier>) -> Store`.
      - `pub fn restock(&self, item: &str, n: u32)` adds to the shared stock.
      - `pub fn sell(&self, item: &str, n: u32) -> Result<(), String>`: fails with `"not enough <item>"` (and changes nothing) if stock is too low; on success, if the remaining stock is below 3, calls `notify("low stock: <item> (<left>)")`.
      - `pub struct Recorder { pub messages: RefCell<Vec<String>> }` implementing `Notifier` by recording messages, and `pub fn recorder() -> Rc<Recorder>`.
    examples:
      - input: "restock(\"pen\", 5) then sell(\"pen\", 3)"
        output: "Ok(()) and one message \"low stock: pen (2)\""
    hints:
      - "`*self.stock.borrow_mut().entry(item.to_string()).or_insert(0) += n;`"
      - "In `sell`, take one `borrow_mut()` into a variable, check and update, then **drop** that borrow before calling `notify` (keep the borrow inside a block). The notifier may not need the stock, but holding borrows across calls is a classic source of `already borrowed` panics."
      - "`Rc<Recorder>` coerces to `Rc<dyn Notifier>` when you pass `rec.clone()` where `Rc<dyn Notifier>` is expected."
    rust:
      starter: |
        use std::cell::RefCell;
        use std::collections::HashMap;
        use std::rc::Rc;

        pub trait Notifier {
            fn notify(&self, msg: &str);
        }

        pub struct Store {
            stock: Rc<RefCell<HashMap<String, u32>>>,
            notifier: Rc<dyn Notifier>,
        }

        impl Store {
            pub fn new(stock: &Rc<RefCell<HashMap<String, u32>>>, notifier: Rc<dyn Notifier>) -> Store {
                todo!()
            }

            pub fn restock(&self, item: &str, n: u32) {
                todo!()
            }

            pub fn sell(&self, item: &str, n: u32) -> Result<(), String> {
                todo!()
            }
        }

        pub struct Recorder {
            pub messages: RefCell<Vec<String>>,
        }

        // impl Notifier for Recorder

        pub fn recorder() -> Rc<Recorder> {
            todo!()
        }
      tests: |
        use super::*;

        fn setup() -> (Rc<RefCell<HashMap<String, u32>>>, Rc<Recorder>) {
            (Rc::new(RefCell::new(HashMap::new())), recorder())
        }

        #[test]
        fn restock_and_sell() {
            let (stock, rec) = setup();
            let s = Store::new(&stock, rec.clone());
            s.restock("pen", 10);
            assert_eq!(s.sell("pen", 4), Ok(()));
            assert_eq!(stock.borrow()["pen"], 6);
            assert!(rec.messages.borrow().is_empty(), "6 left is not low");
        }

        #[test]
        fn not_enough() {
            let (stock, rec) = setup();
            let s = Store::new(&stock, rec.clone());
            s.restock("ink", 2);
            assert_eq!(s.sell("ink", 3), Err(String::from("not enough ink")));
            assert_eq!(s.sell("paper", 1), Err(String::from("not enough paper")));
            assert_eq!(stock.borrow()["ink"], 2, "unchanged after a failed sale");
        }

        #[test]
        fn low_stock_notifies() {
            let (stock, rec) = setup();
            let s = Store::new(&stock, rec.clone());
            s.restock("pen", 5);
            s.sell("pen", 3).unwrap();
            s.sell("pen", 2).unwrap();
            assert_eq!(*rec.messages.borrow(), vec!["low stock: pen (2)", "low stock: pen (0)"]);
        }

        #[test]
        fn branches_share_stock() {
            let (stock, rec) = setup();
            let north = Store::new(&stock, rec.clone());
            let south = Store::new(&stock, rec.clone());
            north.restock("mug", 4);
            assert_eq!(south.sell("mug", 4), Ok(()));
            assert_eq!(north.sell("mug", 1), Err(String::from("not enough mug")));
            assert_eq!(Rc::strong_count(&stock), 3, "the map has three owners");
        }
      solution: |
        use std::cell::RefCell;
        use std::collections::HashMap;
        use std::rc::Rc;

        pub trait Notifier {
            fn notify(&self, msg: &str);
        }

        pub struct Store {
            stock: Rc<RefCell<HashMap<String, u32>>>,
            notifier: Rc<dyn Notifier>,
        }

        impl Store {
            pub fn new(stock: &Rc<RefCell<HashMap<String, u32>>>, notifier: Rc<dyn Notifier>) -> Store {
                Store { stock: Rc::clone(stock), notifier }
            }

            pub fn restock(&self, item: &str, n: u32) {
                *self.stock.borrow_mut().entry(item.to_string()).or_insert(0) += n;
            }

            pub fn sell(&self, item: &str, n: u32) -> Result<(), String> {
                let left = {
                    let mut stock = self.stock.borrow_mut();
                    let count = stock.get_mut(item).filter(|c| **c >= n).ok_or(format!("not enough {item}"))?;
                    *count -= n;
                    *count
                };
                if left < 3 {
                    self.notifier.notify(&format!("low stock: {item} ({left})"));
                }
                Ok(())
            }
        }

        pub struct Recorder {
            pub messages: RefCell<Vec<String>>,
        }

        impl Notifier for Recorder {
            fn notify(&self, msg: &str) {
                self.messages.borrow_mut().push(msg.to_string());
            }
        }

        pub fn recorder() -> Rc<Recorder> {
            Rc::new(Recorder { messages: RefCell::new(Vec::new()) })
        }
    solution_explain: "`Store`'s methods take `&self`, yet change the shared map: interior mutability. The block in `sell` ends the `borrow_mut` before `notify` runs. `Rc<dyn Notifier>` is a trait object (chapter 18) so the store works with any notifier; the test's `Recorder` is a mock like the one in the lesson."

  - type: quiz
    id: ch15-quiz-rc
    title: Check yourself
    questions:
      - type: single
        q: "What does `Rc::clone(&a)` do?"
        options: ["Deep-copies the data", "Increments the reference count and returns a new pointer to the same data", "Moves a", "Creates a weak pointer"]
        answer: 1
        explanation: "It is cheap."
      - type: single
        q: "When is the value inside an Rc dropped?"
        options: ["When the first Rc is dropped", "When the strong count reaches zero", "At the end of main", "Never"]
        answer: 1
        explanation: "The last owner turns off the TV."
      - type: single
        q: "Why can't you mutate through an `Rc<T>` directly?"
        options: ["Rc is immutable for performance", "Several owners with mutable access would break the borrowing rules", "It is a compile-time constant", "You can"]
        answer: 1
        explanation: "Use Rc<RefCell<T>>."
      - type: single
        q: "What happens if you call `borrow_mut()` on a RefCell that is already mutably borrowed?"
        options: ["Compile error", "A panic at run time", "It waits", "It returns the same borrow"]
        answer: 1
        explanation: "The checks happen at run time."
      - type: single
        q: "Which would you use for a shared counter of type `u32` that you increment through `&self`?"
        options: ["`Box<u32>`", "`Cell<u32>`", "`Rc<u32>`", "`&mut u32`"]
        answer: 1
        explanation: "Cell is ideal for small Copy values."
      - type: truefalse
        q: "Rc<T> can be sent to another thread."
        answer: false
        explanation: "Its counter is not thread-safe; use Arc<T>."

  - type: summary
    points:
      - "`Rc<T>` gives several owners shared, read-only access; the value is dropped when the last owner goes."
      - "`Rc::clone` bumps the count; `Rc::strong_count` reports it."
      - "Interior mutability: `RefCell<T>` allows mutation through `&` and checks the borrowing rules at run time, panicking on violation."
      - "`Cell<T>` is the light version for `Copy` values."
      - "`Rc<RefCell<T>>` is the standard way to have shared mutable data in single-threaded code."
terms:
  - term: "Rc<T>"
    def: "A reference-counted smart pointer allowing several owners of the same heap value (single-threaded)."
  - term: reference counting
    def: "Tracking how many owners a value has and freeing it when the count reaches zero."
  - term: interior mutability
    def: "A pattern that allows mutating data through shared references, with the rules checked at run time."
  - term: "RefCell<T>"
    def: "A type providing interior mutability by tracking borrows at run time."
  - term: "Cell<T>"
    def: "Interior mutability for Copy values through get and set, without references."
  - term: mock object
    def: "A stand-in for a real dependency in tests that records how it was used."
