title: "Reference cycles and Weak<T>"
summary: "How Rc and RefCell can create a reference cycle that leaks memory, strong versus weak references, upgrade and downgrade, and a tree whose children own nodes while parents are weak."
minutes: 30
source:
  chapter: ch15
  sections: ["TRPL 15.6 Reference Cycles Can Leak Memory", "TRPL 15.6 Creating a Reference Cycle", "TRPL 15.6 Preventing Reference Cycles Using Weak<T>", "TRPL 15.6 Creating a Tree Data Structure", "TRPL 15.6 Adding a Reference from a Child to Its Parent", "TRPL 15.6 Visualizing Changes to strong_count and weak_count", "PR ch4 Rc and Arc: Shared Ownership", "CR Day 3 Weak"]
blocks:
  - type: text
    md: |
      Rust's guarantees make memory leaks **hard**, not impossible. A leak is memory that is never freed. Leaking is memory-safe, so Rust does not forbid it, and `Rc` plus `RefCell` make one possible: if two values point to each other with `Rc`, neither count ever reaches zero.

  - type: code
    lang: rust
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      #[derive(Debug)]
      enum List {
          Cons(i32, RefCell<Rc<List>>),
          Nil,
      }

      use List::{Cons, Nil};

      impl List {
          fn tail(&self) -> Option<&RefCell<Rc<List>>> {
              match self {
                  Cons(_, item) => Some(item),
                  Nil => None,
              }
          }
      }

      fn main() {
          let a = Rc::new(Cons(5, RefCell::new(Rc::new(Nil))));
          println!("a initial rc count = {}", Rc::strong_count(&a));

          let b = Rc::new(Cons(10, RefCell::new(Rc::clone(&a))));
          println!("a rc count after b creation = {}", Rc::strong_count(&a));
          println!("b initial rc count = {}", Rc::strong_count(&b));

          if let Some(link) = a.tail() {
              *link.borrow_mut() = Rc::clone(&b); // a now points back to b
          }

          println!("b rc count after changing a = {}", Rc::strong_count(&b));
          println!("a rc count after changing a = {}", Rc::strong_count(&a));
          // println!("a next item = {:?}", a.tail()); // would recurse until the stack overflows
      }
    output: |
      a initial rc count = 1
      a rc count after b creation = 2
      b initial rc count = 1
      b rc count after changing a = 2
      a rc count after changing a = 2
    explain: "At the end of `main`, `b` is dropped: its count goes from 2 to 1, not 0, because `a` still points to it. Then `a` goes from 2 to 1 because `b`'s list still points to it. Both allocations stay forever. Printing the cycle with `{:?}` would follow it around until the stack overflowed."

