title: "Advanced traits"
summary: "Associated types versus generic parameters, default type parameters and operator overloading with std::ops, fully qualified syntax for identically named methods, supertraits, and the newtype pattern for implementing external traits on external types."
minutes: 40
source:
  chapter: ch20
  sections: ["TRPL 20.2 Advanced Traits", "TRPL 20.2 Defining Traits with Associated Types", "TRPL 20.2 Using Default Generic Parameters and Operator Overloading", "TRPL 20.2 Disambiguating Between Identically Named Methods", "TRPL 20.2 Using Supertraits", "TRPL 20.2 Implementing External Traits with the Newtype Pattern", "PR ch12 Operator Overloading", "PR ch12 Arithmetic and Bitwise Operators", "PR ch12 Compound Assignment Operators", "PR ch12 Index and IndexMut", "PR ch11 Associated Types", "PR ch11 Fully Qualified Method Calls"]
blocks:
  - type: text
    title: Associated types
    md: |
      An **associated type** is a type placeholder inside a trait that each implementation fills in. `Iterator` is the standard example:

      ```rust
      pub trait Iterator {
          type Item;
          fn next(&mut self) -> Option<Self::Item>;
      }
      ```

      Why not a generic, `trait Iterator<T>`? With a generic, a type could implement `Iterator<u32>` **and** `Iterator<String>`, and every call to `next` would need an annotation saying which. An associated type allows **one** implementation per type, so `counter.next()` is unambiguous. Rule of thumb: if a type should implement the trait once, use an associated type; if many times with different types, use a generic parameter.

  - type: code
    lang: rust
    code: |
      struct Counter {
          count: u32,
      }

      impl Iterator for Counter {
          type Item = u32;

          fn next(&mut self) -> Option<Self::Item> {
              if self.count < 5 {
                  self.count += 1;
                  Some(self.count)
              } else {
                  None
              }
          }
      }

      fn main() {
          let total: u32 = Counter { count: 0 }.zip(Counter { count: 0 }.skip(1)).map(|(a, b)| a * b).sum();
          println!("{total}");
      }
    output: "40"
    explain: "`1*2 + 2*3 + 3*4 + 4*5 = 40`. Implementing only `next` gave `Counter` every iterator adapter."

  - type: text
    title: Default type parameters and operator overloading
    md: |
      A generic parameter can have a **default**: `trait Add<Rhs = Self>`. Implementations that do not name `Rhs` get `Self`. This is how operators work: `a + b` is `Add::add(a, b)`, and the traits in **`std::ops`** let your types use the operators. You cannot invent new operators, only implement the existing ones.

      The standard library declares:

      ```rust
      trait Add<Rhs = Self> {
          type Output;
          fn add(self, rhs: Rhs) -> Self::Output;
      }
      ```

  - type: code
    lang: rust
    code: |
      use std::ops::{Add, AddAssign, Index, Mul, Neg};

      #[derive(Debug, Copy, Clone, PartialEq)]
      struct Point {
          x: i32,
          y: i32,
      }

      impl Add for Point {
          type Output = Point;
          fn add(self, other: Point) -> Point {
              Point { x: self.x + other.x, y: self.y + other.y }
          }
      }

      impl Mul<i32> for Point {
          type Output = Point;
          fn mul(self, k: i32) -> Point {
              Point { x: self.x * k, y: self.y * k }
          }
      }

      impl Neg for Point {
          type Output = Point;
          fn neg(self) -> Point {
              Point { x: -self.x, y: -self.y }
          }
      }

      impl AddAssign for Point {
          fn add_assign(&mut self, other: Point) {
              self.x += other.x;
              self.y += other.y;
          }
      }

      impl Index<usize> for Point {
          type Output = i32;
          fn index(&self, i: usize) -> &i32 {
              match i {
                  0 => &self.x,
                  1 => &self.y,
                  _ => panic!("Point index {i} out of range"),
              }
          }
      }

      fn main() {
          let mut p = Point { x: 1, y: 0 } + Point { x: 2, y: 3 };
          println!("{p:?}");
          println!("{:?}", -(p * 2));
          p += Point { x: 10, y: 10 };
          println!("x = {}, y = {}", p[0], p[1]);
      }
    output: |
      Point { x: 3, y: 3 }
      Point { x: -6, y: -6 }
      x = 13, y = 13

  - type: text
    md: |
      Setting `Rhs` to something other than `Self` lets you add **different** types. *The Rust Programming Language* adds meters to millimeters, using newtypes so the units cannot be mixed up by accident:

  - type: code
    lang: rust
    code: |
      use std::ops::Add;

      #[derive(Debug)]
      struct Millimeters(u32);
      struct Meters(u32);

      impl Add<Meters> for Millimeters {
          type Output = Millimeters;

          fn add(self, other: Meters) -> Millimeters {
              Millimeters(self.0 + (other.0 * 1000))
          }
      }

      fn main() {
          println!("{:?}", Millimeters(500) + Meters(2));
      }
    output: "Millimeters(2500)"

  - type: table
    title: Common std::ops traits
    headers: ["Operator", "Trait", "Method"]
    rows:
      - ["`a + b`, `a - b`, `a * b`, `a / b`, `a % b`", "`Add`, `Sub`, `Mul`, `Div`, `Rem`", "`add(self, rhs)` ..."]
      - ["`-a`, `!a`", "`Neg`, `Not`", "`neg(self)`, `not(self)`"]
      - ["`a += b` (and `-=`, `*=` ...)", "`AddAssign`, `SubAssign` ...", "`add_assign(&mut self, rhs)`"]
      - ["`a & b`, `a | b`, `a ^ b`, `a << n`", "`BitAnd`, `BitOr`, `BitXor`, `Shl`", "..."]
      - ["`v[i]`, `v[i] = x`", "`Index`, `IndexMut`", "`index(&self, i)`, `index_mut(&mut self, i)`"]
      - ["`a == b`, `a < b`", "`PartialEq`, `PartialOrd` (in `std::cmp`)", "`eq`, `partial_cmp`"]

  - type: text
    title: Fully qualified syntax
    md: |
      Two traits may define methods with the same name, and a type may implement both, plus have its own inherent method of that name. By default `person.fly()` calls the **inherent** method. To call a trait's version, name the trait: `Pilot::fly(&person)`.

      Associated **functions** without `self` are harder: `Animal::baby_name()` does not say which type's implementation you want. **Fully qualified syntax** names both: `<Dog as Animal>::baby_name()`. In general: `<Type as Trait>::function(receiver_if_method, next_arg, ...)`.

  - type: code
    lang: rust
    code: |
      trait Pilot {
          fn fly(&self);
      }

      trait Wizard {
          fn fly(&self);
      }

      struct Human;

      impl Pilot for Human {
          fn fly(&self) {
              println!("This is your captain speaking.");
          }
      }

      impl Wizard for Human {
          fn fly(&self) {
              println!("Up!");
          }
      }

      impl Human {
          fn fly(&self) {
              println!("*waving arms furiously*");
          }
      }

      trait Animal {
          fn baby_name() -> String;
      }

      struct Dog;

      impl Dog {
          fn baby_name() -> String {
              String::from("Spot")
          }
      }

      impl Animal for Dog {
          fn baby_name() -> String {
              String::from("puppy")
          }
      }

      fn main() {
          let person = Human;
          Pilot::fly(&person);
          Wizard::fly(&person);
          person.fly();

          println!("A baby dog is called a {}", Dog::baby_name());
          println!("A baby dog is called a {}", <Dog as Animal>::baby_name());
      }
    output: |
      This is your captain speaking.
      Up!
      *waving arms furiously*
      A baby dog is called a Spot
      A baby dog is called a puppy

  - type: code
    lang: rust
    code: |
      trait Animal {
          fn baby_name() -> String;
      }

      struct Dog;

      impl Animal for Dog {
          fn baby_name() -> String {
              String::from("puppy")
          }
      }

      fn main() {
          println!("A baby dog is called a {}", Animal::baby_name());
      }
    output: |
      error[E0790]: cannot call associated function on trait without specifying the corresponding `impl` type
        --> src/main.rs:14:43
         |
       2 |     fn baby_name() -> String;
         |     ------------------------- `Animal::baby_name` defined here
      ...
      14 |     println!("A baby dog is called a {}", Animal::baby_name());
         |                                           ^^^^^^^^^^^^^^^^^^^ cannot call associated function of trait
         |
      help: use the fully-qualified path to the only available implementation
         |
      14 |     println!("A baby dog is called a {}", <Dog as Animal>::baby_name());
         |                                           +++++++       +
    output_label: Compiler output

  - type: text
    title: Supertraits
    md: |
      A trait can depend on another: `trait OutlinePrint: fmt::Display` means every `OutlinePrint` type must also be `Display`, so the default method may call `to_string()`. You met this in chapter 18. Forgetting the supertrait's impl gives a clear error:

  - type: code
    lang: rust
    code: |
      use std::fmt;

      trait OutlinePrint: fmt::Display {
          fn outline_print(&self) {
              let output = self.to_string();
              let len = output.len();
              println!("{}", "*".repeat(len + 4));
              println!("*{}*", " ".repeat(len + 2));
              println!("* {output} *");
              println!("*{}*", " ".repeat(len + 2));
              println!("{}", "*".repeat(len + 4));
          }
      }

      struct Point {
          x: i32,
          y: i32,
      }

      impl OutlinePrint for Point {}

      fn main() {}
    output: |
      error[E0277]: `Point` doesn't implement `std::fmt::Display`
        --> src/main.rs:20:23
         |
      20 | impl OutlinePrint for Point {}
         |                       ^^^^^ unsatisfied trait bound
         |
      help: the trait `std::fmt::Display` is not implemented for `Point`
        --> src/main.rs:15:1
         |
      15 | struct Point {
         | ^^^^^^^^^^^^
      note: required by a bound in `OutlinePrint`
        --> src/main.rs:3:21
         |
       3 | trait OutlinePrint: fmt::Display {
         |                     ^^^^^^^^^^^^ required by this bound in `OutlinePrint`
    output_label: Compiler output

  - type: code
    lang: rust
    code: |
      use std::fmt;

      trait OutlinePrint: fmt::Display {
          fn outline_print(&self) {
              let output = self.to_string();
              let len = output.len();
              println!("{}", "*".repeat(len + 4));
              println!("*{}*", " ".repeat(len + 2));
              println!("* {output} *");
              println!("*{}*", " ".repeat(len + 2));
              println!("{}", "*".repeat(len + 4));
          }
      }

      struct Point {
          x: i32,
          y: i32,
      }

      impl fmt::Display for Point {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "({}, {})", self.x, self.y)
          }
      }

      impl OutlinePrint for Point {}

      fn main() {
          Point { x: 1, y: 3 }.outline_print();
      }
    output: |
      **********
      *        *
      * (1, 3) *
      *        *
      **********

  - type: text
    title: The newtype pattern and the orphan rule
    md: |
      The **orphan rule** (chapter 10) says you may implement a trait for a type only if the trait or the type is local to your crate. So you cannot implement `Display` for `Vec<String>`: both are from the standard library.

      The workaround is a **newtype**: a tuple struct with one field, `struct Wrapper(Vec<String>);`. `Wrapper` is local, so you can implement anything on it. There is no run-time cost; the wrapper disappears at compile time. The downside is that `Wrapper` does not have `Vec`'s methods; implement `Deref` to get them all, or forward only the ones you want.

  - type: code
    lang: rust
    code: |
      use std::fmt;
      use std::ops::Deref;

      struct Wrapper(Vec<String>);

      impl fmt::Display for Wrapper {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "[{}]", self.0.join(", "))
          }
      }

      impl Deref for Wrapper {
          type Target = Vec<String>;
          fn deref(&self) -> &Vec<String> {
              &self.0
          }
      }

      fn main() {
          let w = Wrapper(vec![String::from("hello"), String::from("world")]);
          println!("w = {w}");
          println!("{} items, first is {}", w.len(), w[0]);
      }
    output: |
      w = [hello, world]
      2 items, first is hello

  - type: playground
    id: ch20-play-money
    title: "Money that cannot be mixed up"
    lang: rust
    md: |
      `Cents(i64)` is a newtype. Implement `Add` (cents + cents), `Mul<i64>` (cents * count), `Sum` so `iter().copied().sum::<Cents>()` works, and `Display` that prints `€12.34` (and `-€0.50` for negatives).
    task: "Print `€12.34`, `€7.50`, `-€0.50`."
    code: |
      use std::fmt;
      use std::iter::Sum;
      use std::ops::{Add, Mul};

      #[derive(Debug, Copy, Clone, PartialEq)]
      struct Cents(i64);

      // impl Add, Mul<i64>, Sum, Display

      fn main() {
          let price = Cents(617);
          // println!("{}", price * 2);
          // println!("{}", [Cents(250), Cents(500)].iter().copied().sum::<Cents>());
          // println!("{}", Cents(-50));
          println!("{price:?}");
      }
    expected_output: |
      €12.34
      €7.50
      -€0.50
    solution_code: |
      use std::fmt;
      use std::iter::Sum;
      use std::ops::{Add, Mul};

      #[derive(Debug, Copy, Clone, PartialEq)]
      struct Cents(i64);

      impl Add for Cents {
          type Output = Cents;
          fn add(self, other: Cents) -> Cents {
              Cents(self.0 + other.0)
          }
      }

      impl Mul<i64> for Cents {
          type Output = Cents;
          fn mul(self, k: i64) -> Cents {
              Cents(self.0 * k)
          }
      }

      impl Sum for Cents {
          fn sum<I: Iterator<Item = Cents>>(iter: I) -> Cents {
              iter.fold(Cents(0), |a, b| a + b)
          }
      }

      impl fmt::Display for Cents {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let sign = if self.0 < 0 { "-" } else { "" };
              let abs = self.0.abs();
              write!(f, "{sign}€{}.{:02}", abs / 100, abs % 100)
          }
      }

      fn main() {
          let price = Cents(617);
          println!("{}", price * 2);
          println!("{}", [Cents(250), Cents(500)].iter().copied().sum::<Cents>());
          println!("{}", Cents(-50));
      }
    hints:
      - "`impl Sum for Cents { fn sum<I: Iterator<Item = Cents>>(iter: I) -> Cents { iter.fold(Cents(0), |a, b| a + b) } }`"
      - "`{:02}` pads the cents to two digits."

  - type: exercise
    id: ch20-ex-traits
    exercise_dir: ch20-traits
    title: "A 2D vector type"
    difficulty: medium
    goal: "Overload arithmetic, compound assignment, negation and indexing, use a default type parameter, and disambiguate same-named trait methods."
    behavior: |
      `#[derive(Debug, Clone, Copy, PartialEq)] pub struct Vec2 { pub x: f64, pub y: f64 }` with:
      - `Add`, `Sub` (Vec2 with Vec2), `Mul<f64>` (scale), `Mul<Vec2>` with `Output = f64` (dot product), `Neg`, `AddAssign`;
      - `Index<usize>` and `IndexMut<usize>` (0 is x, 1 is y, anything else panics);
      - `pub fn length(self) -> f64`.
      Then two traits that both have a `name` method: `pub trait Shape { fn name(&self) -> String; }` and `pub trait Label { fn name(&self) -> String; }`. Implement `Shape` for `Vec2` returning `"vector"`, and `Label` returning `"(x, y)"` using `{}` formatting, e.g. `"(3, 4)"`. Write `pub fn both_names(v: &Vec2) -> (String, String)` returning `(shape name, label name)`.
    examples:
      - input: "Vec2 { x: 1.0, y: 2.0 } * Vec2 { x: 3.0, y: 4.0 }"
        output: "11.0"
      - input: "both_names(&Vec2 { x: 3.0, y: 4.0 })"
        output: "(\"vector\", \"(3, 4)\")"
    hints:
      - "Two impls of `Mul` with different `Rhs`: `impl Mul<f64> for Vec2` and `impl Mul<Vec2> for Vec2`."
      - "`IndexMut` requires `Index`: `fn index_mut(&mut self, i: usize) -> &mut f64`."
      - "Call the two methods as `Shape::name(v)` and `Label::name(v)`."
    rust:
      starter: |
        use std::ops::{Add, AddAssign, Index, IndexMut, Mul, Neg, Sub};

        #[derive(Debug, Clone, Copy, PartialEq)]
        pub struct Vec2 {
            pub x: f64,
            pub y: f64,
        }

        impl Vec2 {
            pub fn length(self) -> f64 {
                todo!()
            }
        }

        // TODO: Add, Sub, Mul<f64>, Mul<Vec2> (dot), Neg, AddAssign, Index, IndexMut

        pub trait Shape {
            fn name(&self) -> String;
        }

        pub trait Label {
            fn name(&self) -> String;
        }

        // TODO: impl Shape and Label for Vec2

        pub fn both_names(v: &Vec2) -> (String, String) {
            todo!()
        }
      tests: |
        use super::*;

        fn v(x: f64, y: f64) -> Vec2 {
            Vec2 { x, y }
        }

        #[test]
        fn arithmetic() {
            assert_eq!(v(1.0, 2.0) + v(3.0, 4.0), v(4.0, 6.0));
            assert_eq!(v(1.0, 2.0) - v(3.0, 5.0), v(-2.0, -3.0));
            assert_eq!(v(1.0, 2.0) * 3.0, v(3.0, 6.0));
            assert_eq!(v(1.0, 2.0) * v(3.0, 4.0), 11.0);
            assert_eq!(-v(1.0, -2.0), v(-1.0, 2.0));
            assert_eq!(v(3.0, 4.0).length(), 5.0);
        }

        #[test]
        fn assign_and_index() {
            let mut a = v(1.0, 1.0);
            a += v(2.0, 3.0);
            assert_eq!(a, v(3.0, 4.0));
            assert_eq!(a[0], 3.0);
            a[1] = 10.0;
            assert_eq!(a.y, 10.0);
        }

        #[test]
        #[should_panic]
        fn bad_index() {
            let a = v(0.0, 0.0);
            let _ = a[2];
        }

        #[test]
        fn names() {
            assert_eq!(both_names(&v(3.0, 4.0)), (String::from("vector"), String::from("(3, 4)")));
            assert_eq!(both_names(&v(0.5, -1.0)).1, "(0.5, -1)");
        }
      solution: |
        use std::ops::{Add, AddAssign, Index, IndexMut, Mul, Neg, Sub};

        #[derive(Debug, Clone, Copy, PartialEq)]
        pub struct Vec2 {
            pub x: f64,
            pub y: f64,
        }

        impl Vec2 {
            pub fn length(self) -> f64 {
                (self * self).sqrt()
            }
        }

        impl Add for Vec2 {
            type Output = Vec2;
            fn add(self, o: Vec2) -> Vec2 {
                Vec2 { x: self.x + o.x, y: self.y + o.y }
            }
        }

        impl Sub for Vec2 {
            type Output = Vec2;
            fn sub(self, o: Vec2) -> Vec2 {
                Vec2 { x: self.x - o.x, y: self.y - o.y }
            }
        }

        impl Mul<f64> for Vec2 {
            type Output = Vec2;
            fn mul(self, k: f64) -> Vec2 {
                Vec2 { x: self.x * k, y: self.y * k }
            }
        }

        impl Mul<Vec2> for Vec2 {
            type Output = f64;
            fn mul(self, o: Vec2) -> f64 {
                self.x * o.x + self.y * o.y
            }
        }

        impl Neg for Vec2 {
            type Output = Vec2;
            fn neg(self) -> Vec2 {
                Vec2 { x: -self.x, y: -self.y }
            }
        }

        impl AddAssign for Vec2 {
            fn add_assign(&mut self, o: Vec2) {
                self.x += o.x;
                self.y += o.y;
            }
        }

        impl Index<usize> for Vec2 {
            type Output = f64;
            fn index(&self, i: usize) -> &f64 {
                match i {
                    0 => &self.x,
                    1 => &self.y,
                    _ => panic!("index {i} out of range for Vec2"),
                }
            }
        }

        impl IndexMut<usize> for Vec2 {
            fn index_mut(&mut self, i: usize) -> &mut f64 {
                match i {
                    0 => &mut self.x,
                    1 => &mut self.y,
                    _ => panic!("index {i} out of range for Vec2"),
                }
            }
        }

        pub trait Shape {
            fn name(&self) -> String;
        }

        pub trait Label {
            fn name(&self) -> String;
        }

        impl Shape for Vec2 {
            fn name(&self) -> String {
                String::from("vector")
            }
        }

        impl Label for Vec2 {
            fn name(&self) -> String {
                format!("({}, {})", self.x, self.y)
            }
        }

        pub fn both_names(v: &Vec2) -> (String, String) {
            (Shape::name(v), Label::name(v))
        }
    solution_explain: "`Mul` is implemented twice with different `Rhs` type parameters, and each picks its own associated `Output`. A plain `v.name()` would be ambiguous because both traits are in scope; naming the trait settles it."

  - type: quiz
    id: ch20-quiz-traits
    title: Check yourself
    questions:
      - type: single
        q: "Why is `Iterator::Item` an associated type rather than a generic parameter?"
        options: ["Associated types are faster", "So each type implements Iterator once, and next() needs no annotations", "Generics cannot be used in traits", "For backwards compatibility"]
        answer: 1
        explanation: "One implementation per type."
      - type: single
        q: "What does `Rhs = Self` in `trait Add<Rhs = Self>` mean?"
        options: ["Rhs must be Self", "Rhs defaults to Self when an impl does not specify it", "Self is renamed Rhs", "Nothing"]
        answer: 1
        explanation: "A default type parameter."
      - type: single
        q: "How do you call `Animal`'s `baby_name` for `Dog` when Dog also has an inherent `baby_name`?"
        options: ["`Dog::baby_name()`", "`Animal::baby_name()`", "`<Dog as Animal>::baby_name()`", "`Dog.Animal::baby_name()`"]
        answer: 2
        explanation: "Fully qualified syntax."
      - type: single
        q: "Why use a newtype to implement Display for Vec<String>?"
        options: ["For speed", "The orphan rule forbids implementing a foreign trait on a foreign type", "Vec cannot be printed", "Display needs a struct"]
        answer: 1
        explanation: "The wrapper is local."
      - type: truefalse
        q: "Rust lets you define brand-new operators like `<=>`."
        answer: false
        explanation: "Only the operators in std::ops and std::cmp can be overloaded."

  - type: summary
    points:
      - "Associated types: one implementation per type; generics: many."
      - "Default type parameters (`Rhs = Self`) keep common impls short."
      - "std::ops traits overload operators, including `+=`, unary `-` and indexing."
      - "`<Type as Trait>::f()` disambiguates identically named functions."
      - "Supertraits require other traits; newtypes get around the orphan rule at no cost."
terms:
  - term: associated type
    def: "A type placeholder declared in a trait with type Name; and chosen by each implementation."
  - term: default type parameter
    def: "A generic parameter with a default, such as Rhs = Self."
  - term: operator overloading
    def: "Implementing std::ops traits so operators like + work on your types."
  - term: fully qualified syntax
    def: "<Type as Trait>::function(...), naming both the type and the trait."
  - term: orphan rule
    def: "You may implement a trait for a type only if the trait or the type is defined in your crate."
  - term: newtype
    def: "A tuple struct with one field that wraps another type to give it a new identity."
