title: "Binary data: hexdump, byte order and checksums"
summary: "What a file format is, Rust in Action's fview hexdump and its read_exact pitfall, byte string literals, writing and reading binary records with explicit endianness (what the byteorder crate does, with only std), Seek, serialization formats like serde and bincode, and detecting corruption with a CRC32 checksum."
minutes: 35
source:
  chapter: ch22
  sections: ["RiA 7.1 What is a file format?", "RiA 7.2 Creating your own file formats for data storage with serde", "RiA 7.2.1 Writing data to disk with serde and the bincode format", "RiA 7.3 Implementing a hexdump clone", "RiA 7.7.3 Writing multi-byte binary data to disk in a guaranteed byte order", "RiA 7.7.4 Validating I/O errors with checksums", "PR ch18 Binary Data, Compression, and Serialization", "PR ch18 Seeking"]
blocks:
  - type: text
    md: |
      A **file format** is an agreement about how a sequence of bytes is laid out: what comes first, how long each part is, which byte order numbers use. Text formats (JSON, TOML, CSV) are human-readable but larger and slower to parse; binary formats are compact and fast but need tools to inspect. The first such tool is a **hexdump**.

  - type: text
    title: A hexdump clone
    md: |
      *Rust in Action*'s `fview` prints the position, then 16 bytes per line in hexadecimal. It starts with input built into the program as a **byte string literal**: `b"..."` has type `&[u8; N]`, and `br#"..."#` is a raw byte string that may contain quotes. `&[u8]` implements `Read`, so the same code later reads files.

  - type: code
    lang: rust
    code: |
      use std::io::prelude::*;

      const BYTES_PER_LINE: usize = 16;
      const INPUT: &[u8] = br#"
      fn main() {
          println!("Hello, world!");
      }"#;

      fn main() -> std::io::Result<()> {
          let mut buffer: Vec<u8> = vec![];
          let mut input = INPUT;
          input.read_to_end(&mut buffer)?;

          let mut position_in_input = 0;
          for line in buffer.chunks(BYTES_PER_LINE) {
              print!("[0x{:08x}] ", position_in_input);
              for byte in line {
                  print!("{:02x} ", byte);
              }
              println!();
              position_in_input += BYTES_PER_LINE;
          }

          Ok(())
      }
    output: |
      [0x00000000] 0a 66 6e 20 6d 61 69 6e 28 29 20 7b 0a 20 20 20
      [0x00000010] 20 70 72 69 6e 74 6c 6e 21 28 22 48 65 6c 6c 6f
      [0x00000020] 2c 20 77 6f 72 6c 64 21 22 29 3b 0a 7d
    explain: "`0a` is a newline, `20` a space, `66 6e` is `fn`. All bytes are below `0x80`: this is ASCII text. `std::io::prelude::*` imports `Read`, `Write`, `BufRead` and `Seek` at once."

  - type: callout
    kind: warning
    title: "The read_exact pitfall"
    md: "The book's file version reads with `while let Ok(_) = f.read_exact(&mut buffer)`. `read_exact` fails with `UnexpectedEof` when fewer than 16 bytes remain, so the **last partial line is silently dropped**. Reading with `read`, which returns how many bytes it got, or with `chunks` over the whole file, avoids that. The exercise asks for a correct version."

  - type: text
    title: Writing numbers in a fixed byte order
    md: |
      To store a `u32` in a file, you must pick its byte order (lesson 21.1). *Rust in Action* uses the `byteorder` crate, whose `write_u32::<LittleEndian>` extends any `Write`. The standard library can do the same with `to_le_bytes` and `from_le_bytes` plus `write_all` and `read_exact`:

  - type: code
    lang: rust
    code: |
      use std::io::{self, Cursor, Read, Write};

      fn write_numbers<W: Write>(w: &mut W) -> io::Result<()> {
          w.write_all(&1_u32.to_le_bytes())?;
          w.write_all(&2_i8.to_le_bytes())?;
          w.write_all(&3.0_f64.to_le_bytes())?;
          Ok(())
      }

      fn read_numbers<R: Read>(r: &mut R) -> io::Result<(u32, i8, f64)> {
          let mut b4 = [0u8; 4];
          let mut b1 = [0u8; 1];
          let mut b8 = [0u8; 8];
          r.read_exact(&mut b4)?;
          r.read_exact(&mut b1)?;
          r.read_exact(&mut b8)?;
          Ok((u32::from_le_bytes(b4), i8::from_le_bytes(b1), f64::from_le_bytes(b8)))
      }

      fn main() -> io::Result<()> {
          let mut w = vec![];
          write_numbers(&mut w)?;
          println!("{:?}", w);

          let mut r = Cursor::new(w);
          println!("{:?}", read_numbers(&mut r)?);
          println!("past the end: {:?}", read_numbers(&mut r).unwrap_err().kind());
          Ok(())
      }
    output: |
      [1, 0, 0, 0, 2, 0, 0, 0, 0, 0, 0, 8, 64]
      (1, 2, 3.0)
      past the end: UnexpectedEof
    explain: "Thirteen bytes: 4 for the `u32`, 1 for the `i8`, 8 for the `f64` (3.0 is `0x4008000000000000`, stored least significant byte first)."

  - type: text
    title: Seek
    md: |
      Files and `Cursor` also implement **`Seek`**: `seek(SeekFrom::Start(n))`, `SeekFrom::End(-n)` or `SeekFrom::Current(n)` moves the position for the next read or write, and `stream_position()` reports it. Fixed-size records make this powerful: record *k* starts at byte *k × size*, so you can jump straight to it. Chapter 22.3 uses `Seek` to look up values in a database file.

  - type: code
    lang: rust
    code: |
      use std::io::{self, Cursor, Read, Seek, SeekFrom, Write};

      const RECORD: u64 = 8; // id: u32, score: u32

      fn main() -> io::Result<()> {
          let mut db = Cursor::new(Vec::new());
          for (id, score) in [(1u32, 50u32), (2, 75), (3, 99)] {
              db.write_all(&id.to_le_bytes())?;
              db.write_all(&score.to_le_bytes())?;
          }

          // read record 2 (the third) directly
          db.seek(SeekFrom::Start(2 * RECORD))?;
          let mut buf = [0u8; 8];
          db.read_exact(&mut buf)?;
          let id = u32::from_le_bytes(buf[0..4].try_into().unwrap());
          let score = u32::from_le_bytes(buf[4..8].try_into().unwrap());
          println!("record 2: id {id}, score {score}");

          // overwrite the score of record 0 in place
          db.seek(SeekFrom::Start(4))?;
          db.write_all(&60u32.to_le_bytes())?;
          println!("file is {} bytes, now at {}", db.get_ref().len(), db.stream_position()?);
          println!("{:?}", &db.get_ref()[..8]);
          Ok(())
      }
    output: |
      record 2: id 3, score 99
      file is 24 bytes, now at 8
      [1, 0, 0, 0, 60, 0, 0, 0]

  - type: callout
    kind: note
    title: "serde and bincode"
    md: "Hand-written encoders are fine for a few fields. For whole data structures, the Rust ecosystem uses **serde**: `#[derive(Serialize, Deserialize)]` on a struct, then a format crate such as `serde_json`, `toml` or `bincode` (compact binary) turns it into bytes and back. *Rust in Action* compares the sizes: the same city record is 115 bytes as JSON and 30 as bincode. serde is a crates.io dependency, so it does not run in this course's offline console."

  - type: text
    title: Checksums
    md: |
      Disks, networks and bugs corrupt data. A **checksum** is a small number computed from the data and stored next to it; on reading, recompute and compare. *Rust in Action*'s key-value store uses **CRC32**, a cyclic redundancy check that catches all single-bit errors and all bursts up to 32 bits long. It is cheap and is not cryptographic: it detects accidents, not tampering (use a hash like SHA-256 for that).

      The bitwise algorithm is short. For each byte, XOR it into the low bits of the running value, then 8 times shift right, XORing in the polynomial `0xEDB88320` whenever the bit shifted out was 1:

  - type: code
    lang: rust
    code: |
      fn crc32(data: &[u8]) -> u32 {
          let mut crc = !0u32;
          for &byte in data {
              crc ^= byte as u32;
              for _ in 0..8 {
                  let mask = (crc & 1).wrapping_neg(); // all ones if the low bit is set
                  crc = (crc >> 1) ^ (0xEDB8_8320 & mask);
              }
          }
          !crc
      }

      fn main() {
          println!("{:08x}", crc32(b"123456789"));
          let good = b"hello, world";
          let mut bad = *good;
          bad[3] ^= 0b0000_0100; // flip one bit
          println!("{:08x} {:08x}", crc32(good), crc32(&bad));
          println!("{}", String::from_utf8_lossy(&bad));
      }
    output: |
      cbf43926
      ffab723a a2472336
      helho, world
    explain: "`cbf43926` is the standard check value for CRC-32 of the text `123456789`, so you can test an implementation against it. One flipped bit changes the checksum completely."

  - type: playground
    id: ch22-play-record
    title: "A length-prefixed string format"
    lang: rust
    md: |
      Store strings as a 2-byte big-endian length followed by the UTF-8 bytes. Write `encode(&[&str]) -> Vec<u8>` and `decode(&[u8]) -> Vec<String>` (use a `Cursor` and `read_exact`, stopping cleanly at the end).
    task: "Print `[0, 2, 104, 105, 0, 5, 119, 111, 114, 108, 100]` and `[\"hi\", \"world\"]`."
    code: |
      use std::io::{Cursor, Read};

      fn encode(items: &[&str]) -> Vec<u8> {
          let mut out = Vec::new();
          // TODO
          out
      }

      fn decode(bytes: &[u8]) -> Vec<String> {
          let mut r = Cursor::new(bytes);
          let mut items = Vec::new();
          // TODO
          items
      }

      fn main() {
          let bytes = encode(&["hi", "world"]);
          println!("{bytes:?}");
          println!("{:?}", decode(&bytes));
      }
    expected_output: |
      [0, 2, 104, 105, 0, 5, 119, 111, 114, 108, 100]
      ["hi", "world"]
    solution_code: |
      use std::io::{Cursor, Read};

      fn encode(items: &[&str]) -> Vec<u8> {
          let mut out = Vec::new();
          for s in items {
              out.extend_from_slice(&(s.len() as u16).to_be_bytes());
              out.extend_from_slice(s.as_bytes());
          }
          out
      }

      fn decode(bytes: &[u8]) -> Vec<String> {
          let mut r = Cursor::new(bytes);
          let mut items = Vec::new();
          let mut len = [0u8; 2];
          while r.read_exact(&mut len).is_ok() {
              let mut buf = vec![0u8; u16::from_be_bytes(len) as usize];
              r.read_exact(&mut buf).expect("truncated string");
              items.push(String::from_utf8(buf).expect("not UTF-8"));
          }
          items
      }

      fn main() {
          let bytes = encode(&["hi", "world"]);
          println!("{bytes:?}");
          println!("{:?}", decode(&bytes));
      }
    hints:
      - "`(s.len() as u16).to_be_bytes()` gives the two length bytes."
      - "`while r.read_exact(&mut len).is_ok() { ... }` stops at the end of the data."

  - type: exercise
    id: ch22-ex-hexdump
    exercise_dir: ch22-hexdump
    title: "A hexdump and a checked record format"
    difficulty: medium
    goal: "Format binary data for humans, and design a binary record with a header, fixed byte order and a CRC32."
    behavior: |
      - `pub fn hexdump<R: Read>(mut input: R) -> io::Result<String>`: one line per 16 bytes, including a final partial line: `"[0x00000010] 41 42 43  |ABC|\n"`. After the offset and a space, each byte is two lowercase hex digits followed by a space; a partial line is padded with three spaces per missing byte; then one more space and the bytes as characters between `|`, printable ASCII (`0x20..=0x7e`) as itself and everything else as `.`. Empty input gives `""`.
      - `pub fn crc32(data: &[u8]) -> u32` (IEEE, as in the lesson).
      - `pub fn encode_record(key: &[u8], value: &[u8]) -> Vec<u8>`: 12-byte header of little-endian `u32`s `[checksum, key_len, val_len]`, then key, then value; the checksum covers key + value.
      - `pub fn decode_record<R: Read>(r: &mut R) -> io::Result<(Vec<u8>, Vec<u8>)>`: read one record; return an error of kind `InvalidData` if the checksum does not match, and pass through `UnexpectedEof` when the data ends early.
    examples:
      - input: "hexdump(&b\"Hi!\\n\"[..])"
        output: "\"[0x00000000] 48 69 21 0a                                      |Hi!.|\\n\""
      - input: "crc32(b\"123456789\")"
        output: "0xcbf43926"
    hints:
      - "Read everything with `read_to_end`, then iterate with `chunks(16).enumerate()`; the offset is `i * 16`."
      - "Padding: `\"   \".repeat(16 - chunk.len())`."
      - "`r.read_exact(&mut header)?` with `header: [u8; 12]`, then `u32::from_le_bytes(header[0..4].try_into().unwrap())`."
    rust:
      starter: |
        use std::io::{self, Read};

        pub fn hexdump<R: Read>(mut input: R) -> io::Result<String> {
            todo!()
        }

        pub fn crc32(data: &[u8]) -> u32 {
            todo!()
        }

        pub fn encode_record(key: &[u8], value: &[u8]) -> Vec<u8> {
            todo!()
        }

        pub fn decode_record<R: Read>(r: &mut R) -> io::Result<(Vec<u8>, Vec<u8>)> {
            todo!()
        }
      tests: |
        use super::*;
        use std::io::Cursor;

        #[test]
        fn short_dump() {
            let out = hexdump(&b"Hi!\n"[..]).unwrap();
            let expected = format!("[0x00000000] 48 69 21 0a {} |Hi!.|\n", "   ".repeat(12));
            assert_eq!(out, expected);
            assert_eq!(hexdump(&b""[..]).unwrap(), "");
        }

        #[test]
        fn full_and_partial_lines() {
            let data: Vec<u8> = (0u8..20).map(|i| i + 0x41).collect();
            let out = hexdump(Cursor::new(data)).unwrap();
            let lines: Vec<&str> = out.lines().collect();
            assert_eq!(lines.len(), 2, "the last partial line must not be dropped");
            assert_eq!(lines[0], "[0x00000000] 41 42 43 44 45 46 47 48 49 4a 4b 4c 4d 4e 4f 50  |ABCDEFGHIJKLMNOP|");
            assert!(lines[1].starts_with("[0x00000010] 51 52 53 54 "));
            assert!(lines[1].ends_with(" |QRST|"));
            assert_eq!(lines[0].len(), lines[1].len() + 12, "padding keeps the text column aligned");
        }

        #[test]
        fn non_printable() {
            let out = hexdump(&[0x00u8, 0x7f, 0xff, b'~', b' '][..]).unwrap();
            assert!(out.ends_with("|...~ |\n"), "{out}");
        }

        #[test]
        fn checksum() {
            assert_eq!(crc32(b"123456789"), 0xcbf4_3926);
            assert_eq!(crc32(b""), 0);
            assert_ne!(crc32(b"abc"), crc32(b"abd"));
        }

        #[test]
        fn records_roundtrip() {
            let rec = encode_record(b"name", b"Ferris");
            assert_eq!(rec.len(), 12 + 4 + 6);
            assert_eq!(&rec[4..8], &4u32.to_le_bytes());
            assert_eq!(&rec[8..12], &6u32.to_le_bytes());
            assert_eq!(&rec[0..4], &crc32(b"nameFerris").to_le_bytes());

            let mut stream = rec.clone();
            stream.extend(encode_record(b"", b"x"));
            let mut r = Cursor::new(stream);
            assert_eq!(decode_record(&mut r).unwrap(), (b"name".to_vec(), b"Ferris".to_vec()));
            assert_eq!(decode_record(&mut r).unwrap(), (vec![], b"x".to_vec()));
            assert_eq!(decode_record(&mut r).unwrap_err().kind(), io::ErrorKind::UnexpectedEof);
        }

        #[test]
        fn corruption_detected() {
            let mut rec = encode_record(b"k", b"value");
            let last = rec.len() - 1;
            rec[last] ^= 1;
            let err = decode_record(&mut Cursor::new(rec)).unwrap_err();
            assert_eq!(err.kind(), io::ErrorKind::InvalidData);
        }
      solution: |
        use std::io::{self, Read};

        pub fn hexdump<R: Read>(mut input: R) -> io::Result<String> {
            let mut data = Vec::new();
            input.read_to_end(&mut data)?;
            let mut out = String::new();
            for (i, chunk) in data.chunks(16).enumerate() {
                out.push_str(&format!("[0x{:08x}] ", i * 16));
                for b in chunk {
                    out.push_str(&format!("{b:02x} "));
                }
                out.push_str(&"   ".repeat(16 - chunk.len()));
                out.push_str(" |");
                for &b in chunk {
                    out.push(if (0x20..=0x7e).contains(&b) { b as char } else { '.' });
                }
                out.push_str("|\n");
            }
            Ok(out)
        }

        pub fn crc32(data: &[u8]) -> u32 {
            let mut crc = !0u32;
            for &byte in data {
                crc ^= byte as u32;
                for _ in 0..8 {
                    let mask = (crc & 1).wrapping_neg();
                    crc = (crc >> 1) ^ (0xEDB8_8320 & mask);
                }
            }
            !crc
        }

        pub fn encode_record(key: &[u8], value: &[u8]) -> Vec<u8> {
            let mut body = Vec::with_capacity(key.len() + value.len());
            body.extend_from_slice(key);
            body.extend_from_slice(value);
            let mut rec = Vec::with_capacity(12 + body.len());
            rec.extend_from_slice(&crc32(&body).to_le_bytes());
            rec.extend_from_slice(&(key.len() as u32).to_le_bytes());
            rec.extend_from_slice(&(value.len() as u32).to_le_bytes());
            rec.extend_from_slice(&body);
            rec
        }

        pub fn decode_record<R: Read>(r: &mut R) -> io::Result<(Vec<u8>, Vec<u8>)> {
            let mut header = [0u8; 12];
            r.read_exact(&mut header)?;
            let saved = u32::from_le_bytes(header[0..4].try_into().unwrap());
            let key_len = u32::from_le_bytes(header[4..8].try_into().unwrap()) as usize;
            let val_len = u32::from_le_bytes(header[8..12].try_into().unwrap()) as usize;
            let mut body = vec![0u8; key_len + val_len];
            r.read_exact(&mut body)?;
            if crc32(&body) != saved {
                return Err(io::Error::new(io::ErrorKind::InvalidData, "checksum mismatch"));
            }
            let value = body.split_off(key_len);
            Ok((body, value))
        }
    solution_explain: "This record layout is exactly Bitcask's, the format the next lesson's key-value store uses. `split_off` divides the body without copying the key. Returning `InvalidData` instead of panicking lets the caller decide whether a corrupt record is fatal."

  - type: quiz
    id: ch22-quiz-binary
    title: Check yourself
    questions:
      - type: single
        q: "What is the type of `b\"abc\"`?"
        options: ["&str", "String", "&[u8; 3]", "Vec<u8>"]
        answer: 2
        explanation: "A byte string literal."
      - type: single
        q: "Why does `while let Ok(_) = f.read_exact(&mut buf)` lose data?"
        options: ["It reads too fast", "read_exact fails when fewer bytes than the buffer remain, so the last partial chunk is skipped", "It is unsafe", "It does not"]
        answer: 1
        explanation: "Handle the remainder with read or chunks."
      - type: single
        q: "How many bytes does `1u32.to_le_bytes()` produce, and which is first?"
        options: ["4, the 1", "4, a zero", "1, the 1", "8, the 1"]
        answer: 0
        explanation: "Little-endian puts the least significant byte first."
      - type: single
        q: "What can a CRC32 checksum detect?"
        options: ["Deliberate tampering by an attacker", "Accidental corruption such as flipped bits", "Wrong passwords", "Missing files"]
        answer: 1
        explanation: "It is not cryptographic."
      - type: single
        q: "What does `seek(SeekFrom::Start(16))` do on a Cursor?"
        options: ["Reads 16 bytes", "Moves the position to byte 16 for the next read or write", "Truncates to 16 bytes", "Skips 16 records"]
        answer: 1
        explanation: "Seek moves, it does not read."

  - type: summary
    points:
      - "A file format is an agreement about byte layout; hexdumps make binary data readable."
      - "Byte string literals (`b\"...\"`) give `&[u8]`, which implements Read."
      - "Write numbers with to_le_bytes/to_be_bytes and read them with read_exact and from_*_bytes."
      - "Seek jumps to positions; fixed-size records can be addressed directly."
      - "Store a checksum such as CRC32 with each record and verify it when reading."
terms:
  - term: file format
    def: "An agreed layout for the bytes of a file."
  - term: hexdump
    def: "A display of bytes as hexadecimal numbers, usually with offsets and an ASCII column."
  - term: byte string literal
    def: "A literal like b\"abc\" whose type is a byte array rather than a str."
  - term: Seek
    def: "The trait for moving the read and write position within a stream."
  - term: checksum
    def: "A value computed from data and stored with it to detect corruption."
  - term: CRC32
    def: "A 32-bit cyclic redundancy check, a fast checksum for accidental errors."
  - term: serde
    def: "The Rust ecosystem's framework for serializing and deserializing data structures."
