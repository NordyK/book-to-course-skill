title: "Readers, writers, files and paths"
summary: "The Read, BufRead and Write traits and why code should accept them generically, Cursor and Vec<u8> as in-memory streams, File, OpenOptions and file modes, BufReader and BufWriter, std::fs convenience functions, Path and PathBuf, directories and metadata, and io::Error."
minutes: 40
source:
  chapter: ch22
  sections: ["PR ch18 Input and Output", "PR ch18 Readers and Writers", "PR ch18 Readers", "PR ch18 Buffered Readers", "PR ch18 Reading Lines", "PR ch18 Collecting Lines", "PR ch18 Writers", "PR ch18 Files", "PR ch18 Seeking", "PR ch18 Other Reader and Writer Types", "PR ch18 Files and Directories", "PR ch18 OsStr and Path", "PR ch18 Path and PathBuf Methods", "PR ch18 Filesystem Access Functions", "PR ch18 Reading Directories", "RiA 7.4 File operations in Rust", "RiA 7.4.1 Opening a file in Rust and controlling its file mode", "RiA 7.4.2 Interacting with the file system in a type-safe manner"]
blocks:
  - type: text
    md: |
      Rust's I/O is built on three traits in `std::io`:

      - **`Read`**: something you can pull bytes from: `read(&mut buf)`, `read_to_end`, `read_to_string`, `read_exact`.
      - **`BufRead`**: a reader with an internal buffer, which adds `read_line`, `lines()` and `split()`.
      - **`Write`**: something you can push bytes into: `write_all`, `flush`, and the `write!`/`writeln!` macros.

      Files, standard input and output, TCP sockets, byte slices and vectors all implement them. *Programming Rust* stresses the consequence: a function that takes `impl Read` or `impl Write` works with **all** of them, and can be tested in memory without touching the disk.

  - type: table
    title: Common readers and writers
    headers: ["Type", "Read", "BufRead", "Write"]
    rows:
      - ["`std::fs::File`", "yes", "wrap in `BufReader`", "yes (wrap in `BufWriter`)"]
      - ["`std::io::Stdin` / `StdinLock`", "yes", "the lock is", ""]
      - ["`std::io::Stdout`, `Stderr`", "", "", "yes"]
      - ["`&[u8]`", "yes", "yes", ""]
      - ["`Vec<u8>`", "", "", "yes (appends)"]
      - ["`std::io::Cursor<Vec<u8>>`", "yes", "yes", "yes, and `Seek`"]
      - ["`std::net::TcpStream`", "yes", "wrap in `BufReader`", "yes"]

  - type: code
    lang: rust
    code: |
      use std::io::{self, BufRead, Write};

      // works with files, stdin, sockets and in-memory data alike
      fn number_lines<R: BufRead, W: Write>(input: R, mut out: W) -> io::Result<usize> {
          let mut count = 0;
          for line in input.lines() {
              let line = line?;
              count += 1;
              writeln!(out, "{count:>3}: {line}")?;
          }
          Ok(count)
      }

      fn main() -> io::Result<()> {
          let text = "fn main() {\n    println!(\"hi\");\n}\n";
          let mut output: Vec<u8> = Vec::new();
          let n = number_lines(text.as_bytes(), &mut output)?;
          print!("{}", String::from_utf8_lossy(&output));
          println!("{n} lines");

          let stdout = io::stdout();
          let handle = stdout.lock();
          number_lines(io::Cursor::new("one\ntwo"), handle)?;
          Ok(())
      }
    output: |2
        1: fn main() {
        2:     println!("hi");
        3: }
      3 lines
        1: one
        2: two
    explain: "`&mut output` works because `&mut W` implements `Write` whenever `W` does, so the caller keeps the vector. `lines()` strips the newline and yields `io::Result<String>`, since reading can fail mid-way."

  - type: text
    title: Files and OpenOptions
    md: |
      `File::open(path)` opens for reading; `File::create(path)` creates or **truncates** for writing. For anything else, *Rust in Action* uses **`OpenOptions`**, a builder that sets the mode flag by flag: `read`, `write`, `append`, `create`, `create_new` (fail if it exists), `truncate`.

      Every system call is slow compared with memory. Reading a file byte by byte, or writing many small pieces, makes one call each. **`BufReader`** and **`BufWriter`** keep an 8 KB buffer in between. A `BufWriter` writes its remainder when dropped, but errors at that point are lost, so call `flush()` yourself when it matters.

  - type: code
    lang: rust
    code: |
      use std::fs::{self, File, OpenOptions};
      use std::io::{self, BufRead, BufReader, BufWriter, Write};

      fn main() -> io::Result<()> {
          let path = std::env::temp_dir().join(format!("rust-course-log-{}.txt", std::process::id()));

          {
              let mut w = BufWriter::new(File::create(&path)?);
              for i in 1..=3 {
                  writeln!(w, "entry {i}")?;
              }
              w.flush()?;
          }

          let mut f = OpenOptions::new().append(true).open(&path)?;
          writeln!(f, "entry 4 (appended)")?;

          let reader = BufReader::new(File::open(&path)?);
          for line in reader.lines() {
              println!("{}", line?);
          }

          println!("{} bytes", fs::metadata(&path)?.len());
          fs::remove_file(&path)?;
          println!("exists afterwards: {}", path.exists());
          Ok(())
      }
    output: |
      entry 1
      entry 2
      entry 3
      entry 4 (appended)
      43 bytes
      exists afterwards: false

  - type: table
    title: Handy std::fs functions
    headers: ["Function", "Does"]
    rows:
      - ["`fs::read_to_string(p)`, `fs::read(p)`", "read a whole file as `String` or `Vec<u8>`"]
      - ["`fs::write(p, data)`", "create or truncate, then write everything"]
      - ["`fs::create_dir_all(p)`", "create a directory and any missing parents"]
      - ["`fs::read_dir(p)`", "iterate the entries of a directory"]
      - ["`fs::metadata(p)`", "size, type, permissions, modification time"]
      - ["`fs::copy`, `fs::rename`, `fs::remove_file`, `fs::remove_dir_all`", "what they say"]
      - ["`fs::canonicalize(p)`", "absolute path with symlinks resolved"]

  - type: text
    title: Paths
    md: |
      File names are not always valid UTF-8 (Linux allows almost any bytes, Windows uses UTF-16), so Rust has its own string types for them: **`Path`** (borrowed, like `str`) and **`PathBuf`** (owned, like `String`), built on `OsStr`/`OsString`. *Rust in Action* calls this interacting with the file system "in a type-safe manner": `join` uses the right separator for the platform, and `file_name`, `extension`, `parent` and `components` take a path apart without string surgery. Converting to `&str` returns an `Option`, because it can fail.

  - type: code
    lang: rust
    code: |
      use std::path::{Path, PathBuf};

      fn main() {
          let mut p = PathBuf::from("/home/ferris");
          p.push("projects");
          p.push("game.tar.gz");

          println!("{}", p.display());
          println!("{:?}", p.file_name());
          println!("{:?}", p.extension());
          println!("{:?}", p.file_stem());
          println!("{:?}", p.parent());
          println!("{}", p.is_absolute());

          let parts: Vec<_> = p.components().map(|c| c.as_os_str().to_string_lossy().into_owned()).collect();
          println!("{parts:?}");

          let config = Path::new("settings").join("app.toml").with_extension("json");
          println!("{} {:?}", config.display(), config.to_str());
      }
    output: |
      /home/ferris/projects/game.tar.gz
      Some("game.tar.gz")
      Some("gz")
      Some("game.tar")
      Some("/home/ferris/projects")
      true
      ["/", "home", "ferris", "projects", "game.tar.gz"]
      settings/app.json Some("settings/app.json")
    explain: "Output from Linux; on Windows the separator is `\\`. `display()` is for printing only: it replaces bytes that are not valid UTF-8."

  - type: code
    lang: rust
    code: |
      use std::fs;
      use std::io;

      fn main() -> io::Result<()> {
          let root = std::env::temp_dir().join(format!("rust-course-dir-{}", std::process::id()));
          fs::create_dir_all(root.join("src/bin"))?;
          fs::write(root.join("Cargo.toml"), "[package]\n")?;
          fs::write(root.join("src/main.rs"), "fn main() {}\n")?;

          let mut names: Vec<String> = Vec::new();
          for entry in fs::read_dir(&root)? {
              let entry = entry?;
              let kind = if entry.file_type()?.is_dir() { "dir " } else { "file" };
              names.push(format!("{kind} {}", entry.file_name().to_string_lossy()));
          }
          names.sort(); // read_dir has no guaranteed order
          for n in &names {
              println!("{n}");
          }

          let text = fs::read_to_string(root.join("src/main.rs"))?;
          println!("main.rs: {}", text.trim());

          fs::remove_dir_all(&root)?;
          Ok(())
      }
    output: |
      dir  src
      file Cargo.toml
      main.rs: fn main() {}

  - type: text
    title: io::Error
    md: |
      Every I/O operation returns `io::Result<T>`, an alias for `Result<T, io::Error>`. An `io::Error` has a **`kind()`** you can match on: `NotFound`, `PermissionDenied`, `AlreadyExists`, `UnexpectedEof`, and so on. That lets you treat "the file does not exist yet" differently from "the disk is broken":

  - type: code
    lang: rust
    code: |
      use std::fs;
      use std::io::ErrorKind;

      fn load_or_default(path: &str) -> String {
          match fs::read_to_string(path) {
              Ok(text) => text,
              Err(e) if e.kind() == ErrorKind::NotFound => String::from("(defaults)"),
              Err(e) => panic!("cannot read {path}: {e}"),
          }
      }

      fn main() {
          println!("{}", load_or_default("/definitely/not/here.toml"));
          let e = fs::File::open("/definitely/not/here.toml").unwrap_err();
          println!("{:?}: {}", e.kind(), e);
      }
    output: |
      (defaults)
      NotFound: No such file or directory (os error 2)

  - type: playground
    id: ch22-play-wc
    title: "Word count over any reader"
    lang: rust
    md: |
      Write `wc<R: BufRead>(input: R) -> io::Result<(usize, usize, usize)>` returning lines, words and bytes, like the Unix `wc`. Count bytes from each line's length plus its newline: use `read_line` in a loop (it keeps the `\n` and returns 0 at the end) rather than `lines()`, which drops it.
    task: "Print `(3, 7, 34)` and `(0, 0, 0)`."
    code: |
      use std::io::{self, BufRead};

      fn wc<R: BufRead>(mut input: R) -> io::Result<(usize, usize, usize)> {
          let mut line = String::new();
          // loop with input.read_line(&mut line)?
          Ok((0, 0, 0))
      }

      fn main() -> io::Result<()> {
          let text = "the quick brown\nfox jumps\nover it\n";
          println!("{:?}", wc(text.as_bytes())?);
          println!("{:?}", wc(io::Cursor::new(""))?);
          Ok(())
      }
    expected_output: |
      (3, 7, 34)
      (0, 0, 0)
    solution_code: |
      use std::io::{self, BufRead};

      fn wc<R: BufRead>(mut input: R) -> io::Result<(usize, usize, usize)> {
          let (mut lines, mut words, mut bytes) = (0, 0, 0);
          let mut line = String::new();
          loop {
              line.clear();
              let n = input.read_line(&mut line)?;
              if n == 0 {
                  break;
              }
              bytes += n;
              if line.ends_with('\n') {
                  lines += 1;
              }
              words += line.split_whitespace().count();
          }
          Ok((lines, words, bytes))
      }

      fn main() -> io::Result<()> {
          let text = "the quick brown\nfox jumps\nover it\n";
          println!("{:?}", wc(text.as_bytes())?);
          println!("{:?}", wc(io::Cursor::new(""))?);
          Ok(())
      }
    hints:
      - "`read_line` appends, so `line.clear()` at the start of each round."
      - "`wc` counts newline characters as lines, which is why a last line without `\\n` is not counted."

  - type: exercise
    id: ch22-ex-io
    exercise_dir: ch22-io
    title: "Text tools over readers and writers"
    difficulty: medium
    goal: "Write I/O code once against Read, BufRead and Write so it runs on files and in memory, and handle io::Error kinds."
    behavior: |
      - `pub fn grep<R: BufRead, W: Write>(input: R, pattern: &str, out: W) -> io::Result<usize>`: write every line containing `pattern` as `"<line number>:<line>\n"` (numbers start at 1); return the number of matches.
      - `pub fn parse_config<R: BufRead>(input: R) -> io::Result<HashMap<String, String>>`: lines `key = value`; trim both sides; skip blank lines and lines starting with `#`; a line without `=` is an error of kind `InvalidData` whose message mentions the line number, e.g. `"line 3: expected key = value"`.
      - `pub fn save_lines(path: &Path, lines: &[&str]) -> io::Result<()>`: write the lines, each followed by `\n`, through a `BufWriter`, creating parent directories as needed.
      - `pub fn load_lines(path: &Path) -> io::Result<Vec<String>>`: read them back; a missing file gives an empty `Vec` (not an error).
      - `pub fn largest_file(dir: &Path) -> io::Result<Option<(String, u64)>>`: the name and size of the largest regular file directly inside `dir` (ignore subdirectories); `None` if there are none.
    examples:
      - input: "grep(\"a\\nbanana\\ncherry\".as_bytes(), \"an\", &mut out)"
        output: "Ok(1), out = \"2:banana\\n\""
    hints:
      - "`io::Error::new(io::ErrorKind::InvalidData, format!(\"line {n}: expected key = value\"))`."
      - "`if let Some(parent) = path.parent() { fs::create_dir_all(parent)?; }`."
      - "`Err(e) if e.kind() == io::ErrorKind::NotFound => Ok(Vec::new())`."
      - "`entry.metadata()?.is_file()` and `.len()`."
    rust:
      starter: |
