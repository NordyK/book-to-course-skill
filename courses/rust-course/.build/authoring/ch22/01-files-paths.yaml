        use std::fs;
        use std::io::{self, BufRead, BufWriter, Write};
        use std::path::Path;

        pub fn grep<R: BufRead, W: Write>(input: R, pattern: &str, mut out: W) -> io::Result<usize> {
            todo!()
        }

        pub fn parse_config<R: BufRead>(input: R) -> io::Result<HashMap<String, String>> {
            todo!()
        }

        pub fn save_lines(path: &Path, lines: &[&str]) -> io::Result<()> {
            todo!()
        }

        pub fn load_lines(path: &Path) -> io::Result<Vec<String>> {
            todo!()
        }

        pub fn largest_file(dir: &Path) -> io::Result<Option<(String, u64)>> {
            todo!()
        }
      tests: |
        use super::*;
        use std::io::Cursor;
        use std::path::PathBuf;

        fn scratch(name: &str) -> PathBuf {
            let p = std::env::temp_dir().join(format!("ch22-io-{}-{name}", std::process::id()));
            let _ = fs::remove_dir_all(&p);
            p
        }

        #[test]
        fn grepping() {
            let mut out = Vec::new();
            let n = grep("apple\nbanana\ncherry\nmango".as_bytes(), "an", &mut out).unwrap();
            assert_eq!(n, 2);
            assert_eq!(String::from_utf8(out).unwrap(), "2:banana\n4:mango\n");
            let mut none = Vec::new();
            assert_eq!(grep(Cursor::new(""), "x", &mut none).unwrap(), 0);
            assert!(none.is_empty());
        }

        #[test]
        fn config() {
            let text = "# settings\nname = ferris\n\n  port=8080  \nmotto = a = b\n";
            let cfg = parse_config(text.as_bytes()).unwrap();
            assert_eq!(cfg["name"], "ferris");
            assert_eq!(cfg["port"], "8080");
            assert_eq!(cfg["motto"], "a = b", "split at the first =");
            assert_eq!(cfg.len(), 3);
        }

        #[test]
        fn config_errors() {
            let err = parse_config("a = 1\n\njust words\n".as_bytes()).unwrap_err();
            assert_eq!(err.kind(), io::ErrorKind::InvalidData);
            assert!(err.to_string().contains("line 3"), "{err}");
        }

        #[test]
        fn files_roundtrip() {
            let dir = scratch("roundtrip");
            let path = dir.join("nested/deeper/notes.txt");
            save_lines(&path, &["first", "second", ""]).unwrap();
            assert_eq!(fs::read_to_string(&path).unwrap(), "first\nsecond\n\n");
            assert_eq!(load_lines(&path).unwrap(), ["first", "second", ""]);
            assert!(load_lines(&dir.join("missing.txt")).unwrap().is_empty());
            fs::remove_dir_all(&dir).unwrap();
        }

        #[test]
        fn biggest() {
            let dir = scratch("biggest");
            fs::create_dir_all(dir.join("sub")).unwrap();
            assert_eq!(largest_file(&dir).unwrap(), None);
            fs::write(dir.join("a.txt"), "12345").unwrap();
            fs::write(dir.join("b.txt"), "123456789").unwrap();
            fs::write(dir.join("sub/huge.txt"), "x".repeat(1000)).unwrap();
            assert_eq!(largest_file(&dir).unwrap(), Some((String::from("b.txt"), 9)));
            fs::remove_dir_all(&dir).unwrap();
        }
      solution: |
        use std::collections::HashMap;
        use std::fs;
        use std::io::{self, BufRead, BufWriter, Write};
        use std::path::Path;

        pub fn grep<R: BufRead, W: Write>(input: R, pattern: &str, mut out: W) -> io::Result<usize> {
            let mut matches = 0;
            for (i, line) in input.lines().enumerate() {
                let line = line?;
                if line.contains(pattern) {
                    matches += 1;
                    writeln!(out, "{}:{}", i + 1, line)?;
                }
            }
            Ok(matches)
        }

        pub fn parse_config<R: BufRead>(input: R) -> io::Result<HashMap<String, String>> {
            let mut map = HashMap::new();
            for (i, line) in input.lines().enumerate() {
                let line = line?;
                let line = line.trim();
                if line.is_empty() || line.starts_with('#') {
                    continue;
                }
                let Some((k, v)) = line.split_once('=') else {
                    return Err(io::Error::new(
                        io::ErrorKind::InvalidData,
                        format!("line {}: expected key = value", i + 1),
                    ));
                };
                map.insert(k.trim().to_string(), v.trim().to_string());
            }
            Ok(map)
        }

        pub fn save_lines(path: &Path, lines: &[&str]) -> io::Result<()> {
            if let Some(parent) = path.parent() {
                fs::create_dir_all(parent)?;
            }
            let mut w = BufWriter::new(fs::File::create(path)?);
            for line in lines {
                writeln!(w, "{line}")?;
            }
            w.flush()
        }

        pub fn load_lines(path: &Path) -> io::Result<Vec<String>> {
            match fs::File::open(path) {
                Ok(f) => io::BufReader::new(f).lines().collect(),
                Err(e) if e.kind() == io::ErrorKind::NotFound => Ok(Vec::new()),
                Err(e) => Err(e),
            }
        }

        pub fn largest_file(dir: &Path) -> io::Result<Option<(String, u64)>> {
            let mut best: Option<(String, u64)> = None;
            for entry in fs::read_dir(dir)? {
                let entry = entry?;
                let meta = entry.metadata()?;
                if !meta.is_file() {
                    continue;
                }
                let size = meta.len();
                if best.as_ref().map_or(true, |(_, b)| size > *b) {
                    best = Some((entry.file_name().to_string_lossy().into_owned(), size));
                }
            }
            Ok(best)
        }
    solution_explain: "`grep` and `parse_config` never mention files, so the tests feed them byte slices and capture output in a `Vec<u8>`. `lines().collect()` into `io::Result<Vec<String>>` stops at the first error, as in chapter 13. Matching on `e.kind()` separates the expected missing file from real failures."

  - type: quiz
    id: ch22-quiz-io
    title: Check yourself
    questions:
      - type: single
        q: "Why write `fn f<R: Read>(r: R)` instead of `fn f(file: File)`?"
        options: ["It is faster", "It works with files, stdin, sockets and in-memory bytes, and is easy to test", "File cannot be passed by value", "Style only"]
        answer: 1
        explanation: "Generic over the trait."
      - type: single
        q: "Which adds `lines()` and `read_line`?"
        options: ["Read", "Write", "BufRead", "Seek"]
        answer: 2
        explanation: "Wrap a File in BufReader to get it."
      - type: single
        q: "What does `File::create` do to an existing file?"
        options: ["Appends", "Truncates it to zero length", "Fails", "Renames it"]
        answer: 1
        explanation: "Use OpenOptions with append(true) to append."
      - type: single
        q: "Why does `path.to_str()` return an Option?"
        options: ["Paths may be empty", "File names need not be valid UTF-8", "It allocates", "For speed"]
        answer: 1
        explanation: "Paths are OsStr underneath."
      - type: single
        q: "How do you tell a missing file from other errors?"
        options: ["Parse the message", "Match `e.kind()` against `ErrorKind::NotFound`", "Check the path first", "You cannot"]
        answer: 1
        explanation: "Checking first races with other processes anyway."

  - type: summary
    points:
      - "Read, BufRead and Write unify files, standard streams, sockets and memory."
      - "Write functions generic over the traits and test them with byte slices and Vec<u8>."
      - "OpenOptions controls the file mode; BufReader and BufWriter cut system calls; flush explicitly."
      - "Path and PathBuf handle file names portably; std::fs covers whole-file and directory operations."
      - "io::Error::kind() lets you handle expected failures like NotFound."
terms:
  - term: Read
    def: "The trait for byte sources, with read, read_exact, read_to_end and read_to_string."
  - term: BufRead
    def: "A buffered reader trait adding read_line and lines."
  - term: Write
    def: "The trait for byte sinks, with write_all and flush."
  - term: OpenOptions
    def: "A builder for opening files with a chosen combination of read, write, append, create and truncate."
  - term: PathBuf
    def: "An owned, growable file system path; Path is its borrowed form."
  - term: Cursor
    def: "An in-memory buffer that implements Read, Write and Seek."
