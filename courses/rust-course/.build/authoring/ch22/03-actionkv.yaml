      tests: |
        use super::*;
        use std::io::Cursor;

        fn mem() -> ActionKV<Cursor<Vec<u8>>> {
            ActionKV::open(Cursor::new(Vec::new())).unwrap()
        }

        fn reopen(kv: ActionKV<Cursor<Vec<u8>>>) -> ActionKV<Cursor<Vec<u8>>> {
            let bytes = kv.into_inner().into_inner();
            ActionKV::open(Cursor::new(bytes)).unwrap()
        }

        #[test]
        fn basic_operations() {
            let mut kv = mem();
            assert_eq!(kv.get(b"a").unwrap(), None);
            kv.insert(b"a", b"1").unwrap();
            kv.insert(b"b", b"2").unwrap();
            kv.update(b"a", b"3").unwrap();
            assert_eq!(kv.get(b"a").unwrap(), Some(b"3".to_vec()));
            assert_eq!(kv.get(b"b").unwrap(), Some(b"2".to_vec()));
            kv.delete(b"b").unwrap();
            assert_eq!(kv.get(b"b").unwrap(), None);
            assert_eq!(kv.len(), 1);
        }

        #[test]
        fn record_layout() {
            let mut kv = mem();
            kv.insert(b"key", b"value").unwrap();
            let bytes = kv.into_inner().into_inner();
            assert_eq!(bytes.len(), 12 + 3 + 5);
            assert_eq!(&bytes[0..4], &crc32(b"keyvalue").to_le_bytes());
            assert_eq!(&bytes[4..8], &3u32.to_le_bytes());
            assert_eq!(&bytes[8..12], &5u32.to_le_bytes());
            assert_eq!(&bytes[12..], b"keyvalue");
        }

        #[test]
        fn survives_reopen() {
            let mut kv = mem();
            kv.insert(b"Fiji", b"Suva").unwrap();
            kv.insert(b"Kiribati", b"South Tarawa").unwrap();
            kv.update(b"Kiribati", b"Tarawa").unwrap();
            kv.insert(b"Cook Islands", b"Avarua").unwrap();
            kv.delete(b"Cook Islands").unwrap();
            let mut kv = reopen(kv);
            assert_eq!(kv.get(b"Fiji").unwrap(), Some(b"Suva".to_vec()));
            assert_eq!(kv.get(b"Kiribati").unwrap(), Some(b"Tarawa".to_vec()));
            assert_eq!(kv.get(b"Cook Islands").unwrap(), None);
            assert_eq!(kv.len(), 2);
            kv.insert(b"Tonga", b"Nuku'alofa").unwrap();
            assert_eq!(kv.get(b"Tonga").unwrap(), Some(b"Nuku'alofa".to_vec()));
        }

        #[test]
        fn delete_missing_writes_nothing() {
            let mut kv = mem();
            kv.delete(b"ghost").unwrap();
            assert!(kv.into_inner().into_inner().is_empty());
        }

        #[test]
        fn torn_write_is_ignored() {
            let mut kv = mem();
            kv.insert(b"a", b"1").unwrap();
            kv.insert(b"b", b"2").unwrap();
            let mut bytes = kv.into_inner().into_inner();
            bytes.truncate(bytes.len() - 1); // crash in the middle of the last record
            let mut kv = ActionKV::open(Cursor::new(bytes)).unwrap();
            assert_eq!(kv.get(b"a").unwrap(), Some(b"1".to_vec()));
            assert_eq!(kv.get(b"b").unwrap(), None);
        }

        #[test]
        fn corruption_is_an_error() {
            let mut kv = mem();
            kv.insert(b"a", b"hello").unwrap();
            let mut bytes = kv.into_inner().into_inner();
            let last = bytes.len() - 1;
            bytes[last] ^= 0xff;
            let err = ActionKV::open(Cursor::new(bytes)).err().expect("must fail");
            assert_eq!(err.kind(), io::ErrorKind::InvalidData);
        }

        #[test]
        fn compaction() {
            let mut kv = mem();
            for i in 0..10u8 {
                kv.insert(b"counter", &[b'0' + i]).unwrap();
            }
            kv.insert(b"z", b"last").unwrap();
            kv.insert(b"gone", b"x").unwrap();
            kv.delete(b"gone").unwrap();
            let before = kv.into_inner().into_inner();
            let mut kv = ActionKV::open(Cursor::new(before.clone())).unwrap();

            let mut small = kv.compact(Cursor::new(Vec::new())).unwrap();
            assert_eq!(small.get(b"counter").unwrap(), Some(b"9".to_vec()));
            assert_eq!(small.get(b"z").unwrap(), Some(b"last".to_vec()));
            assert_eq!(small.get(b"gone").unwrap(), None);
            assert_eq!(small.len(), 2);
            let after = small.into_inner().into_inner();
            assert_eq!(after.len(), (12 + 7 + 1) + (12 + 1 + 4));
            assert!(after.len() < before.len());
            assert_eq!(&after[12..19], b"counter", "sorted key order");
        }
      solution: |
        use std::collections::HashMap;
        use std::io::{self, Read, Seek, SeekFrom, Write};

        pub fn crc32(data: &[u8]) -> u32 {
            let mut crc = !0u32;
            for &byte in data {
                crc ^= byte as u32;
                for _ in 0..8 {
                    crc = (crc >> 1) ^ (0xEDB8_8320 & (crc & 1).wrapping_neg());
                }
            }
            !crc
        }

        pub struct ActionKV<F: Read + Write + Seek> {
            f: F,
            pub index: HashMap<Vec<u8>, u64>,
        }

        enum Next {
            Record(Vec<u8>, Vec<u8>),
            End,
        }

        fn read_record<R: Read>(f: &mut R) -> io::Result<Next> {
            let mut header = [0u8; 12];
            match f.read_exact(&mut header) {
                Ok(()) => {}
                Err(e) if e.kind() == io::ErrorKind::UnexpectedEof => return Ok(Next::End),
                Err(e) => return Err(e),
            }
            let saved = u32::from_le_bytes(header[0..4].try_into().unwrap());
            let key_len = u32::from_le_bytes(header[4..8].try_into().unwrap()) as usize;
            let val_len = u32::from_le_bytes(header[8..12].try_into().unwrap()) as usize;
            let mut body = vec![0u8; key_len + val_len];
            match f.read_exact(&mut body) {
                Ok(()) => {}
                Err(e) if e.kind() == io::ErrorKind::UnexpectedEof => return Ok(Next::End),
                Err(e) => return Err(e),
            }
            if crc32(&body) != saved {
                return Err(io::Error::new(io::ErrorKind::InvalidData, "checksum mismatch"));
            }
            let value = body.split_off(key_len);
            Ok(Next::Record(body, value))
        }

        impl<F: Read + Write + Seek> ActionKV<F> {
            pub fn open(mut f: F) -> io::Result<Self> {
                let mut index = HashMap::new();
                f.seek(SeekFrom::Start(0))?;
                loop {
                    let pos = f.stream_position()?;
                    match read_record(&mut f)? {
                        Next::Record(key, value) => {
                            if value.is_empty() {
                                index.remove(&key);
                            } else {
                                index.insert(key, pos);
                            }
                        }
                        Next::End => break,
                    }
                }
                Ok(ActionKV { f, index })
            }

            pub fn get(&mut self, key: &[u8]) -> io::Result<Option<Vec<u8>>> {
                let Some(&pos) = self.index.get(key) else {
                    return Ok(None);
                };
                self.f.seek(SeekFrom::Start(pos))?;
                match read_record(&mut self.f)? {
                    Next::Record(_, v) => Ok(Some(v)),
                    Next::End => Err(io::Error::new(io::ErrorKind::UnexpectedEof, "record vanished")),
                }
            }

            pub fn insert(&mut self, key: &[u8], value: &[u8]) -> io::Result<()> {
                let pos = self.f.seek(SeekFrom::End(0))?;
                let mut body = Vec::with_capacity(key.len() + value.len());
                body.extend_from_slice(key);
                body.extend_from_slice(value);
                let mut rec = Vec::with_capacity(12 + body.len());
                rec.extend_from_slice(&crc32(&body).to_le_bytes());
                rec.extend_from_slice(&(key.len() as u32).to_le_bytes());
                rec.extend_from_slice(&(value.len() as u32).to_le_bytes());
                rec.extend_from_slice(&body);
                self.f.write_all(&rec)?;
                self.f.flush()?;
                self.index.insert(key.to_vec(), pos);
                Ok(())
            }

            pub fn update(&mut self, key: &[u8], value: &[u8]) -> io::Result<()> {
                self.insert(key, value)
            }

            pub fn delete(&mut self, key: &[u8]) -> io::Result<()> {
                if !self.index.contains_key(key) {
                    return Ok(());
                }
                self.insert(key, b"")?;
                self.index.remove(key);
                Ok(())
            }

            pub fn len(&self) -> usize {
                self.index.len()
            }

            pub fn compact<G: Read + Write + Seek>(&mut self, into: G) -> io::Result<ActionKV<G>> {
                let mut keys: Vec<Vec<u8>> = self.index.keys().cloned().collect();
                keys.sort();
                let mut out = ActionKV::open(into)?;
                for key in keys {
                    if let Some(v) = self.get(&key)? {
                        out.insert(&key, &v)?;
                    }
                }
                Ok(out)
            }

            pub fn into_inner(self) -> F {
                self.f
            }
        }
    solution_explain: "The store never assumes a file: `Cursor<Vec<u8>>` in the tests, `File` in a real program. Treating `UnexpectedEof` while reading as the end of the log is what makes a torn last write harmless; a checksum mismatch in a complete record is real corruption and is reported."

  - type: quiz
    id: ch22-quiz-kv
    title: Check yourself
    questions:
      - type: single
        q: "How does actionkv update a value?"
        options: ["Overwrites the old record in place", "Appends a new record and points the index at it", "Deletes the file and rewrites it", "Edits the index only"]
        answer: 1
        explanation: "Append-only."
      - type: single
        q: "How is a delete stored?"
        options: ["The record is removed from the file", "A tombstone: a record with an empty value", "The key is renamed", "It is not stored"]
        answer: 1
        explanation: "So a reload knows the key is gone."
      - type: single
        q: "Why does an append-only log survive crashes well?"
        options: ["It uses no disk", "Existing data is never overwritten, so only the last record can be damaged, and its checksum shows it", "It writes twice", "It does not"]
        answer: 1
        explanation: "Torn writes affect only the tail."
      - type: single
        q: "What does the in-memory index store?"
        options: ["The values", "For each key, the byte position of its latest record", "Checksums", "File names"]
        answer: 1
        explanation: "get seeks there."
      - type: single
        q: "When should the index be a BTreeMap rather than a HashMap?"
        options: ["Always", "When you need keys in order or range queries", "When keys are strings", "Never"]
        answer: 1
        explanation: "Otherwise HashMap is faster."

  - type: summary
    points:
      - "A key-value store maps byte keys to byte values with get, insert, update and delete."
      - "actionkv appends Bitcask records (checksum, lengths, key, value) and keeps an index of positions in memory."
      - "Updates append; deletes append tombstones; loading replays the log so the latest record wins."
      - "Append-only logs are crash-friendly and fast to write but grow until compacted."
      - "Writing against Read + Write + Seek lets the same store run on files and in memory."
terms:
  - term: key-value store
    def: "A database that stores values under keys and retrieves them by exact key."
  - term: append-only log
    def: "A file that is only ever written at its end; old records are never modified."
  - term: index
    def: "A data structure that maps keys to the positions of their records."
  - term: tombstone
    def: "A record that marks a key as deleted."
  - term: compaction
    def: "Rewriting a log to keep only the latest live record for each key."
  - term: Bitcask
    def: "The log-structured storage format from the Riak database that actionkv implements."
