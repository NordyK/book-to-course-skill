title: "actionkv: a log-structured key-value store"
summary: "Rust in Action's actionkv: the key-value model, the Bitcask record format, an append-only log with an in-memory index, loading by scanning, insert, get with seek, update and delete with tombstones, why append-only survives crashes, compaction, and choosing between HashMap and BTreeMap for the index."
minutes: 45
source:
  chapter: ch22
  sections: ["RiA 7.5 Implementing a key-value store with a log-structured, append-only storage architecture", "RiA 7.5.1 The key-value model", "RiA 7.5.2 Introducing actionkv v0.1", "RiA 7.6 actionkv v0.1 front-end code", "RiA 7.7 Understanding the core of actionkv: the libactionkv crate", "RiA 7.7.1 Initializing the ActionKV struct", "RiA 7.7.2 Processing an individual record", "RiA 7.7.5 Inserting a new key-value pair into an existing database", "RiA 7.7.6 libactionkv full code listing", "RiA 7.7.7 Working with keys and values with HashMap and BTreeMap", "RiA 7.7.10 How to decide between HashMap and BTreeMap"]
blocks:
  - type: text
    md: |
      Time for something larger. *Rust in Action* builds **actionkv**, a small database. It is a **key-value store**: it stores values (arbitrary bytes) under keys (also bytes) and supports four operations: `get`, `insert`, `update` and `delete`. You can ask "what is the capital of Fiji?" but not "list every capital in the Pacific"; that trade-off makes key-value stores simple and fast.

      actionkv uses the **log-structured, append-only** design of **Bitcask**, the storage engine of the Riak database:

      - the data file is a **log**: records are only ever **appended**, never changed in place;
      - an **index** in memory maps each key to the byte position of its latest record;
      - an update is a new record for the same key; the index moves to it;
      - a delete is a **tombstone**: a record with an empty value.

