      tests: |
        use super::*;

        fn num(n: i64) -> Expr {
            Expr::Num(n)
        }
        fn var(s: &str) -> Expr {
            Expr::Var(s.to_string())
        }
        fn add(a: Expr, b: Expr) -> Expr {
            Expr::Add(Box::new(a), Box::new(b))
        }
        fn mul(a: Expr, b: Expr) -> Expr {
            Expr::Mul(Box::new(a), Box::new(b))
        }
        fn neg(a: Expr) -> Expr {
            Expr::Neg(Box::new(a))
        }

        #[test]
        fn constants_fold() {
            assert_eq!(simplify(add(num(2), num(3))), num(5));
            assert_eq!(simplify(mul(add(num(1), num(2)), num(4))), num(12));
            assert_eq!(simplify(neg(num(5))), num(-5));
        }

        #[test]
        fn identities() {
            assert_eq!(simplify(add(var("x"), num(0))), var("x"));
            assert_eq!(simplify(add(num(0), var("x"))), var("x"));
            assert_eq!(simplify(mul(var("x"), num(1))), var("x"));
            assert_eq!(simplify(mul(num(1), var("x"))), var("x"));
            assert_eq!(simplify(mul(var("x"), num(0))), num(0));
            assert_eq!(simplify(mul(num(0), add(var("x"), var("y")))), num(0));
        }

        #[test]
        fn nested() {
            assert_eq!(simplify(add(mul(var("x"), num(1)), mul(num(2), num(3)))), add(var("x"), num(6)));
            assert_eq!(simplify(neg(neg(add(var("y"), num(0))))), var("y"));
            assert_eq!(simplify(add(var("x"), mul(num(0), var("z")))), var("x"));
            assert_eq!(simplify(mul(var("x"), var("y"))), mul(var("x"), var("y")));
        }

        #[test]
        fn evaluation() {
            let e = add(mul(var("x"), var("x")), num(1));
            assert_eq!(eval(&e, 4), 17);
            assert_eq!(eval(&neg(e.clone()), 2), -5);
            assert_eq!(eval(&simplify(e.clone()), 3), eval(&e, 3));
        }
      solution: |
        #[derive(Debug, Clone, PartialEq)]
        pub enum Expr {
            Num(i64),
            Var(String),
            Add(Box<Expr>, Box<Expr>),
            Mul(Box<Expr>, Box<Expr>),
            Neg(Box<Expr>),
        }

        pub fn simplify(e: Expr) -> Expr {
            match e {
                Expr::Add(a, b) => {
                    let (a, b) = (simplify(*a), simplify(*b));
                    match (&a, &b) {
                        (Expr::Num(x), Expr::Num(y)) => Expr::Num(x + y),
                        (_, Expr::Num(0)) => a,
                        (Expr::Num(0), _) => b,
                        _ => Expr::Add(Box::new(a), Box::new(b)),
                    }
                }
                Expr::Mul(a, b) => {
                    let (a, b) = (simplify(*a), simplify(*b));
                    match (&a, &b) {
                        (Expr::Num(x), Expr::Num(y)) => Expr::Num(x * y),
                        (_, Expr::Num(0)) | (Expr::Num(0), _) => Expr::Num(0),
                        (_, Expr::Num(1)) => a,
                        (Expr::Num(1), _) => b,
                        _ => Expr::Mul(Box::new(a), Box::new(b)),
                    }
                }
                Expr::Neg(inner) => match simplify(*inner) {
                    Expr::Num(n) => Expr::Num(-n),
                    Expr::Neg(x) => *x,
                    other => Expr::Neg(Box::new(other)),
                },
                leaf => leaf,
            }
        }

        pub fn eval(e: &Expr, x: i64) -> i64 {
            match e {
                Expr::Num(n) => *n,
                Expr::Var(_) => x,
                Expr::Add(a, b) => eval(a, x) + eval(b, x),
                Expr::Mul(a, b) => eval(a, x) * eval(b, x),
                Expr::Neg(a) => -eval(a, x),
            }
        }
    solution_explain: "Simplifying the children first means every rule only has to look one level deep. Matching on `(&a, &b)` tests the shapes without moving `a` and `b`, so an arm can still return one of them whole. `(_, Expr::Num(0)) | (Expr::Num(0), _)` uses `|` across tuple patterns. `leaf => leaf` passes `Num` and `Var` through unchanged."

  - type: quiz
    id: ch19-quiz-syntax
    title: Check yourself
    questions:
      - type: single
        q: "In `match x { Some(y) => ... }` with an outer variable `y = 10`, what does the inner `y` do?"
        options: ["Compares with 10", "Binds a new variable that shadows the outer y", "Compile error", "Copies the outer y"]
        answer: 1
        explanation: "Use a guard to compare."
      - type: single
        q: "What does `4 | 5 | 6 if y` mean?"
        options: ["`4 | 5 | (6 if y)`", "`(4 | 5 | 6) if y`", "Syntax error", "`4 if y | 5 if y | 6 if y` only for 6"]
        answer: 1
        explanation: "The guard applies to the whole alternative list."
      - type: single
        q: "What is the difference between `_` and `_x`?"
        options: ["None", "`_x` binds (and can move) the value; `_` does not bind", "`_` moves, `_x` does not", "`_x` is a syntax error"]
        answer: 1
        explanation: "That matters for owned values like String."
      - type: single
        q: "Which pattern binds the tail of a slice?"
        options: ["`[x, ..]`", "`[x, tail @ ..]`", "`[x, *tail]`", "`[x, tail...]`"]
        answer: 1
        explanation: "@ binds what .. matched."
      - type: fill
        q: "Fill in the binding operator: `Message::Hello { id: id __ 3..=7 }`"
        answer: ["@"]
        explanation: "id @ 3..=7 tests the range and binds the value."
      - type: single
        q: "`match &opt { Some(name) => ... }` where `opt: Option<String>`. What is the type of name?"
        options: ["String", "&String", "Option<String>", "&str"]
        answer: 1
        explanation: "Default binding modes bind by reference."

  - type: summary
    points:
      - "Literals, `|` and ranges (`..=`, `a..`) test values; plain names bind and shadow."
      - "Struct, enum, tuple, array and slice patterns mirror the data and nest freely."
      - "`_` ignores without binding, `_x` binds silently, `..` skips the rest (once per tuple)."
      - "Guards add conditions to an arm; `@` tests and binds together."
      - "Matching a reference binds by reference automatically; `&` patterns and `ref` give explicit control."
terms:
  - term: match guard
    def: "An if condition after a pattern in a match arm that must also be true for the arm to run."
  - term: "@ binding"
    def: "Syntax name @ pattern that tests a value against a pattern and binds it to a name."
  - term: slice pattern
    def: "A pattern like [first, .., last] that matches slices of varying length."
  - term: default binding mode
    def: "The rule that matching a reference against a non-reference pattern binds variables by reference."
  - term: ref
    def: "A pattern keyword that binds by reference instead of moving the value."
