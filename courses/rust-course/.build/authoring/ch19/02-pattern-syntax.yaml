title: "Pattern syntax"
summary: "Literals, named variables and shadowing, | and ranges, destructuring structs, enums, nested values, tuples, arrays and slices, ignoring with _, _x and .., match guards, @ bindings, and how patterns work with references: & patterns, ref, and default binding modes."
minutes: 45
source:
  chapter: ch19
  sections: ["TRPL 19.3 Pattern Syntax", "TRPL 19.3 Matching Literals", "TRPL 19.3 Matching Named Variables", "TRPL 19.3 Matching Multiple Patterns", "TRPL 19.3 Matching Ranges of Values with ..=", "TRPL 19.3 Destructuring to Break Apart Values", "TRPL 19.3 Ignoring Values in a Pattern", "TRPL 19.3 Adding Conditionals with Match Guards", "TRPL 19.3 Using @ Bindings", "PR ch10 Literals, Variables, and Wildcards in Patterns", "PR ch10 Tuple and Struct Patterns", "PR ch10 Array and Slice Patterns", "PR ch10 Reference Patterns", "PR ch10 Match Guards", "PR ch10 Matching Multiple Possibilities", "PR ch10 Binding with @ Patterns", "PR ch10 Populating a Binary Tree"]
blocks:
  - type: text
    md: |
      This lesson is a catalogue. Each section shows one piece of pattern syntax with a runnable example. Keep it open as a reference: the table at the end summarizes all of it.

  - type: text
    title: Literals, | and ranges
    md: |
      A literal matches exactly that value. `|` means **or**. `..=` matches an **inclusive range**; ranges work on integers and `char`, and the compiler checks that the range is not empty. A half-open range `a..b` is allowed in patterns too, as is an open-ended `90..`.

  - type: code
    lang: rust
    code: |
      fn grade(score: u32) -> char {
          match score {
              90.. => 'A',
              80..=89 => 'B',
              70..=79 => 'C',
              60..=69 => 'D',
              _ => 'F',
          }
      }

      fn kind(c: char) -> &'static str {
          match c {
              'a' | 'e' | 'i' | 'o' | 'u' => "vowel",
              'a'..='z' => "consonant",
              '0'..='9' => "digit",
              _ => "other",
          }
      }

      fn main() {
          println!("{} {} {}", grade(95), grade(81), grade(12));
          println!("{} {} {} {}", kind('e'), kind('x'), kind('7'), kind('!'));
      }
    output: |
      A B F
      vowel consonant digit other
    explain: "Arms are tried top to bottom, so `'e'` matches the vowel arm before the consonant range."

  - type: text
    title: Named variables and shadowing
    md: |
      A plain name in a pattern is a **new variable** that matches anything. It does not compare against an existing variable with the same name: it shadows it inside the arm. This surprises many beginners:

  - type: code
    lang: rust
    code: |
      fn main() {
          let x = Some(5);
          let y = 10;

          match x {
              Some(50) => println!("Got 50"),
              Some(y) => println!("Matched, y = {y}"),
              _ => println!("Default case, x = {x:?}"),
          }

          println!("at the end: x = {x:?}, y = {y}");
      }
    output: |
      Matched, y = 5
      at the end: x = Some(5), y = 10
    explain: "The `y` in `Some(y)` is a fresh binding of the inner value. To compare against the outer `y`, use a match guard: `Some(n) if n == y`."

  - type: text
    title: Destructuring structs
    md: |
      A struct pattern lists fields: `Point { x: a, y: b }` binds `a` and `b`. When the variable names equal the field names, use the shorthand `Point { x, y }`. Fields can hold literals or nested patterns, which lets one `match` test some fields and bind others. `..` skips the remaining fields.

  - type: code
    lang: rust
    code: |
      struct Point {
          x: i32,
          y: i32,
      }

      struct Rect {
          top_left: Point,
          width: u32,
          height: u32,
      }

      fn main() {
          let p = Point { x: 0, y: 7 };
          let Point { x: a, y: b } = p;
          println!("a = {a}, b = {b}");

          match p {
              Point { x, y: 0 } => println!("On the x axis at {x}"),
              Point { x: 0, y } => println!("On the y axis at {y}"),
              Point { x, y } => println!("On neither axis: ({x}, {y})"),
          }

          let r = Rect { top_left: Point { x: 2, y: 3 }, width: 10, height: 4 };
          let Rect { top_left: Point { x, .. }, width, .. } = r;
          println!("left edge {x}, width {width}");
      }
    output: |
      a = 0, b = 7
      On the y axis at 7
      left edge 2, width 10

  - type: text
    title: Destructuring enums and nested values
    md: |
      Enum patterns follow the shape of the variant: nothing for unit variants, parentheses for tuple variants, braces for struct variants. Patterns nest as deep as the data does:

  - type: code
    lang: rust
    code: |
      enum Color {
          Rgb(i32, i32, i32),
          Hsv(i32, i32, i32),
      }

      enum Message {
          Quit,
          Move { x: i32, y: i32 },
          Write(String),
          ChangeColor(Color),
      }

      fn handle(msg: Message) {
          match msg {
              Message::Quit => println!("The Quit variant has no data."),
              Message::Move { x, y } => println!("Move to x {x}, y {y}"),
              Message::Write(text) => println!("Text message: {text}"),
              Message::ChangeColor(Color::Rgb(r, g, b)) => {
                  println!("Change color to red {r}, green {g}, blue {b}")
              }
              Message::ChangeColor(Color::Hsv(h, s, v)) => {
                  println!("Change color to hue {h}, saturation {s}, value {v}")
              }
          }
      }

      fn main() {
          handle(Message::Move { x: 3, y: -1 });
          handle(Message::Write(String::from("hello")));
          handle(Message::ChangeColor(Color::Hsv(0, 160, 255)));
          handle(Message::Quit);

          let ((feet, inches), Point3 { x, .. }) = ((3, 10), Point3 { x: 3, y: -10, z: 0 });
          println!("{feet}'{inches}\" and x = {x}");
      }

      struct Point3 {
          x: i32,
          y: i32,
          z: i32,
      }
    output: |
      Move to x 3, y -1
      Text message: hello
      Change color to hue 0, saturation 160, value 255
      The Quit variant has no data.
      3'10" and x = 3

  - type: text
    title: Arrays and slices
    md: |
      *Programming Rust* covers array and slice patterns. An **array** pattern has a fixed length: `[r, g, b]`. A **slice** pattern can match slices of different lengths, so it is refutable: `[]` matches only an empty slice, `[x]` exactly one element, and `..` matches any number in the middle. `rest @ ..` binds the skipped part as a sub-slice.

  - type: code
    lang: rust
    code: |
      fn describe(items: &[i32]) -> String {
          match items {
              [] => String::from("empty"),
              [one] => format!("one item: {one}"),
              [first, second] => format!("a pair: {first} and {second}"),
              [first, .., last] => format!("{} items from {first} to {last}", items.len()),
          }
      }

      fn sum(items: &[i32]) -> i32 {
          match items {
              [] => 0,
              [head, tail @ ..] => head + sum(tail),
          }
      }

      fn main() {
          let [r, g, b] = [255, 128, 0];
          println!("rgb {r} {g} {b}");
          for s in [&[][..], &[7], &[1, 2], &[1, 2, 3, 4]] {
              println!("{}", describe(s));
          }
          println!("sum {}", sum(&[1, 2, 3, 4]));
      }
    output: |
      rgb 255 128 0
      empty
      one item: 7
      a pair: 1 and 2
      4 items from 1 to 4
      sum 10

  - type: text
    title: Ignoring values
    md: |
      - `_` matches anything and **does not bind**. Use it for a whole value, a field, or a parameter you do not need.
      - `_name` is a **variable** whose name starts with an underscore. It binds (and so it **moves** the value), but the compiler does not warn if it is unused.
      - `..` ignores **all remaining** parts of a tuple, tuple struct or struct. It may appear once per tuple pattern: `(first, .., last)` is fine, `(.., x, ..)` is ambiguous.

      The difference between `_` and `_s` matters when ownership is involved:

  - type: code
    lang: rust
    code: |
      fn main() {
          let s = Some(String::from("Hello!"));

          if let Some(_) = s {
              println!("found a string");
          }
          println!("{s:?}"); // fine: `_` did not move the String

          let mut setting_value = Some(5);
          let new_setting_value = Some(10);
          match (setting_value, new_setting_value) {
              (Some(_), Some(_)) => println!("Can't overwrite an existing customized value"),
              _ => setting_value = new_setting_value,
          }
          println!("setting is {setting_value:?}");

          let numbers = (2, 4, 8, 16, 32);
          let (first, .., last) = numbers;
          println!("Some numbers: {first}, {last}");
      }
    output: |
      found a string
      Some("Hello!")
      Can't overwrite an existing customized value
      setting is Some(5)
      Some numbers: 2, 32
    explain: "With `if let Some(_s) = s`, the `String` would be moved into `_s` and the `println!` after it would fail to compile."

  - type: code
    lang: rust
    code: |
      fn main() {
          let numbers = (2, 4, 8, 16, 32);

          match numbers {
              (.., second, ..) => println!("Some numbers: {second}"),
          }
      }
    output: |
      error: `..` can only be used once per tuple pattern
       --> src/main.rs:5:22
        |
      5 |         (.., second, ..) => println!("Some numbers: {second}"),
        |          --          ^^ can only be used once per tuple pattern
        |          |
        |          previously used here
    output_label: Compiler output

  - type: text
    title: Match guards
    md: |
      A **match guard** is an `if` condition after the pattern: `Some(x) if x % 2 == 0 => ...`. The arm matches only if the pattern matches **and** the condition is true. Guards can use variables from outside, which fixes the shadowing problem above. The compiler does not look inside guards when checking exhaustiveness, so you usually still need a final catch-all.

      A guard applies to the **whole** `|` list: `4 | 5 | 6 if y` means `(4 | 5 | 6) if y`, not `4 | 5 | (6 if y)`.

  - type: code
    lang: rust
    code: |
      fn main() {
          let num = Some(4);
          match num {
              Some(x) if x % 2 == 0 => println!("The number {x} is even"),
              Some(x) => println!("The number {x} is odd"),
              None => (),
          }

          let x = Some(5);
          let y = 10;
          match x {
              Some(50) => println!("Got 50"),
              Some(n) if n == y => println!("Matched, n = {n}"),
              _ => println!("Default case, x = {x:?}"),
          }

          let x = 4;
          let y = false;
          match x {
              4 | 5 | 6 if y => println!("yes"),
              _ => println!("no"),
          }
      }
    output: |
      The number 4 is even
      Default case, x = Some(5)
      no

  - type: text
    title: "@ bindings"
    md: |
      `name @ pattern` tests a value against a pattern **and** binds the whole value to `name`. Without it, a range pattern tests but gives you no variable:

  - type: code
    lang: rust
    code: |
      enum Message {
          Hello { id: i32 },
      }

      fn main() {
          for msg in [Message::Hello { id: 5 }, Message::Hello { id: 11 }, Message::Hello { id: 42 }] {
              match msg {
                  Message::Hello { id: id @ 3..=7 } => println!("Found an id in range: {id}"),
                  Message::Hello { id: 10..=12 } => println!("Found an id in another range"),
                  Message::Hello { id } => println!("Found some other id: {id}"),
              }
          }
      }
    output: |
      Found an id in range: 5
      Found an id in another range
      Found some other id: 42

  - type: text
    title: Patterns and references
    md: |
      Matching on a reference raises the question: should the bound variables be copies, moves, or references? *Programming Rust* explains the tools:

      - A **`&` pattern** matches a reference and gives you what it points to: `&(x, y)` against a `&(i32, i32)` binds `i32`s. It only works when the parts can be copied (or are themselves moved out of an owned value).
      - **`ref` and `ref mut`** bind by reference instead of by move: `Some(ref name)` borrows the `String` inside an owned `Option<String>` without moving it.
      - **Default binding modes**: when you match a reference against a non-reference pattern, Rust automatically binds the variables as references. `match &opt { Some(name) => ... }` gives `name: &String`. This is why most modern code rarely writes `ref`.

  - type: code
    lang: rust
    code: |
      fn main() {
          let opt = Some(String::from("Ferris"));

          // default binding mode: matching on &opt binds name as &String
          match &opt {
              Some(name) => println!("hello, {name} ({} bytes)", name.len()),
              None => println!("nobody"),
          }

          // the same with an explicit `ref` on an owned value
          match opt {
              Some(ref name) => println!("still borrowed: {name}"),
              None => (),
          }
          println!("opt is still usable: {opt:?}");

          // `ref mut` and `&mut` default binding to change in place
          let mut pair = (1, String::from("a"));
          let (n, s) = &mut pair;
          *n += 1;
          s.push('!');
          println!("{pair:?}");

          // a & pattern copies the values out of a reference
          let points = [(1, 2), (3, 4)];
          for &(x, y) in points.iter() {
              print!("{} ", x + y);
          }
          println!();
      }
    output: |
      hello, Ferris (6 bytes)
      still borrowed: Ferris
      opt is still usable: Some("Ferris")
      (2, "a!")
      3 7

  - type: table
    title: Pattern syntax at a glance
    headers: ["Pattern", "Example", "Notes"]
    rows:
      - ["literal", "`100`, `'a'`, `\"name\"`", "matches exactly that value"]
      - ["range", "`0..=9`, `'a'..='z'`, `90..`", "integers and chars"]
      - ["or", "`1 | 2 | 3`", "any alternative; all must bind the same names"]
      - ["variable", "`name`, `mut count`", "matches anything and binds it"]
      - ["wildcard", "`_`", "matches anything, binds nothing"]
      - ["tuple / tuple struct", "`(a, _, c)`, `Some(x)`", "positional"]
      - ["struct", "`Point { x, y: 0, .. }`", "by field name; `..` skips the rest"]
      - ["array / slice", "`[a, b, c]`, `[first, .., last]`, `[x, rest @ ..]`", "slices can match different lengths"]
      - ["reference", "`&(x, y)`, `&mut v`", "matches a reference, gives the target"]
      - ["ref binding", "`ref name`, `ref mut name`", "binds by reference instead of moving"]
      - ["binding with @", "`n @ 1..=9`, `all @ Some(_)`", "tests and binds the whole value"]
      - ["guard", "`Some(x) if x > 0`", "not part of the pattern; an extra condition on the arm"]

  - type: playground
    id: ch19-play-commands
    title: "A tiny command parser"
    lang: rust
    md: |
      Split each input line into words and match on the **slice** of words. Use slice patterns, literals, `@` with a range and a guard. Commands: `go <dir>` with `dir` one of north/south/east/west; `take <item>`; `drop all`; `wait <n>` where `n` parses and is between 1 and 9; anything else is unknown.
    task: "Print `going north`, `taking lamp`, `dropping everything`, `waiting 3 turns`, `unknown: wait 30`, `unknown: dance`."
    code: |
      fn run(line: &str) -> String {
          let words: Vec<&str> = line.split_whitespace().collect();
          match words.as_slice() {
              // add the arms here
              _ => format!("unknown: {line}"),
          }
      }

      fn main() {
          for line in ["go north", "take lamp", "drop all", "wait 3", "wait 30", "dance"] {
              println!("{}", run(line));
          }
      }
    expected_output: |
      going north
      taking lamp
      dropping everything
      waiting 3 turns
      unknown: wait 30
      unknown: dance
    solution_code: |
      fn run(line: &str) -> String {
          let words: Vec<&str> = line.split_whitespace().collect();
          match words.as_slice() {
              ["go", dir @ ("north" | "south" | "east" | "west")] => format!("going {dir}"),
              ["take", item] => format!("taking {item}"),
              ["drop", "all"] => String::from("dropping everything"),
              ["wait", n] if matches!(n.parse::<u32>(), Ok(1..=9)) => format!("waiting {n} turns"),
              _ => format!("unknown: {line}"),
          }
      }

      fn main() {
          for line in ["go north", "take lamp", "drop all", "wait 3", "wait 30", "dance"] {
              println!("{}", run(line));
          }
      }
    hints:
      - "String literals can appear in slice patterns of `&str`: `[\"take\", item] => ...`."
      - "`dir @ (\"north\" | \"south\" | \"east\" | \"west\")` binds the matched word."
      - "`matches!(value, pattern)` returns a bool: `matches!(n.parse::<u32>(), Ok(1..=9))`."

  - type: exercise
    id: ch19-ex-patterns
    exercise_dir: ch19-patterns
    title: "Pattern drills"
    difficulty: medium
    goal: "Use ranges, |, struct and slice patterns, guards and @ bindings to replace chains of if statements."
    behavior: |
      Write each function with a single `match` (helpers allowed):
      - `pub fn http_class(code: u16) -> &'static str`: 100–199 `"informational"`, 200–299 `"success"`, 300–399 `"redirect"`, 400–499 `"client error"`, 500–599 `"server error"`, anything else `"invalid"`.
      - `pub fn quadrant(p: Point) -> String` for `pub struct Point { pub x: i32, pub y: i32 }`: `"origin"`, `"x axis"`, `"y axis"`, or `"Q1"`..`"Q4"` (Q1 is x > 0, y > 0; counter-clockwise).
      - `pub fn summarize(v: &[i32]) -> String`: `"empty"`; one item `"just N"`; if the first and last are equal (2+ items) `"bookends N"`; otherwise `"N..M (K items)"` with first, last and length.
      - `pub fn ticket(age: u32, student: bool) -> u32` (price in euros): 0–5 → 0; 6–17 → 5; students 18–25 → 6; 65 and over → 7; everyone else 10.
      - `pub fn describe(t: Token) -> String` for `pub enum Token { Num(i64), Op(char), Ident(String) }`: small numbers 0–9 → `"digit N"`; other numbers `"number N"`; `+ - * /` → `"operator X"`; any other op char → `"unknown op X"`; an identifier starting with `_` → `"private NAME"`; else `"name NAME"`.
    examples:
      - input: "http_class(404)"
        output: "\"client error\""
      - input: "summarize(&[3, 9, 3])"
        output: "\"bookends 3\""
      - input: "ticket(20, true)"
        output: "6"
    hints:
      - "`match (p.x, p.y) { (0, 0) => ..., (_, 0) => ..., (0, _) => ..., (x, y) if x > 0 && y > 0 => ..., ... }`"
      - "`[first, .., last] if first == last => ...` must come before the general `[first, .., last]` arm."
      - "Match a tuple: `match (age, student) { (0..=5, _) => 0, (6..=17, _) => 5, (18..=25, true) => 6, (65.., _) => 7, _ => 10 }`."
      - "For identifiers: `Token::Ident(name) if name.starts_with('_') => ...`."
    rust:
      starter: |
        pub struct Point {
            pub x: i32,
            pub y: i32,
        }

        pub enum Token {
            Num(i64),
            Op(char),
            Ident(String),
        }

        pub fn http_class(code: u16) -> &'static str {
            todo!()
        }

        pub fn quadrant(p: Point) -> String {
            todo!()
        }

        pub fn summarize(v: &[i32]) -> String {
            todo!()
        }

        pub fn ticket(age: u32, student: bool) -> u32 {
            todo!()
        }

        pub fn describe(t: Token) -> String {
            todo!()
        }
      tests: |
        use super::*;

        #[test]
        fn http() {
            assert_eq!(http_class(100), "informational");
            assert_eq!(http_class(204), "success");
            assert_eq!(http_class(301), "redirect");
            assert_eq!(http_class(404), "client error");
            assert_eq!(http_class(599), "server error");
            assert_eq!(http_class(99), "invalid");
            assert_eq!(http_class(600), "invalid");
        }

        #[test]
        fn quadrants() {
            assert_eq!(quadrant(Point { x: 0, y: 0 }), "origin");
            assert_eq!(quadrant(Point { x: 5, y: 0 }), "x axis");
            assert_eq!(quadrant(Point { x: 0, y: -2 }), "y axis");
            assert_eq!(quadrant(Point { x: 1, y: 1 }), "Q1");
            assert_eq!(quadrant(Point { x: -1, y: 1 }), "Q2");
            assert_eq!(quadrant(Point { x: -1, y: -1 }), "Q3");
            assert_eq!(quadrant(Point { x: 1, y: -1 }), "Q4");
        }

        #[test]
        fn summaries() {
            assert_eq!(summarize(&[]), "empty");
            assert_eq!(summarize(&[4]), "just 4");
            assert_eq!(summarize(&[3, 9, 3]), "bookends 3");
            assert_eq!(summarize(&[2, 2]), "bookends 2");
            assert_eq!(summarize(&[1, 5, 8, 2]), "1..2 (4 items)");
        }

        #[test]
        fn tickets() {
            assert_eq!(ticket(3, false), 0);
            assert_eq!(ticket(12, true), 5);
            assert_eq!(ticket(20, true), 6);
            assert_eq!(ticket(20, false), 10);
            assert_eq!(ticket(30, true), 10);
            assert_eq!(ticket(65, false), 7);
            assert_eq!(ticket(80, true), 7);
        }

        #[test]
        fn tokens() {
            assert_eq!(describe(Token::Num(7)), "digit 7");
            assert_eq!(describe(Token::Num(42)), "number 42");
            assert_eq!(describe(Token::Num(-3)), "number -3");
            assert_eq!(describe(Token::Op('*')), "operator *");
            assert_eq!(describe(Token::Op('%')), "unknown op %");
            assert_eq!(describe(Token::Ident(String::from("_tmp"))), "private _tmp");
            assert_eq!(describe(Token::Ident(String::from("count"))), "name count");
        }
      solution: |
        pub struct Point {
            pub x: i32,
            pub y: i32,
        }

        pub enum Token {
            Num(i64),
            Op(char),
            Ident(String),
        }

        pub fn http_class(code: u16) -> &'static str {
            match code {
                100..=199 => "informational",
                200..=299 => "success",
                300..=399 => "redirect",
                400..=499 => "client error",
                500..=599 => "server error",
                _ => "invalid",
            }
        }

        pub fn quadrant(p: Point) -> String {
            let name = match p {
                Point { x: 0, y: 0 } => "origin",
                Point { y: 0, .. } => "x axis",
                Point { x: 0, .. } => "y axis",
                Point { x, y } if x > 0 && y > 0 => "Q1",
                Point { x, y } if x < 0 && y > 0 => "Q2",
                Point { x, y } if x < 0 && y < 0 => "Q3",
                _ => "Q4",
            };
            name.to_string()
        }

        pub fn summarize(v: &[i32]) -> String {
            match v {
                [] => String::from("empty"),
                [only] => format!("just {only}"),
                [first, .., last] if first == last => format!("bookends {first}"),
                [first, .., last] => format!("{first}..{last} ({} items)", v.len()),
            }
        }

        pub fn ticket(age: u32, student: bool) -> u32 {
            match (age, student) {
                (0..=5, _) => 0,
                (6..=17, _) => 5,
                (18..=25, true) => 6,
                (65.., _) => 7,
                _ => 10,
            }
        }

        pub fn describe(t: Token) -> String {
            match t {
                Token::Num(n @ 0..=9) => format!("digit {n}"),
                Token::Num(n) => format!("number {n}"),
                Token::Op(op @ ('+' | '-' | '*' | '/')) => format!("operator {op}"),
                Token::Op(op) => format!("unknown op {op}"),
                Token::Ident(name) if name.starts_with('_') => format!("private {name}"),
                Token::Ident(name) => format!("name {name}"),
            }
        }
    solution_explain: "Each function is one `match` that reads like the specification. Order matters: the guarded `bookends` arm and the `digit` arm must come before the more general arms that would also match."

  - type: exercise
    id: ch19-ex-simplify
    exercise_dir: ch19-simplify
    title: "Simplifying expressions"
    difficulty: hard
    goal: "Match deeply nested enums through Box, combining nested patterns, guards and | to rewrite a tree."
    behavior: |
      Given
      ```rust
      #[derive(Debug, Clone, PartialEq)]
      pub enum Expr {
          Num(i64),
          Var(String),
          Add(Box<Expr>, Box<Expr>),
          Mul(Box<Expr>, Box<Expr>),
          Neg(Box<Expr>),
