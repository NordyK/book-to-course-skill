title: "Under the hood: Future, Pin and streams"
summary: "The Future trait, Poll and Context, what the compiler generates for async fn, why futures must be pinned, Pin and Unpin, the Stream trait for sequences of async values, async closures and async fn in traits, and a hand-written future as an exercise."
minutes: 45
source:
  chapter: ch17
  sections: ["TRPL 17.4 Streams: Futures in Sequence", "TRPL 17.5 A Closer Look at the Traits for Async", "TRPL 17.5 The Future Trait", "TRPL 17.5 The Pin Type and the Unpin Trait", "TRPL 17.5 The Stream Trait", "PR ch20 Pinning", "PR ch20 The Two Life Stages of a Future", "PR ch20 Pinned Pointers", "PR ch20 The Unpin Trait", "PR ch20 Implementing Wakers", "PR ch20 When Is Asynchronous Code Helpful?", "CR Concurrency Afternoon Pin", "CR Concurrency Afternoon Async Traits", "CR Concurrency Afternoon Cancellation"]
blocks:
  - type: text
    md: |
      You have used `Future`, `Poll`, `Context`, `Waker` and `pin!` without the full story. Here it is. The standard library defines:

      ```rust
      pub trait Future {
          type Output;
          fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;
      }

      pub enum Poll<T> {
          Ready(T),
          Pending,
      }
      ```

      - `Output` is what the future produces: for `async fn f() -> u32`, it is `u32`.
      - `poll` tries to make progress. It returns `Ready(value)` when done, or `Pending` if it must wait.
      - The **contract**: a future that returns `Pending` must make sure `cx.waker()` is woken when it can make progress. Otherwise nobody will poll it again and it hangs.
      - After `Ready`, a future must not be polled again.

  - type: stepper
    title: "What .await compiles to"
    steps:
      - title: You write
        code: |
          async fn page_title(url: &str) -> Option<String> {
              let text = get(url).await.text().await;
              parse_title(&text)
          }
      - title: The compiler builds a state machine
        md: "One enum variant per suspension point, holding exactly the variables that live across it."
        code: |
          enum PageTitle<'a> {
              Start { url: &'a str },
              AwaitingGet { fut: GetFuture },
              AwaitingText { fut: TextFuture },
              Done,
          }
      - title: "poll advances it"
        md: "Each `poll` runs from the current state until the next inner future returns `Pending`, saves the state, and returns `Pending` itself. When the last step finishes, it returns `Ready`."
        code: |
          // conceptually, every .await is:
          loop {
              match inner.poll(cx) {
                  Poll::Ready(v) => break v,
                  Poll::Pending => return Poll::Pending, // to our own poller
              }
          }
      - title: Wake-ups travel up
        md: "The innermost future (a socket, a timer) stores the waker. When the event happens it wakes it; the executor polls the outermost future, which re-enters its state machine down to the leaf."

  - type: text
    title: Why Pin?
    md: |
      The state machine may hold a **reference to its own data**: `let text = ...; parse(&text).await` keeps both `text` and a reference to it in the same struct. If the struct were **moved** to another address after that, the reference would point at the old location: a dangling pointer. Such types are called **self-referential**.

      **`Pin<P>`** wraps a pointer (`Pin<&mut T>`, `Pin<Box<T>>`) and promises that the value it points to **will not move again**. `poll` takes `self: Pin<&mut Self>`, so a future can only be polled once it is pinned, and from then on it stays put.

  - type: table
    title: Pinning in practice
    headers: ["You have", "To poll it, use"]
    rows:
      - ["a future in a local variable", "`let mut f = std::pin::pin!(fut);` (pins on the stack)"]
      - ["a future to store or return", "`Box::pin(fut)`, a `Pin<Box<F>>` (pins on the heap)"]
      - ["many futures of different types", "`Vec<Pin<Box<dyn Future<Output = T>>>>`"]
      - ["a type that is `Unpin`", "`Pin::new(&mut x)`: free, since moving it is harmless"]

  - type: callout
    kind: key
    title: Unpin
    md: "Most types do not care whether they move: integers, `String`, `Vec`, your plain structs. They implement the auto trait **`Unpin`**, and for them `Pin` is a formality. Only types that might be self-referential, chiefly the futures generated by `async`, are `!Unpin`. When an API demands `Unpin` and you have an async block, `Box::pin` it. That is why the error message for a missing pin usually suggests exactly that."

  - type: text
    title: Writing a future by hand
    md: |
      A hand-written future is a struct with a state, and a `poll` that checks it. This `Countdown` is ready after being polled `n` times; each time it is not ready, it **wakes itself** so the executor polls it again soon, as `yield_now` does:

  - type: code
    lang: rust
    code: |
      use std::future::Future;
      use std::pin::{Pin, pin};
      use std::sync::Arc;
      use std::task::{Context, Poll, Wake, Waker};
      use std::thread::{self, Thread};

      struct Countdown {
          remaining: u32,
      }

      impl Future for Countdown {
          type Output = &'static str;

          fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output> {
              if self.remaining == 0 {
                  Poll::Ready("liftoff")
              } else {
                  println!("{}...", self.remaining);
                  self.remaining -= 1;
                  cx.waker().wake_by_ref(); // poll me again
                  Poll::Pending
              }
          }
      }

      fn main() {
          println!("{}", block_on(Countdown { remaining: 3 }));
      }

      struct ThreadWaker(Thread);
      impl Wake for ThreadWaker {
          fn wake(self: Arc<Self>) {
              self.0.unpark();
          }
      }
      fn block_on<F: Future>(fut: F) -> F::Output {
          let mut fut = pin!(fut);
          let waker = Waker::from(Arc::new(ThreadWaker(thread::current())));
          let mut cx = Context::from_waker(&waker);
          loop {
              match fut.as_mut().poll(&mut cx) {
                  Poll::Ready(v) => return v,
                  Poll::Pending => thread::park(),
              }
          }
      }
    output: |
      3...
      2...
      1...
      liftoff
    explain: "`Countdown` holds only a `u32`, so it is `Unpin`, and `self.remaining` can be changed through the `Pin<&mut Self>` directly. A future that holds other futures (like `join2`) must poll them through pinned pointers, which is why `join2` boxed them."

  - type: text
    title: Streams
    md: |
      A future produces **one** value. A **stream** produces a **sequence** of values over time: messages from a channel, lines from a socket, ticks of a timer. It is the async version of `Iterator`:

      ```rust
      trait Stream {
          type Item;
          fn poll_next(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Option<Self::Item>>;
      }
      ```

      `Iterator::next` returns `Option<Item>`; `poll_next` returns that **inside** a `Poll`: maybe not yet (`Pending`), the next item (`Ready(Some(item))`), or finished (`Ready(None)`). The standard library does not have `Stream` yet; the `futures` crate and Tokio's `tokio-stream` define it, along with a `StreamExt` trait that adds `next().await`, `map`, `filter`, `throttle`, `timeout` and friends:

      ```rust
      let mut stream = trpl::stream_from_iter(values.iter().map(|n| n * 2));
      while let Some(value) = stream.next().await {
          println!("The value was: {value}");
      }
      ```

  - type: text
    title: Async closures and async fn in traits
    md: |
      Recent Rust lets traits contain `async fn` directly:

      ```rust
      trait Fetcher {
          async fn fetch(&self, url: &str) -> Result<String, Error>;
      }
      ```

      and supports **async closures**, `async |x| { ... }`, whose calls return futures, with matching traits `AsyncFn`, `AsyncFnMut` and `AsyncFnOnce`. One limitation of `async fn` in traits: such traits cannot yet be used as `dyn Trait` trait objects, and callers cannot require the returned future to be `Send`. The `async-trait` crate and the newer `trait-variant` crate cover those cases.

  - type: playground
    id: ch17-play-ticker
    title: "A ticking stream"
    lang: rust
    md: |
      `Ticks` is a minimal stream: each `poll_next` yields the next number until `limit`, then `None`. `next` turns one `poll_next` into a future you can `.await`. Finish `poll_next` and sum the stream in `main` with `while let Some(n) = next(&mut ticks).await`.
    task: "Print `got 1`, `got 2`, `got 3` and `sum = 6`."
    code: |
      use std::future::{Future, poll_fn};
      use std::pin::{Pin, pin};
      use std::sync::Arc;
      use std::task::{Context, Poll, Wake, Waker};
      use std::thread::{self, Thread};

      struct Ticks {
          current: u32,
          limit: u32,
      }

      impl Ticks {
          fn poll_next(&mut self, _cx: &mut Context<'_>) -> Poll<Option<u32>> {
              Poll::Ready(None) // TODO
          }
      }

      async fn next(s: &mut Ticks) -> Option<u32> {
          poll_fn(|cx| s.poll_next(cx)).await
      }

      fn main() {
          let total = block_on(async {
              let mut ticks = Ticks { current: 0, limit: 3 };
              let mut sum = 0;
              // TODO: loop over next(&mut ticks).await
              sum
          });
          println!("sum = {total}");
      }

      struct ThreadWaker(Thread);
      impl Wake for ThreadWaker {
          fn wake(self: Arc<Self>) {
              self.0.unpark();
          }
      }
      fn block_on<F: Future>(fut: F) -> F::Output {
          let mut fut = pin!(fut);
          let waker = Waker::from(Arc::new(ThreadWaker(thread::current())));
          let mut cx = Context::from_waker(&waker);
          loop {
              match fut.as_mut().poll(&mut cx) {
                  Poll::Ready(v) => return v,
                  Poll::Pending => thread::park(),
              }
          }
      }
    expected_output: |
      got 1
      got 2
      got 3
      sum = 6
    solution_code: |
      use std::future::{Future, poll_fn};
      use std::pin::{Pin, pin};
      use std::sync::Arc;
      use std::task::{Context, Poll, Wake, Waker};
      use std::thread::{self, Thread};

      struct Ticks {
          current: u32,
          limit: u32,
      }

      impl Ticks {
          fn poll_next(&mut self, _cx: &mut Context<'_>) -> Poll<Option<u32>> {
              if self.current >= self.limit {
                  Poll::Ready(None)
              } else {
                  self.current += 1;
                  Poll::Ready(Some(self.current))
              }
          }
      }

      async fn next(s: &mut Ticks) -> Option<u32> {
          poll_fn(|cx| s.poll_next(cx)).await
      }

      fn main() {
          let total = block_on(async {
              let mut ticks = Ticks { current: 0, limit: 3 };
              let mut sum = 0;
              while let Some(n) = next(&mut ticks).await {
                  println!("got {n}");
                  sum += n;
              }
              sum
          });
          println!("sum = {total}");
      }

      struct ThreadWaker(Thread);
      impl Wake for ThreadWaker {
          fn wake(self: Arc<Self>) {
              self.0.unpark();
          }
      }
      fn block_on<F: Future>(fut: F) -> F::Output {
          let mut fut = pin!(fut);
          let waker = Waker::from(Arc::new(ThreadWaker(thread::current())));
          let mut cx = Context::from_waker(&waker);
          loop {
              match fut.as_mut().poll(&mut cx) {
                  Poll::Ready(v) => return v,
                  Poll::Pending => thread::park(),
              }
          }
      }
    hints:
      - "`if self.current >= self.limit { Poll::Ready(None) } else { self.current += 1; Poll::Ready(Some(self.current)) }`"
      - "`while let Some(n) = next(&mut ticks).await { println!(\"got {n}\"); sum += n; }`"

  - type: exercise
    id: ch17-ex-futures
    exercise_dir: ch17-futures
    title: "Futures by hand"
    difficulty: hard
    goal: "Implement the Future trait for your own types, write a join combinator, and drive everything with a block_on you complete yourself."
    behavior: |
      Everything is standard library only.
      - `pub fn block_on<F: Future>(fut: F) -> F::Output`: the executor from lesson 1 (a `ThreadWaker` is provided).
      - `pub struct YieldN { pub left: u32 }`: a future returning `Pending` `left` times (decrementing and waking itself each time), then `Ready(())`.
      - `pub struct Flag` with `pub fn new() -> (Flag, Setter)`: a future that completes with `()` once `Setter::set()` has been called (possibly from another thread). `Flag::poll` stores the waker; `set` marks the shared state done and wakes the stored waker. Use `Arc<Mutex<(bool, Option<Waker>)>>` shared by both halves.
      - `pub fn join<A: Future, B: Future>(a: A, b: B) -> impl Future<Output = (A::Output, B::Output)>`: concurrent, as in lesson 2.
    examples:
      - input: "block_on(async { YieldN { left: 3 }.await; 7 })"
        output: "7"
      - input: "block_on(join(async { 1 }, async { \"two\" }))"
        output: "(1, \"two\")"
    hints:
      - "`YieldN::poll`: `if self.left == 0 { Poll::Ready(()) } else { self.left -= 1; cx.waker().wake_by_ref(); Poll::Pending }`."
      - "`Flag::poll`: lock the state; if done, `Ready(())`; else store `Some(cx.waker().clone())` and return `Pending`."
      - "`Setter::set(&self)`: lock, set `done = true`, and `if let Some(w) = state.1.take() { w.wake(); }`."
      - "`join`: `Box::pin` both futures and use `std::future::poll_fn` with two `Option` slots."
    rust:
      starter: |
