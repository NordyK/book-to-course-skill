                self.0.unpark();
            }
        }

        pub fn block_on<F: Future>(fut: F) -> F::Output {
            todo!()
        }

        pub struct YieldN {
            pub left: u32,
        }

        // impl Future for YieldN

        type Shared = Arc<Mutex<(bool, Option<Waker>)>>;

        pub struct Flag {
            state: Shared,
        }

        pub struct Setter {
            state: Shared,
        }

        impl Flag {
            pub fn new() -> (Flag, Setter) {
                todo!()
            }
        }

        impl Setter {
            pub fn set(&self) {
                todo!()
            }
        }

        // impl Future for Flag

        pub fn join<A: Future, B: Future>(a: A, b: B) -> impl Future<Output = (A::Output, B::Output)> {
            async {
                let result: (A::Output, B::Output) = todo!();
                result
            }
        }
      tests: |
        use super::*;
        use std::time::Duration;

        #[test]
        fn runs_plain_async() {
            assert_eq!(block_on(async { 40 + 2 }), 42);
        }

        #[test]
        fn yields() {
            assert_eq!(block_on(async { YieldN { left: 3 }.await; 7 }), 7);
            assert_eq!(block_on(async { YieldN { left: 0 }.await; 1 }), 1);
        }

        #[test]
        fn flag_set_from_another_thread() {
            let (flag, setter) = Flag::new();
            let t = thread::spawn(move || {
                thread::sleep(Duration::from_millis(50));
                setter.set();
            });
            block_on(flag);
            t.join().unwrap();
        }

        #[test]
        fn flag_already_set() {
            let (flag, setter) = Flag::new();
            setter.set();
            block_on(flag);
        }

        #[test]
        fn joins_concurrently() {
            assert_eq!(block_on(join(async { 1 }, async { "two" })), (1, "two"));

            // the second future can only finish if the first is polled concurrently with it
            let (flag, setter) = Flag::new();
            let first = async move {
                YieldN { left: 2 }.await;
                setter.set();
                "set"
            };
            let second = async move {
                flag.await;
                "saw it"
            };
            assert_eq!(block_on(join(second, first)), ("saw it", "set"));
        }
      solution: |
        use std::future::{Future, poll_fn};
        use std::pin::{Pin, pin};
        use std::sync::{Arc, Mutex};
        use std::task::{Context, Poll, Wake, Waker};
        use std::thread::{self, Thread};

        struct ThreadWaker(Thread);

        impl Wake for ThreadWaker {
            fn wake(self: Arc<Self>) {
                self.0.unpark();
            }
        }

        pub fn block_on<F: Future>(fut: F) -> F::Output {
            let mut fut = pin!(fut);
            let waker = Waker::from(Arc::new(ThreadWaker(thread::current())));
            let mut cx = Context::from_waker(&waker);
            loop {
                match fut.as_mut().poll(&mut cx) {
                    Poll::Ready(v) => return v,
                    Poll::Pending => thread::park(),
                }
            }
        }

        pub struct YieldN {
            pub left: u32,
        }

        impl Future for YieldN {
            type Output = ();
            fn poll(mut self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
                if self.left == 0 {
                    Poll::Ready(())
                } else {
                    self.left -= 1;
                    cx.waker().wake_by_ref();
                    Poll::Pending
                }
            }
        }

        type Shared = Arc<Mutex<(bool, Option<Waker>)>>;

        pub struct Flag {
            state: Shared,
        }

        pub struct Setter {
            state: Shared,
        }

        impl Flag {
            pub fn new() -> (Flag, Setter) {
                let state: Shared = Arc::new(Mutex::new((false, None)));
                (Flag { state: Arc::clone(&state) }, Setter { state })
            }
        }

        impl Setter {
            pub fn set(&self) {
                let mut s = self.state.lock().unwrap();
                s.0 = true;
                if let Some(w) = s.1.take() {
                    w.wake();
                }
            }
        }

        impl Future for Flag {
            type Output = ();
            fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
                let mut s = self.state.lock().unwrap();
                if s.0 {
                    Poll::Ready(())
                } else {
                    s.1 = Some(cx.waker().clone());
                    Poll::Pending
                }
            }
        }

        pub fn join<A: Future, B: Future>(a: A, b: B) -> impl Future<Output = (A::Output, B::Output)> {
            let (mut a, mut b) = (Box::pin(a), Box::pin(b));
            let (mut ra, mut rb) = (None, None);
            poll_fn(move |cx| {
                if ra.is_none() {
                    if let Poll::Ready(v) = a.as_mut().poll(cx) {
                        ra = Some(v);
                    }
                }
                if rb.is_none() {
                    if let Poll::Ready(v) = b.as_mut().poll(cx) {
                        rb = Some(v);
                    }
                }
                if ra.is_some() && rb.is_some() {
                    Poll::Ready((ra.take().unwrap(), rb.take().unwrap()))
                } else {
                    Poll::Pending
                }
            })
        }
    solution_explain: "`Flag` and `Setter` are a one-shot notification, the core of every async channel and timer: the future stores its waker, the other side wakes it. The last test is only solvable concurrently: `second` waits on the flag that `first` sets, so a sequential join would wait forever. Locking the same mutex in `poll` and `set` avoids a lost wake-up between checking the flag and storing the waker."

  - type: quiz
    id: ch17-quiz-traits
    title: Check yourself
    questions:
      - type: single
        q: "What must a future do before returning `Poll::Pending`?"
        options: ["Nothing", "Arrange for `cx.waker()` to be woken when it can make progress", "Spawn a thread", "Panic"]
        answer: 1
        explanation: "Otherwise it is never polled again."
      - type: single
        q: "Why does `poll` take `Pin<&mut Self>`?"
        options: ["For speed", "Async state machines may hold references to their own fields, so they must not move once polled", "To allow cloning", "Because futures are Copy"]
        answer: 1
        explanation: "Moving would leave those references dangling."
      - type: single
        q: "Which types are Unpin?"
        options: ["None", "Most ordinary types like i32, String and Vec", "Only futures", "Only Box"]
        answer: 1
        explanation: "Async-generated futures are the main exception."
      - type: single
        q: "What does `Stream::poll_next` return when the stream has finished?"
        options: ["`Poll::Pending`", "`Poll::Ready(None)`", "`None`", "An error"]
        answer: 1
        explanation: "Ready(Some(x)) for items, Ready(None) at the end."
      - type: single
        q: "How do you poll a future stored in a struct field when its type is not Unpin?"
        options: ["Call poll directly", "Store it as `Pin<Box<F>>` and call `.as_mut().poll(cx)`", "Clone it", "You cannot"]
        answer: 1
        explanation: "Box::pin pins it on the heap."

  - type: summary
    points:
      - "`Future::poll` returns `Ready(value)` or `Pending`; `Pending` comes with a promise to wake."
      - "`async fn` becomes a state machine with a state per `.await`."
      - "Pinning keeps self-referential futures in place; use `pin!` locally and `Box::pin` to store."
      - "`Unpin` types can move freely; most types are `Unpin`."
      - "A `Stream` is an async iterator: `poll_next` returns `Poll<Option<Item>>`."
terms:
  - term: Poll
    def: "The result of polling a future: Ready with a value, or Pending."
  - term: Waker
    def: "A handle a pending future uses to tell its executor to poll it again."
  - term: Context
    def: "The argument to poll that carries the Waker."
  - term: "Pin"
    def: "A pointer wrapper guaranteeing that the value it points to will not be moved."
  - term: Unpin
    def: "An auto trait for types that are safe to move even after being pinned."
  - term: self-referential type
    def: "A type containing references to its own data, which would dangle if it moved."
  - term: stream
    def: "An asynchronous sequence of values; the async counterpart of an iterator."
