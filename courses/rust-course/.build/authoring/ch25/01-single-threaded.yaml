      tests: |
        use super::*;
        use std::io::Read;
        use std::net::TcpListener;
        use std::thread;

        fn parse(raw: &str) -> Option<Request> {
            read_request(BufReader::new(raw.as_bytes()))
        }

        fn get(path: &str) -> Request {
            Request { method: "GET".into(), path: path.into(), headers: vec![] }
        }

        #[test]
        fn parses_request() {
            let req = parse("GET /health HTTP/1.1\r\nHost: localhost\r\nUser-Agent:  test \r\n\r\nignored body").unwrap();
            assert_eq!(req.method, "GET");
            assert_eq!(req.path, "/health");
            assert_eq!(req.headers.len(), 2);
            assert_eq!(req.header("host"), Some("localhost"));
            assert_eq!(req.header("USER-AGENT"), Some("test"));
            assert_eq!(req.header("accept"), None);
        }

        #[test]
        fn bare_newlines_and_eof() {
            let req = parse("POST /form HTTP/1.0\nHost: x\n").unwrap();
            assert_eq!(req.method, "POST");
            assert_eq!(req.header("Host"), Some("x"));
        }

        #[test]
        fn bad_requests() {
            for raw in ["", "\r\n", "GET /\r\n\r\n", "GET / FTP/1.0\r\n\r\n", "GET / HTTP/1.1 extra\r\n\r\n"] {
                assert_eq!(parse(raw), None, "{raw:?}");
            }
        }

        #[test]
        fn skips_malformed_headers() {
            let req = parse("GET / HTTP/1.1\r\nno colon here\r\nX-A: 1:2\r\n\r\n").unwrap();
            assert_eq!(req.headers, vec![("X-A".to_string(), "1:2".to_string())]);
        }

        #[test]
        fn reasons_and_format() {
            assert_eq!(reason(200), "OK");
            assert_eq!(reason(400), "BAD REQUEST");
            assert_eq!(reason(404), "NOT FOUND");
            assert_eq!(reason(405), "METHOD NOT ALLOWED");
            assert_eq!(reason(418), "");
            let r = Response { status: 200, body: "héllo".into() };
            assert_eq!(r.to_http(), "HTTP/1.1 200 OK\r\nContent-Length: 6\r\nContent-Type: text/html\r\n\r\nhéllo");
        }

        #[test]
        fn routing() {
            assert_eq!(route(&get("/")), Response { status: 200, body: HELLO_HTML.into() });
            assert_eq!(route(&get("/?x=1")).status, 200);
            assert_eq!(route(&get("/health")).body, "ok");
            assert_eq!(route(&get("/nope")), Response { status: 404, body: NOT_FOUND_HTML.into() });
            assert_eq!(route(&get("/hello?lang=en&name=Ada")).body, "<p>Hello, Ada!</p>");
            assert_eq!(route(&get("/hello")).body, "<p>Hello, stranger!</p>");
            let post = Request { method: "POST".into(), ..get("/") };
            assert_eq!(route(&post), Response { status: 405, body: METHOD_NOT_ALLOWED_HTML.into() });
        }

        fn serve_once(raw: &'static [u8]) -> String {
            let listener = TcpListener::bind("127.0.0.1:0").unwrap();
            let addr = listener.local_addr().unwrap();
            let server = thread::spawn(move || {
                let (stream, _) = listener.accept().unwrap();
                handle_connection(stream);
            });
            let mut client = TcpStream::connect(addr).unwrap();
            client.write_all(raw).unwrap();
            let mut out = String::new();
            client.read_to_string(&mut out).unwrap();
            server.join().unwrap();
            out
        }

        #[test]
        fn end_to_end() {
            let ok = serve_once(b"GET /health HTTP/1.1\r\nHost: x\r\n\r\n");
            assert_eq!(ok, Response { status: 200, body: "ok".into() }.to_http());
            let bad = serve_once(b"NONSENSE\r\n\r\n");
            assert_eq!(bad, Response { status: 400, body: BAD_REQUEST_HTML.into() }.to_http());
        }
      solution: |
        use std::io::{BufRead, BufReader, Write};
        use std::net::TcpStream;

        pub const HELLO_HTML: &str = "<html><body><h1>Hello!</h1></body></html>";
        pub const NOT_FOUND_HTML: &str = "<html><body><h1>Oops!</h1></body></html>";
        pub const BAD_REQUEST_HTML: &str = "<html><body><h1>Bad request</h1></body></html>";
        pub const METHOD_NOT_ALLOWED_HTML: &str = "<html><body><h1>Method not allowed</h1></body></html>";

        #[derive(Debug, Clone, PartialEq)]
        pub struct Request {
            pub method: String,
            pub path: String,
            pub headers: Vec<(String, String)>,
        }

        impl Request {
            pub fn header(&self, name: &str) -> Option<&str> {
                self.headers
                    .iter()
                    .find(|(k, _)| k.eq_ignore_ascii_case(name))
                    .map(|(_, v)| v.as_str())
            }
        }

        #[derive(Debug, Clone, PartialEq)]
        pub struct Response {
            pub status: u16,
            pub body: String,
        }

        pub fn reason(status: u16) -> &'static str {
            match status {
                200 => "OK",
                400 => "BAD REQUEST",
                404 => "NOT FOUND",
                405 => "METHOD NOT ALLOWED",
                _ => "",
            }
        }

        impl Response {
            fn new(status: u16, body: impl Into<String>) -> Response {
                Response { status, body: body.into() }
            }

            pub fn to_http(&self) -> String {
                format!(
                    "HTTP/1.1 {} {}\r\nContent-Length: {}\r\nContent-Type: text/html\r\n\r\n{}",
                    self.status,
                    reason(self.status),
                    self.body.len(),
                    self.body
                )
            }
        }

        pub fn read_request<R: BufRead>(reader: R) -> Option<Request> {
            let mut lines = reader.lines().map_while(Result::ok);
            let first = lines.next()?;
            let parts: Vec<&str> = first.trim_end_matches('\r').split_whitespace().collect();
            if parts.len() != 3 || !parts[2].starts_with("HTTP/") {
                return None;
            }
            let mut headers = Vec::new();
            for line in lines {
                let line = line.trim_end_matches('\r');
                if line.is_empty() {
                    break;
                }
                if let Some((name, value)) = line.split_once(':') {
                    headers.push((name.trim().to_string(), value.trim().to_string()));
                }
            }
            Some(Request { method: parts[0].to_string(), path: parts[1].to_string(), headers })
        }

        pub fn route(req: &Request) -> Response {
            if req.method != "GET" {
                return Response::new(405, METHOD_NOT_ALLOWED_HTML);
            }
            let (path, query) = req.path.split_once('?').unwrap_or((&req.path, ""));
            match path {
                "/" => Response::new(200, HELLO_HTML),
                "/health" => Response::new(200, "ok"),
                "/hello" => {
                    let name = query.split('&').find_map(|kv| kv.strip_prefix("name=")).unwrap_or("stranger");
                    Response::new(200, format!("<p>Hello, {name}!</p>"))
                }
                _ => Response::new(404, NOT_FOUND_HTML),
            }
        }

        pub fn handle_connection(mut stream: TcpStream) {
            let response = match read_request(BufReader::new(&stream)) {
                Some(req) => route(&req),
                None => Response::new(400, BAD_REQUEST_HTML),
            };
            // A client that already hung up is not our problem; ignore the write error.
            let _ = stream.write_all(response.to_http().as_bytes());
        }
    solution_explain: "Splitting the book's `handle_connection` into `read_request`, `route` and `Response::to_http` makes each part testable without a network, and `read_request` takes any `BufRead`, so tests feed it byte strings. Only `handle_connection` touches the socket. A real server would also limit the header size and percent-decode the query string."

  - type: quiz
    id: ch25-quiz-single
    title: Check yourself
    questions:
      - type: single
        q: "What ends the headers of an HTTP request?"
        options: ["A NUL byte", "An empty line", "The Content-Length header", "Closing the connection"]
        answer: 1
        explanation: "\\r\\n on its own line."
      - type: single
        q: "Which is a valid HTTP response status line?"
        options: ["GET / HTTP/1.1", "HTTP/1.1 200 OK", "200 OK HTTP/1.1", "OK 200"]
        answer: 1
        explanation: "Version, code, reason."
      - type: single
        q: "What does Content-Length count?"
        options: ["Characters of the whole response", "Bytes of the body", "Lines of the body", "Headers"]
        answer: 1
        explanation: "Bytes, so use body.len()."
      - type: single
        q: "Why read the whole header block before answering?"
        options: ["Speed", "Closing a socket with unread data can reset the connection and lose the reply", "HTTP requires an echo", "To fill the buffer"]
        answer: 1
        explanation: "The OS sends a reset instead of a normal close."
      - type: single
        q: "What did the book's refactor change?"
        options: ["It added threads", "The if/else only chooses the status line and page; the response is built once", "It removed Content-Length", "It made the server async"]
        answer: 1
        explanation: "Less duplication."

  - type: summary
    points:
      - "TcpListener::bind and incoming() accept connections; each is a TcpStream."
      - "BufReader::lines() reads the request until the empty line."
      - "A response is a status line, headers, an empty line and a body; Content-Length is the body's byte count."
      - "Route by the request line, and build the response in one place."
      - "Separating parsing, routing and formatting makes the server testable without a network."
terms:
  - term: request line
    def: "The first line of an HTTP request: method, target and version, like GET / HTTP/1.1."
  - term: status line
    def: "The first line of an HTTP response: version, status code and reason, like HTTP/1.1 404 NOT FOUND."
  - term: Content-Length
    def: "A header giving the size of the body in bytes."
  - term: routing
    def: "Choosing which code answers a request, usually by method and path."
