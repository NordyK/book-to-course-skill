      tests: |
        use super::*;
        use std::collections::HashSet;
        use std::sync::Barrier;
        use std::time::Duration;

        #[test]
        fn zero_is_an_error() {
            assert_eq!(ThreadPool::build(0).err(), Some(PoolCreationError::ZeroThreads));
            assert_eq!(PoolCreationError::ZeroThreads.to_string(), "a thread pool needs at least one thread");
            assert_eq!(ThreadPool::build(3).unwrap().size(), 3);
            assert_eq!(ThreadPool::new(1).size(), 1);
        }

        #[test]
        #[should_panic]
        fn new_zero_panics() {
            ThreadPool::new(0);
        }

        #[test]
        fn runs_every_job() {
            let pool = ThreadPool::new(4);
            let (tx, rx) = mpsc::channel();
            for n in 0..50 {
                let tx = tx.clone();
                pool.execute(move || tx.send(n).unwrap());
            }
            drop(tx);
            let mut got: Vec<i32> = rx.iter().take(50).collect();
            got.sort();
            assert_eq!(got, (0..50).collect::<Vec<_>>());
        }

        #[test]
        fn jobs_run_on_pool_threads() {
            let pool = ThreadPool::new(3);
            let (tx, rx) = mpsc::channel();
            for _ in 0..30 {
                let tx = tx.clone();
                pool.execute(move || {
                    thread::sleep(Duration::from_millis(2));
                    tx.send(thread::current().id()).unwrap();
                });
            }
            let ids: HashSet<_> = (0..30).map(|_| rx.recv_timeout(Duration::from_secs(5)).unwrap()).collect();
            assert!(ids.len() <= 3, "used {} threads", ids.len());
            assert!(!ids.contains(&thread::current().id()), "jobs must not run on the caller's thread");
        }

        #[test]
        fn runs_in_parallel() {
            // every job waits until all four are running; a pool that runs one job at a time never gets there
            let pool = ThreadPool::new(4);
            let barrier = Arc::new(Barrier::new(4));
            let (tx, rx) = mpsc::channel();
            for _ in 0..4 {
                let (barrier, tx) = (Arc::clone(&barrier), tx.clone());
                pool.execute(move || {
                    barrier.wait();
                    tx.send(()).unwrap();
                });
            }
            for _ in 0..4 {
                rx.recv_timeout(Duration::from_secs(5)).expect("jobs did not run at the same time");
            }
        }

        #[test]
        fn closures_can_own_data() {
            let pool = ThreadPool::new(2);
            let (tx, rx) = mpsc::channel();
            let data = vec![1, 2, 3];
            let name = String::from("sum");
            pool.execute(move || tx.send(format!("{name} = {}", data.iter().sum::<i32>())).unwrap());
            assert_eq!(rx.recv_timeout(Duration::from_secs(5)).unwrap(), "sum = 6");
        }
      solution: |
        use std::fmt;
        use std::sync::{Arc, Mutex, mpsc};
        use std::thread;

        #[derive(Debug, Clone, PartialEq, Eq)]
        pub enum PoolCreationError {
            ZeroThreads,
        }

        impl fmt::Display for PoolCreationError {
            fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                match self {
                    PoolCreationError::ZeroThreads => write!(f, "a thread pool needs at least one thread"),
                }
            }
        }

        impl std::error::Error for PoolCreationError {}

        type Job = Box<dyn FnOnce() + Send + 'static>;

        pub struct ThreadPool {
            workers: Vec<Worker>,
            sender: mpsc::Sender<Job>,
        }

        impl ThreadPool {
            pub fn build(size: usize) -> Result<ThreadPool, PoolCreationError> {
                if size == 0 {
                    return Err(PoolCreationError::ZeroThreads);
                }
                let (sender, receiver) = mpsc::channel();
                let receiver = Arc::new(Mutex::new(receiver));
                let workers = (0..size).map(|id| Worker::new(id, Arc::clone(&receiver))).collect();
                Ok(ThreadPool { workers, sender })
            }

            pub fn new(size: usize) -> ThreadPool {
                Self::build(size).unwrap_or_else(|e| panic!("{e}"))
            }

            pub fn size(&self) -> usize {
                self.workers.len()
            }

            pub fn execute<F>(&self, f: F)
            where
                F: FnOnce() + Send + 'static,
            {
                self.sender.send(Box::new(f)).expect("workers are running while the pool exists");
            }
        }

        #[allow(dead_code)]
        struct Worker {
            id: usize,
            thread: thread::JoinHandle<()>,
        }

        impl Worker {
            fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {
                let thread = thread::spawn(move || loop {
                    let message = receiver.lock().unwrap().recv();
                    match message {
                        Ok(job) => job(),
                        Err(_) => break,
                    }
                });
                Worker { id, thread }
            }
        }
    solution_explain: "The pool is a `Sender` plus workers that share one `Receiver` through `Arc<Mutex<...>>`. Taking the job in its own `let` statement releases the lock before the job runs, which is what lets the barrier test pass. `build` returns a typed error that implements `Error`, so callers can use `?` with it, while `new` keeps the book's panicking API on top of it."

  - type: quiz
    id: ch25-quiz-pool
    title: Check yourself
    questions:
      - type: single
        q: "What is the main problem with spawning a thread per connection?"
        options: ["Threads cannot use TcpStream", "There is no limit, so a flood of requests can exhaust the machine", "It is slower than one thread", "Closures cannot move streams"]
        answer: 1
        explanation: "The pool bounds the number of threads."
      - type: single
        q: "Why is a job `Box<dyn FnOnce() + Send + 'static>`?"
        options: ["Boxes are faster", "Every closure has its own type, so a trait object lets one channel carry them all", "FnOnce must be boxed", "To allow recursion"]
        answer: 1
        explanation: "A channel has one element type."
      - type: single
        q: "Why is the receiver wrapped in `Arc<Mutex<...>>`?"
        options: ["To make it Copy", "Several workers own it (Arc) and only one may take a job at a time (Mutex)", "Channels require it", "To make recv non-blocking"]
        answer: 1
        explanation: "mpsc has a single consumer."
      - type: single
        q: "Why does `while let Ok(job) = receiver.lock().unwrap().recv()` serialize the pool?"
        options: ["recv is slow", "The MutexGuard lives until the end of the loop body, so the lock is held while the job runs", "while let cannot call closures", "It drops the job"]
        answer: 1
        explanation: "A let statement drops its temporaries at its end; while let keeps them for the block."
      - type: single
        q: "Which bounds does `execute` copy from `thread::spawn`?"
        options: ["Fn + Sync", "FnOnce + Send + 'static", "FnMut + Copy", "Fn + 'static"]
        answer: 1
        explanation: "Run once, on another thread, with no borrowed data."

  - type: summary
    points:
      - "One slow request blocks a single-threaded server; a thread per connection has no upper bound."
      - "A thread pool runs at most N jobs at once and queues the rest."
      - "Design the API first (new, execute) and let compiler errors guide the implementation."
      - "Workers own JoinHandles and share one Receiver<Job> through Arc<Mutex<...>>; jobs are boxed FnOnce trait objects."
      - "Receive in a plain let so the MutexGuard is dropped before the job runs; while let would hold it."
terms:
  - term: thread pool
    def: "A fixed set of threads that take tasks from a shared queue."
  - term: worker
    def: "One thread of the pool together with its id; it loops taking and running jobs."
  - term: job
    def: "A unit of work sent to the pool, here a boxed closure."
  - term: compiler-driven development
    def: "Writing the code you want to call first, then fixing compiler errors until it works."
