      tests: |
        use super::*;
        use std::time::Duration;

        #[test]
        #[should_panic]
        fn zero_threads_panics() {
            ThreadPool::new(0);
        }

        #[test]
        fn drop_waits_for_every_job() {
            let counter = Arc::new(AtomicUsize::new(0));
            let pool = ThreadPool::new(3);
            for _ in 0..20 {
                let counter = Arc::clone(&counter);
                pool.execute(move || {
                    thread::sleep(Duration::from_millis(2));
                    counter.fetch_add(1, Ordering::SeqCst);
                })
                .unwrap();
            }
            drop(pool);
            assert_eq!(counter.load(Ordering::SeqCst), 20);
        }

        #[test]
        fn queued_jobs_run_before_shutdown_returns() {
            let mut pool = ThreadPool::new(1);
            pool.execute(|| thread::sleep(Duration::from_millis(50))).unwrap();
            for _ in 0..5 {
                pool.execute(|| {}).unwrap();
            }
            pool.shutdown();
            assert_eq!(pool.completed(), 6);
            assert_eq!(pool.panicked(), 0);
        }

        #[test]
        fn execute_after_shutdown_is_an_error() {
            let mut pool = ThreadPool::new(2);
            pool.shutdown();
            assert_eq!(pool.execute(|| {}), Err(PoolClosed));
            pool.shutdown(); // twice is fine
        }

        #[test]
        fn panicking_jobs_do_not_kill_workers() {
            let pool = ThreadPool::new(2);
            for _ in 0..3 {
                pool.execute(|| panic!("job failed on purpose")).unwrap();
            }
            for _ in 0..5 {
                pool.execute(|| thread::sleep(Duration::from_millis(1))).unwrap();
            }
            assert_eq!(pool.join(), (5, 3));
        }

        #[test]
        fn counts_are_live() {
            let pool = ThreadPool::new(2);
            let (tx, rx) = mpsc::channel();
            pool.execute(move || tx.send(()).unwrap()).unwrap();
            rx.recv_timeout(Duration::from_secs(5)).unwrap();
            let mut waited = 0;
            while pool.completed() < 1 && waited < 500 {
                thread::sleep(Duration::from_millis(1));
                waited += 1;
            }
            assert_eq!(pool.completed(), 1);
        }
      solution: |
        use std::panic::{self, AssertUnwindSafe};
        use std::sync::atomic::{AtomicUsize, Ordering};
        use std::sync::{Arc, Mutex, mpsc};
        use std::thread;

        #[derive(Debug, Clone, Copy, PartialEq, Eq)]
        pub struct PoolClosed;

        type Job = Box<dyn FnOnce() + Send + 'static>;

        pub struct ThreadPool {
            workers: Vec<thread::JoinHandle<()>>,
            sender: Option<mpsc::Sender<Job>>,
            completed: Arc<AtomicUsize>,
            panicked: Arc<AtomicUsize>,
        }

        impl ThreadPool {
            pub fn new(size: usize) -> ThreadPool {
                assert!(size > 0, "a thread pool needs at least one thread");
                let (sender, receiver) = mpsc::channel::<Job>();
                let receiver = Arc::new(Mutex::new(receiver));
                let completed = Arc::new(AtomicUsize::new(0));
                let panicked = Arc::new(AtomicUsize::new(0));
                let workers = (0..size)
                    .map(|_| {
                        let receiver = Arc::clone(&receiver);
                        let completed = Arc::clone(&completed);
                        let panicked = Arc::clone(&panicked);
                        thread::spawn(move || loop {
                            let message = receiver.lock().unwrap().recv();
                            let Ok(job) = message else { break };
                            match panic::catch_unwind(AssertUnwindSafe(job)) {
                                Ok(()) => completed.fetch_add(1, Ordering::SeqCst),
                                Err(_) => panicked.fetch_add(1, Ordering::SeqCst),
                            };
                        })
                    })
                    .collect();
                ThreadPool { workers, sender: Some(sender), completed, panicked }
            }

            pub fn execute<F>(&self, f: F) -> Result<(), PoolClosed>
            where
                F: FnOnce() + Send + 'static,
            {
                let sender = self.sender.as_ref().ok_or(PoolClosed)?;
                sender.send(Box::new(f)).map_err(|_| PoolClosed)
            }

            pub fn completed(&self) -> usize {
                self.completed.load(Ordering::SeqCst)
            }

            pub fn panicked(&self) -> usize {
                self.panicked.load(Ordering::SeqCst)
            }

            pub fn shutdown(&mut self) {
                drop(self.sender.take());
                for worker in self.workers.drain(..) {
                    worker.join().expect("workers catch job panics, so they do not panic themselves");
                }
            }

            pub fn join(mut self) -> (usize, usize) {
                self.shutdown();
                (self.completed(), self.panicked())
            }
        }

        impl Drop for ThreadPool {
            fn drop(&mut self) {
                self.shutdown();
            }
        }
    solution_explain: "`shutdown` is idempotent because both `Option::take` and `drain` leave nothing behind, so `join` and `Drop` can share it. `catch_unwind` turns a job's panic into a value, which keeps the worker looping; `AssertUnwindSafe` is needed because a boxed `FnOnce` is not known to be unwind-safe, and it is fine here since the job's state is gone after a panic. The lock is released before the job runs, so a panic can never poison it."

  - type: text
    title: Where to go from here
    md: |
      The book closes with ideas for improving the server, each a good exercise in a part of this course:

      - Add documentation to `ThreadPool` and its public methods, and tests of the library (chapters 11 and 14).
      - Replace the `unwrap` calls with real error handling (chapter 9), and handle a client that sends garbage (you did in the first exercise).
      - Use the pool for something other than web requests.
      - Compare with production crates: **`rayon`** for data-parallel thread pools, **`tokio`** and **`axum`** or **`hyper`** for async servers that handle tens of thousands of connections (chapter 17), and **`signal-hook`** to shut down on Ctrl-C (chapter 24).

      *Comprehensive Rust*'s idiomatic-Rust day adds habits worth keeping: run **`cargo clippy`** and **`rustfmt`** on every project, follow the **Rust API Guidelines** for naming and conversions (`new`, `build`, `as_`, `to_`, `into_`), make invalid states unrepresentable with types (chapters 5, 18 and 24), and prefer returning `Result` to panicking in libraries.

      You started this course with `println!("Hello, world!")`. You can now read and write ownership-checked code, model data with enums and traits, write tests, build concurrent and async programs, use unsafe code and FFI responsibly, and work below the standard library. The best next step is a project of your own.

  - type: quiz
    id: ch25-quiz-shutdown
    title: Check yourself
    questions:
      - type: single
        q: "Why does `worker.thread.join()` fail to compile inside `drop(&mut self)` when iterating `&mut self.workers`?"
        options: ["join is unsafe", "join takes the handle by value, and we only have a mutable reference", "Drop cannot call functions", "Threads are not Send"]
        answer: 1
        explanation: "drain(..) gives the workers by value."
      - type: single
        q: "Why must `drop` drop the sender before joining?"
        options: ["Order does not matter", "Otherwise workers wait on recv forever and join never returns", "To free memory sooner", "The sender is not Send"]
        answer: 1
        explanation: "Closing the channel makes recv return Err."
      - type: single
        q: "After the sender is dropped, what happens to jobs still in the channel?"
        options: ["They are discarded", "They are still received and run; recv fails only when the queue is empty", "They panic", "They run on the main thread"]
        answer: 1
        explanation: "Shutdown finishes the queue."
      - type: single
        q: "Why is the sender stored as `Option<Sender<Job>>`?"
        options: ["Senders can be null", "So Drop can move it out with take() while the pool still exists", "For speed", "Channels require it"]
        answer: 1
        explanation: "take() leaves None behind."
      - type: single
        q: "What keeps a worker alive when a job panics?"
        options: ["Mutex poisoning", "Running the job inside catch_unwind", "Joining it", "Using while let"]
        answer: 1
        explanation: "The panic becomes an Err value."

  - type: summary
    points:
      - "Graceful shutdown belongs in Drop: close the channel, then join every worker."
      - "join consumes the handle; Vec::drain(..) hands out workers by value from &mut self."
      - "Store the sender as Option and take() it; recv returns Err once the channel is closed and empty."
      - "Release the lock before running a job, and run jobs inside catch_unwind so a panic cannot kill or poison the pool."
      - "Next: rayon, tokio and axum in practice, clippy and rustfmt always, and a project of your own."
terms:
  - term: graceful shutdown
    def: "Stopping a program by letting work in progress finish and releasing resources, instead of killing it."
  - term: Vec::drain
    def: "A method that removes a range of elements from a vector and yields them by value."
  - term: Option::take
    def: "Moves the value out of an Option, leaving None in its place."
  - term: catch_unwind
    def: "Runs a closure and turns a panic inside it into an Err value."
