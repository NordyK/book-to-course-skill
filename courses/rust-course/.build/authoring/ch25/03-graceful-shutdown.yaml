    title: "Wait for the workers"
    lang: rust
    md: |
      This pool has no `Drop`, so `main` reads the counter as soon as the pool goes out of scope, while the workers are still busy. Implement `Drop for ThreadPool`: close the channel with `self.sender.take()`, then join every worker taken out with `self.workers.drain(..)`.
