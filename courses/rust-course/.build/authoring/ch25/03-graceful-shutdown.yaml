title: "Graceful shutdown and where to go next"
summary: "Implementing Drop for the ThreadPool, the cannot-move-out-of-a-mutable-reference error and Vec::drain, closing the channel with Option::take so workers leave their loops, the final server that stops after two requests, keeping workers alive when a job panics, and ideas for taking the project and your Rust further."
minutes: 40
source:
  chapter: ch25
  sections: ["TRPL 21.3 Graceful Shutdown and Cleanup", "TRPL 21.3 Implementing the Drop Trait on ThreadPool", "TRPL 21.3 Signaling to the Threads to Stop Listening for Jobs", "TRPL 21 Summary", "CR XV Idiomatic Rust", "CR XVII Final Words"]
blocks:
  - type: text
    md: |
      The pool works, but stopping it is crude: Ctrl-C kills the process, and every thread dies on the spot, even one halfway through writing a response. A **graceful shutdown** lets each worker finish the job it has, then stop, and the program waits for all of them. In Rust the natural place for cleanup is **`Drop`** (chapter 15): when the `ThreadPool` goes out of scope, it should join its threads.

  - type: text
    title: "First attempt: join in Drop"
    md: |
      `JoinHandle::join` takes `self`, it consumes the handle. But `drop` only gets `&mut self`, so iterating gives `&mut Worker`, and we cannot move the handle out from behind a mutable reference:

  - type: code
    lang: rust
    output_label: Compiler output
    code: |
      use std::thread;

      struct Worker {
          id: usize,
          thread: thread::JoinHandle<()>,
      }

      struct ThreadPool {
          workers: Vec<Worker>,
      }

      impl Drop for ThreadPool {
          fn drop(&mut self) {
              for worker in &mut self.workers {
                  println!("Shutting down worker {}", worker.id);
                  worker.thread.join().unwrap();
              }
          }
      }

      fn main() {}
    output: |
      error[E0507]: cannot move out of `worker.thread` which is behind a mutable reference
        --> src/main.rs:16:13
         |
      16 |             worker.thread.join().unwrap();
         |             ^^^^^^^^^^^^^ ------ `worker.thread` moved due to this method call
         |             |
         |             move occurs because `worker.thread` has type `JoinHandle<()>`, which does not implement the `Copy` trait
         |
      note: `JoinHandle::<T>::join` takes ownership of the receiver `self`, which moves `worker.thread`
        --> /rustc/2d8144b7880597b6e6d3dfd63a9a9efae3f533d3/library/std/src/thread/join_handle.rs:149:16
    explain: "The compiler even suggests the classic fix: wrap the handle in an `Option` and `take()` it. The book prefers not to, because then every other use of `thread` has to deal with an `Option` that is only ever `None` during drop."

  - type: text
    md: |
      The cleaner fix is **`Vec::drain(..)`**: it removes every element from the vector and yields them **by value**, so each worker, and its handle, is ours to consume:

      ```rust
      for worker in self.workers.drain(..) {
          println!("Shutting down worker {}", worker.id);
          worker.thread.join().unwrap();
      }
      ```

      That compiles, and then the program **hangs**: each worker loops forever waiting on `recv`, so `join` never returns. The workers need to be told to stop.

  - type: text
    title: Closing the channel
    md: |
      When every `Sender` is dropped, the channel is closed and `recv` returns `Err`. So `Drop` first drops the pool's sender, then joins the workers, and each worker leaves its loop when `recv` fails. To move the sender out of `&mut self`, the pool stores it as **`Option<Sender<Job>>`** and calls `take()`; here an `Option` is the right tool, because the sender really does go away while the pool still exists. The order inside `drop` matters: drop the sender first, or the joins wait forever.

  - type: code
    lang: rust
    code: |
      use std::sync::atomic::{AtomicUsize, Ordering};
      use std::sync::{Arc, Mutex, mpsc};
      use std::thread;
      use std::time::Duration;

      type Job = Box<dyn FnOnce() + Send + 'static>;

      pub struct ThreadPool {
          workers: Vec<Worker>,
          sender: Option<mpsc::Sender<Job>>,
      }

      impl ThreadPool {
          pub fn new(size: usize) -> ThreadPool {
              assert!(size > 0);
              let (sender, receiver) = mpsc::channel();
              let receiver = Arc::new(Mutex::new(receiver));
              let workers = (0..size).map(|id| Worker::new(id, Arc::clone(&receiver))).collect();
              ThreadPool { workers, sender: Some(sender) }
          }

          pub fn execute<F>(&self, f: F)
          where
              F: FnOnce() + Send + 'static,
          {
              self.sender.as_ref().unwrap().send(Box::new(f)).unwrap();
          }
      }

      impl Drop for ThreadPool {
          fn drop(&mut self) {
              drop(self.sender.take()); // close the channel
              for worker in self.workers.drain(..) {
                  worker.thread.join().unwrap(); // wait for its last job
              }
          }
      }

      #[allow(dead_code)]
      struct Worker {
          id: usize,
          thread: thread::JoinHandle<()>,
      }

      impl Worker {
          fn new(id: usize, receiver: Arc<Mutex<mpsc::Receiver<Job>>>) -> Worker {
              let thread = thread::spawn(move || loop {
                  let message = receiver.lock().unwrap().recv();
                  match message {
                      Ok(job) => job(),
                      Err(_) => break, // channel closed: shut down
                  }
              });
              Worker { id, thread }
          }
      }

      fn main() {
          let finished = Arc::new(AtomicUsize::new(0));
          {
              let pool = ThreadPool::new(4);
              for _ in 0..8 {
                  let finished = Arc::clone(&finished);
                  pool.execute(move || {
                      thread::sleep(Duration::from_millis(50));
                      finished.fetch_add(1, Ordering::SeqCst);
                  });
              }
              println!("queued 8 jobs, finished so far: {}", finished.load(Ordering::SeqCst));
          } // pool dropped here: the channel closes, the queue drains, every worker is joined
          println!("after the pool is dropped: {}", finished.load(Ordering::SeqCst));
      }
    output: |
      queued 8 jobs, finished so far: 0
      after the pool is dropped: 8
    explain: "Jobs already in the channel are still delivered after the sender is dropped; `recv` only fails once the queue is empty. So dropping the pool finishes all queued work, not just the jobs in progress."

  - type: text
    title: The finished server
    md: |
      To see the shutdown happen, the book makes `main` accept only two requests, with `listener.incoming().take(2)`. After the loop, `pool` goes out of scope and `Drop` runs. With the book's messages added to the worker and to `drop`, the whole program is:

  - type: code
    lang: rust
    file: src/main.rs
    code: |
      use hello::ThreadPool;
      use std::{
          fs,
          io::{BufReader, prelude::*},
          net::{TcpListener, TcpStream},
          thread,
          time::Duration,
      };

      fn main() {
          let listener = TcpListener::bind("127.0.0.1:7878").unwrap();
          let pool = ThreadPool::new(4);

          for stream in listener.incoming().take(2) {
              let stream = stream.unwrap();
              pool.execute(|| {
                  handle_connection(stream);
              });
          }

          println!("Shutting down.");
      }

      fn handle_connection(mut stream: TcpStream) {
          let buf_reader = BufReader::new(&stream);
          let request_line = buf_reader.lines().next().unwrap().unwrap();

          let (status_line, filename) = match &request_line[..] {
              "GET / HTTP/1.1" => ("HTTP/1.1 200 OK", "hello.html"),
              "GET /sleep HTTP/1.1" => {
                  thread::sleep(Duration::from_secs(5));
                  ("HTTP/1.1 200 OK", "hello.html")
              }
              _ => ("HTTP/1.1 404 NOT FOUND", "404.html"),
          };

          let contents = fs::read_to_string(filename).unwrap();
          let length = contents.len();
          let response = format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}");
          stream.write_all(response.as_bytes()).unwrap();
      }
    explain: "This is the book's final `main.rs`; the library is the pool above, with `println!(\"Worker {id} got a job; executing.\")` in the worker, `println!(\"Worker {id} disconnected; shutting down.\")` before its `break`, and `println!(\"Shutting down worker {}\", worker.id)` in `drop`. It needs `hello.html` and `404.html` next to `Cargo.toml` and a browser, so run it on your own machine."

  - type: text
    md: |
      Making two requests prints something like the following. The order varies from run to run, because the four workers are real threads; the shape does not: two jobs are executed, `Shutting down.` appears when `main` leaves the loop, every worker reports that its channel closed, and every worker is joined.

  - type: code
    lang: text
    code: |
      Worker 0 got a job; executing.
      Shutting down.
      Shutting down worker 0
      Worker 3 got a job; executing.
      Worker 1 disconnected; shutting down.
      Worker 2 disconnected; shutting down.
      Worker 3 disconnected; shutting down.
      Worker 0 disconnected; shutting down.
      Shutting down worker 1
      Shutting down worker 2
      Shutting down worker 3
    explain: "Worker 3 took the second request while `main` was already waiting to join worker 0: shutdown does not cut off work in progress."

  - type: callout
    kind: tip
    title: "One more failure mode: panicking jobs"
    md: "If a job panics, the panic unwinds through the worker's loop and that thread dies; the pool silently gets smaller, and when the last worker dies, queued jobs are never run. Worse, a panic while a worker holds the `Mutex` poisons it, and every other worker's `lock().unwrap()` panics too. Since our worker releases the lock before running the job, poisoning cannot happen here, and running each job inside `std::panic::catch_unwind(AssertUnwindSafe(job))` keeps the worker alive. The exercise asks for exactly that."

  - type: playground
